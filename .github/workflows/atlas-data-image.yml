name: atlas-data image build and publish

# Builds the polyglot Dagster code-location image from atlas-data/.
# - PRs: build only (verify Dockerfile + deps still resolve).
# - Push to main: build + push to GHCR with date-prefixed SHA tags. Never `:latest`
#   because Helm needs unique tags to roll a code-location pod (per UIS
#   Dagster INVESTIGATE).
#
# Triggers only on atlas-data/** changes + this workflow file. The website
# workflow has its own separate trigger; image rebuilds don't fire on docs
# edits.

on:
  pull_request:
    paths:
      - 'atlas-data/**'
      - '.github/workflows/atlas-data-image.yml'
  push:
    branches:
      - main
    paths:
      - 'atlas-data/**'
      - '.github/workflows/atlas-data-image.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to cut the release that carries uis-artifact.json
  packages: write   # needed to push to GHCR on main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atlas-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Date-prefixed SHA gives human-readable + unique tags. Per UIS Dagster
          # doc: never use `:latest` — Helm's image-field-change rollout
          # detection needs unique values.
          DATE=$(date -u +'%Y%m%d')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${DATE}-${SHORT_SHA},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          # The single immutable tag, on its own: the UIS install artifact is
          # published at exactly this value so the definition and the image it
          # names are the same release.
          echo "immutable=v${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # The install definition is validated on every PR that touches atlas-data,
      # with a synthetic tag, and thrown away. A definition that cannot render is
      # a broken install, and it should fail here rather than on someone's
      # cluster.
      - name: Validate the UIS install definition (PR)
        if: github.event_name == 'pull_request'
        run: atlas-data/uis/render-template-info.sh v20260101-0000000 "$RUNNER_TEMP/template-info.yaml"

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: atlas-data
          file: atlas-data/deploy/Dockerfile
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (main)
        id: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: atlas-data
          file: atlas-data/deploy/Dockerfile
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # The UIS install definition, published as an OCI artifact beside the
      # image at the SAME immutable tag.
      #
      # Per urb-agents #362/#480 the artifact carries template-info.yaml and the
      # single-file init/ ONLY — never migrations/, which Dagster's
      # raw/_migrations asset owns. Shipping them in both places would put the
      # same 51 files in two published locations from one commit with nothing
      # enforcing that they match.
      # ---------------------------------------------------------------------
      - name: Set up ORAS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: oras-project/setup-oras@v1

      - name: Publish UIS install definition (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: atlas-data
        run: |
          set -euo pipefail
          TAG='${{ steps.tags.outputs.immutable }}'
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/uis:${TAG}"

          # The digest of the image THIS run just pushed, straight from
          # build-push-action — not looked up afterwards from a tag, which could
          # already have moved and would defeat the point of declaring it.
          IMAGE_DIGEST='${{ steps.build.outputs.digest }}'
          if [[ -z "$IMAGE_DIGEST" ]]; then
            echo "::error::build-push-action reported no digest — refusing to publish a definition that cannot pin its image" >&2
            exit 1
          fi

          # Renders into place and refuses anything that would fail late.
          uis/render-template-info.sh "$TAG" template-info.yaml "$IMAGE_DIGEST"

          # 🔴 A publish must never carry the PR path's all-zero placeholder. The
          # renderer accepts it so a pull request can validate the definition
          # without an image; this is the assertion that it cannot escape onto a
          # cluster. Checked on the rendered file rather than the variable,
          # because what ships is the file.
          if grep -q 'digest: sha256:0\{64\}' template-info.yaml; then
            echo "::error::the rendered definition carries the placeholder digest — this would pin the image to nothing" >&2
            exit 1
          fi

          # ORAS reads the credentials docker/login-action already wrote.
          oras push "$REF" template-info.yaml uis/init/ | tee /tmp/oras.out

          # The digest is what UIS pulls; the tag is only displayed. Take it from
          # the `Digest:` line specifically rather than the first sha256 anywhere
          # in the output, and FAIL if it cannot be read: a provenance record
          # that silently says "unknown" is worse than no record.
          DIGEST=$(awk '/^Digest: /{print $2; exit}' /tmp/oras.out)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the artifact digest from oras output" >&2
            cat /tmp/oras.out >&2
            exit 1
          fi

          # The record dev-templates consumes (urb-agents #483). It exists so the
          # digest reaching the catalogue is the one THIS build produced, rather
          # than something re-resolved from the tag later — a tag can be
          # re-pointed, and a catalogue that re-resolves would bless the new
          # artifact silently.
          cat > uis-artifact.json <<JSON
          {
            "id": "atlas",
            "tag": "${TAG}",
            "artifact": "${REF}",
            "digest": "${DIGEST}",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}",
            "commit": "${GITHUB_SHA}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          python3 -m json.tool uis-artifact.json > /dev/null   # fail on malformed JSON

          {
            echo "### UIS install definition published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| artifact | \`${REF}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| image it names | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The digest reaches dev-templates as a release asset rather than by
      # re-resolving the tag. A tag can be re-pointed at a different artifact; a
      # catalogue that re-resolves would bless the new one silently, and UIS pins
      # no version of the registry so nothing downstream could tell.
      #
      # A release rather than a commit back to main on purpose: committing would
      # push to main touching atlas-data/**, retriggering this very workflow.
      # Creating a tag does not match `push: branches: [main]`, so there is no
      # loop to guard against.
      - name: Publish the artifact digest as a release asset (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: atlas-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.tags.outputs.immutable }}'
          DIGEST=$(python3 -c 'import json;print(json.load(open("uis-artifact.json"))["digest"])')

          # Idempotent: re-running a failed job must not die on "already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing the asset"
            gh release upload "$TAG" uis-artifact.json --clobber
            exit 0
          fi

          gh release create "$TAG" uis-artifact.json \
            --title "atlas-data $TAG" \
            --notes "UIS install artifact: \`ghcr.io/${{ env.IMAGE_NAME }}/uis:${TAG}\`
          Digest: \`${DIGEST}\`
          Image: \`ghcr.io/${{ env.IMAGE_NAME }}:${TAG}\`

          \`uis-artifact.json\` below is the machine-readable form, for the dev-templates catalogue entry (urb-agents #483)."

          echo "| release asset | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/uis-artifact.json |" >> "$GITHUB_STEP_SUMMARY"
