name: Data-fidelity gates

# 🔴 NO PATH FILTER, DELIBERATELY.
#
# Every other gate in this repo is path-filtered, and on 2026-09-20 that is how
# a change reached main with its gates skipped (urb-agents #1296). A filter is a
# list of places someone thought the defect could come from, and this is the one
# gate whose failure a consumer could never detect for themselves: Atlas
# republishes Norwegian public data, and the property that makes it worth using
# is that a figure here is the figure SSB, FHI or Brreg published.
#
# The check is bash and grep, runs in seconds, needs no database and no
# toolchain. There is no cost worth optimising by making it conditional.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  raw-is-read-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No dbt object may write to a source relation
        run: atlas-data/dbt/check-raw-is-read-only.sh
      - name: Every emitted source_id exists in the manifest
        run: atlas-data/dbt/check-source-ids-are-real.sh
      - name: The holdings summary matches the manifests
        run: atlas-data/uis/generate-holdings.py --check
      - name: Every classifier value exists in ref_region_kind
        run: atlas-data/dbt/check-classifier-vocabulary.sh
      - name: Every ingested source reaches a model, or is declared
        run: atlas-data/dbt/check-every-source-is-served.sh
      - name: Every raw table created by a migration has a producer
        run: atlas-data/dbt/check-every-raw-table-has-a-producer.sh
      - name: The committed sources seed matches the manifests
        run: atlas-data/dbt/check-sources-seed-is-current.sh
      - name: Every generator has a drift gate or declares why not
        run: atlas-data/dbt/check-generators-declare-a-drift-gate.sh
      - name: The inventory declares every published mart
        run: atlas-data/dbt/check-inventory-depends-on.sh
      # Reads the fact SQL and the dimensions seed directly — no database, no
      # dbt parse, so it belongs in the job that needs neither.
      - name: Windowing agrees with the published catalogue
        run: atlas-data/dbt/check-window-agrees-with-the-catalogue.sh
      # Reads the generated SQL only — no database, no dbt parse.
      - name: Every published relation is findable from the root document
        run: atlas-data/dbt/check-root-document-indexes-every-relation.sh

  kommune-marts-exclude-sentinels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      # The gate reads target/manifest.json, so the project has to be parsed.
      # dbt parse needs no database connection; the env vars only satisfy the
      # profile's env_var() calls.
      - name: Install dbt
        run: pip install --quiet dbt-core==1.8.10 dbt-postgres==1.8.2
      - name: Parse the dbt project
        working-directory: atlas-data/dbt
        env: {PGHOST: localhost, PGPORT: '5432', PGUSER: x, PGPASSWORD: x, PGDATABASE: x}
        run: |
          mkdir -p .venv/bin && ln -sf "$(command -v python)" .venv/bin/python
          dbt deps   # packages.yml declares dbt_utils; parse fails without it
          dbt parse
      - name: Every published per-kommune relation excludes the 9999 sentinel
        run: atlas-data/dbt/check-kommune-marts-exclude-sentinels.sh
      # 🔴 A not_null on a column that is empty in its seed passes EVERY CI
      # build, because CI builds from an empty database — there are no rows to
      # violate it. It fails in production on real rows, which is where
      # mart_ref_brreg_icnpo.label_en failed with 46 of 46 on 2026-09-25.
      # Reads the committed CSV and schema.yml only; needs no database.
      - name: Seed-backed not_null assertions hold in the committed CSVs
        run: atlas-data/dbt/check-seed-not-null-matches-the-csv.sh
      # Regenerates the lineage seeds and diffs them; needs the manifest the
      # step above already produced. A stale seed makes a SERVED source report
      # as unserved, which is indistinguishable from the real thing.
      - name: The lineage seeds match the dbt manifest
        run: atlas-data/dbt/check-lineage-is-current.sh

  models-compile:
    runs-on: ubuntu-latest
    # 🔴 dbt compile NEEDS A CONNECTION even though it reads no marts, so this
    # job has a postgres and the other two do not. It stays empty — nothing is
    # created in it. The alternative was skipping the check when no database is
    # around, which is how a gate learns to pass by checking nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dbt and the SQL parser
        run: pip install --quiet dbt-core==1.8.10 dbt-postgres==1.8.2 sqlglot==30.17.0
      - name: Compile every model
        working-directory: atlas-data/dbt
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: atlas
          PGPASSWORD: atlas
          PGDATABASE: atlas
        run: |
          mkdir -p .venv/bin && ln -sf "$(command -v python)" .venv/bin/python
          dbt deps
          dbt compile
      # ⚠️ `dbt compile` EXITS 0 ON UNPARSEABLE SQL. Measured 2026-09-21 by
      # reintroducing the real defect: compile 0, parse 0, this gate 1.
      - name: Every compiled model is parseable Postgres
        run: atlas-data/dbt/check-models-compile.sh
