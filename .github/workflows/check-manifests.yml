name: Check source manifests

# Validates atlas-data/ingest/src/sources/*/manifest.yml against
# manifest.schema.json and the publishers.yaml / source-categories.yaml
# companion files. Runs check-manifests.sh on every PR / push that touches
# the manifest schema, the manifests themselves, or the companion files.
#
# Mirrors the check-osmosis.sh gate over in atlas-data/dbt/.
# See website/docs/contributors/check-manifests.md for the contributor guide.

on:
  pull_request:
    paths:
      - 'atlas-data/ingest/src/sources/**/manifest.yml'
      - 'atlas-data/ingest/src/sources/manifest.schema.json'
      - 'atlas-data/ingest/src/sources/publishers.yaml'
      - 'atlas-data/ingest/src/sources/source-categories.yaml'
      - 'atlas-data/ingest/src/sources/validate-manifests.ts'
      - 'atlas-data/ingest/src/sources/check-manifests.sh'
      - 'atlas-data/ingest/package.json'
      - 'atlas-data/ingest/package-lock.json'
      - '.github/workflows/check-manifests.yml'
  push:
    branches:
      - main
    paths:
      - 'atlas-data/ingest/src/sources/**/manifest.yml'
      - 'atlas-data/ingest/src/sources/manifest.schema.json'
      - 'atlas-data/ingest/src/sources/publishers.yaml'
      - 'atlas-data/ingest/src/sources/source-categories.yaml'
      - 'atlas-data/ingest/src/sources/validate-manifests.ts'
      - 'atlas-data/ingest/src/sources/check-manifests.sh'
      - 'atlas-data/ingest/package.json'
      - 'atlas-data/ingest/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-data/ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: atlas-data/ingest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        run: ./src/sources/check-manifests.sh
