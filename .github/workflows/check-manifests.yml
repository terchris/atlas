name: Check sources (manifests + catalog)

# Two related gates:
#   1. check-manifests — manifest.yml shape + cross-file checks
#      (publishers.yaml, topics.yaml).
#   2. check-catalog   — regenerate sources-registry.json + the per-source /
#      per-category / per-publisher MDX from manifests, diff against
#      committed output. Fails if a contributor edited a manifest but
#      forgot to run `npm run sources:generate` in website/.
#
# Both gates trigger on the same path set: any manifest, schema, companion
# file, the catalog generator, or the committed catalog output.
#
# See website/docs/contributors/check-manifests.md and
# website/docs/contributors/sources-catalog.md for the contributor guides.

on:
  pull_request:
    paths:
      # Manifest-side files
      - 'atlas-data/ingest/src/sources/**/manifest.yml'
      - 'atlas-data/ingest/src/sources/manifest.schema.json'
      - 'atlas-data/ingest/src/sources/publishers.yaml'
      - 'atlas-data/ingest/src/sources/topics.yaml'
      - 'atlas-data/ingest/src/sources/validate-manifests.ts'
      - 'atlas-data/ingest/src/sources/check-manifests.sh'
      - 'atlas-data/ingest/package.json'
      - 'atlas-data/ingest/package-lock.json'
      # dbt-side inputs. 🔴 ADDED 2026-09-19 AFTER A dbt CHANGE BROKE THIS
      # GENERATOR AND SHIPPED TO main UNNOTICED. generate-sources-registry.mjs
      # reads five dbt files — two lineage seeds and every models/*/schema.yml —
      # and none of them was a trigger, so a duplicate YAML key added to
      # models/marts/schema.yml passed every dbt gate (dbt's loader tolerates
      # duplicate keys; js-yaml rejects them) and broke the catalogue with no
      # workflow watching. It only surfaced on the next change that happened to
      # touch a website path.
      - 'atlas-data/dbt/models/**/schema.yml'
      - 'atlas-data/dbt/seeds/sources/lineage.csv'
      - 'atlas-data/dbt/seeds/sources/lineage_direct.csv'
      # Catalog-side files
      - 'website/scripts/generate-sources-registry.mjs'
      - 'website/src/data/sources-registry.json'
      - 'website/docs/datasets/**'
      - 'website/docs/topics/**'
      - 'website/docs/publishers/**'
      - 'website/package.json'
      - 'website/package-lock.json'
      - '.github/workflows/check-manifests.yml'
  push:
    branches:
      - main
    paths:
      - 'atlas-data/ingest/src/sources/**/manifest.yml'
      - 'atlas-data/ingest/src/sources/manifest.schema.json'
      - 'atlas-data/ingest/src/sources/publishers.yaml'
      - 'atlas-data/ingest/src/sources/topics.yaml'
      - 'atlas-data/ingest/src/sources/validate-manifests.ts'
      - 'atlas-data/ingest/src/sources/check-manifests.sh'
      - 'atlas-data/ingest/package.json'
      - 'atlas-data/ingest/package-lock.json'
      - 'atlas-data/dbt/models/**/schema.yml'
      - 'atlas-data/dbt/seeds/sources/lineage.csv'
      - 'atlas-data/dbt/seeds/sources/lineage_direct.csv'
      - 'website/scripts/generate-sources-registry.mjs'
      - 'website/src/data/sources-registry.json'
      - 'website/docs/datasets/**'
      - 'website/docs/topics/**'
      - 'website/docs/publishers/**'
      - 'website/package.json'
      - 'website/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-manifests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-data/ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: atlas-data/ingest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        run: ./src/sources/check-manifests.sh

  check-catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog
        run: npm run sources:generate
      - name: Every publisher has a logo and the file exists
        run: node scripts/check-publisher-logos.mjs
      - name: Every published relation has a dataset page
        run: node scripts/check-dataset-page-coverage.mjs

      # 🔴 generated_at IS EXCLUDED, AND THAT IS THE POINT OF THIS STEP.
      #
      # sources-registry.json carries a top-level `generated_at` written from
      # wall-clock time. This step regenerates the catalogue and diffs it
      # against the committed copy — so the FIRST PR AFTER MIDNIGHT UTC failed
      # here regardless of what it changed. On 2026-09-26 a PR touching only
      # models/supply/schema.yml (which does not feed the catalogue at all) was
      # failed by exactly one line: the date.
      #
      # ⚠️ The cost was never the noise. A real catalogue drift and a date
      # rollover produced the SAME RED X, and the false one teaches
      # "regenerate, commit, don't read the diff" — the habit that makes the
      # real one invisible. A gate that cries wolf does not just waste a
      # morning; it trains the reflex that makes the true alarm unreadable.
      #
      # 🔵 Safe by CONSUMPTION, not just by grep (ops-dev verified, #1558):
      # website/src/utils/postgrest.ts and utils/sources.ts both import the
      # registry and neither reads generated_at; types/sources.ts only types
      # it. The one component that reads a `.generated_at` reads it off the
      # sample SNAPSHOT, a different object.
      #
      # ⚠️ Scoped to the registry deliberately. There are THREE generated_at
      # fields under website/src/data/ — the registry's (date-only) and two
      # snapshots' (full ISO timestamps). The snapshots are not regenerated
      # here and must keep drifting if they change.
      #
      # 🔵 The deeper fix is to stop embedding wall-clock time in a generated
      # artifact at all, so it is a pure function of its inputs. That needs a
      # RENAME to stay honest — derived-from-inputs means "when the content
      # last changed", which is not what `generated_at` says — so it is a
      # published-field change with a migration, not a gate tweak. Deferred
      # deliberately, not forgotten (#1558).
      - name: Check for catalog drift
        run: |
          # The registry, compared with generated_at removed from both sides.
          git show HEAD:website/src/data/sources-registry.json > /tmp/reg-head.json
          node -e '
            const fs = require("fs");
            const strip = (src, out) => {
              const d = JSON.parse(fs.readFileSync(src, "utf8"));
              delete d.generated_at;
              fs.writeFileSync(out, JSON.stringify(d, null, 2) + "\n");
            };
            strip("/tmp/reg-head.json", "/tmp/reg-a.json");
            strip("src/data/sources-registry.json", "/tmp/reg-b.json");
          '
          registry_drift=0
          diff -u /tmp/reg-a.json /tmp/reg-b.json || registry_drift=1
          if [ "$registry_drift" -ne 0 ] || ! git diff --exit-code docs/datasets/ docs/topics/ docs/publishers/; then
            echo ""
            echo "::error::Catalog is out of date with manifests."
            echo "::error::Fix: cd website && npm run sources:generate && git add src/data/sources-registry.json docs/datasets/ docs/topics/ docs/publishers/"
            exit 1
          fi
