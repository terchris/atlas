# file: organizations/v1/branch-activity.yaml
components:
  schemas:
    BranchActivity:
      type: object
      additionalProperties: false
      required:
        - globalActivityName
        - localActivityName
      properties:
        globalActivityName:
          type: string
          description: Standard name for the activity type as defined by Red Cross centrally
          example: "Besøkstjeneste"
        localActivityName:
          type: string
          description: Branch-specific name for the activity, typically including the branch name
          pattern: '^[a-zA-ZæøåÆØÅ0-9\s\-\.,()]+$'
          minLength: 1
          maxLength: 100
          example: "Kolvereid Røde Kors Besøkstjeneste"
      description: Represents an implementation of a global activity within a specific branch