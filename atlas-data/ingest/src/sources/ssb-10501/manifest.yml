methodology_notes: |
  Covers first names used by 200 or more persons in Norway at year-end — NOT an exhaustive list of
  Norwegian first names. A name with fewer than 200 bearers in a given year does not appear as a row
  at all, in any year. Within the names that do appear, per-year suppression still applies: a name
  can clear the threshold in some years and fall below it in others (measured: 13.6% of cells are
  suppressed). Gender is encoded as a leading digit on the composite `Fornavn` code (1=girl, 2=boy),
  not as a separate dimension. Hyphenated names are counted together with the name before the hyphen
  for 2021-2024 specifically (SSB's own table note). Added primarily as a name-scrubbing reference
  list, not as a demographic indicator in the usual Atlas sense — it carries no kommune/fylke
  breakdown because SSB publishes it at national resolution only.
