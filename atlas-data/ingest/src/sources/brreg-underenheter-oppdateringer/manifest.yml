raw_tables:
  - brreg_underenheter_oppdateringer
  - brreg_underenheter_versions
  - brreg_underenheter_feed_watermark

dimensions:
  - code: oppdateringsid
    meaning: Brreg's monotonic change identifier for the underenheter feed, and the cursor it is walked by
    value_format: bigint, sparse
    notes: >-
      🔴 Its own id space, not comparable to the enheter feed's oppdateringsid —
      a real bootstrap run against live data on 2026-10-04 seeded this feed's
      watermark at 21,390,729, an entirely separate counter from enheter's own.
      Sparse like the enheter feed's; never compute a backlog by subtracting
      ids, read page.totalElements at the cursor.
  - code: endringstype
    meaning: What kind of change Brreg recorded
    value_format: Ny, Endring, Sletting, Fjernet or Ukjent
    notes: >-
      Same five values as the enheter feed. Ny, Endring and Sletting all
      confirmed in a live 2026-10-04 sample at the current cursor. Stored
      verbatim and not constrained to an enum — a sixth value must land and be
      counted, not rejected at the door.
  - code: organisasjonsnummer
    meaning: The sub-unit the change is about
    value_format: 9 digits, leading zeros significant — always text
    notes: Joins to raw.brreg_underenheter_snapshot. Retained after deletion.
  - code: doc
    meaning: The sub-unit's document as it stood when the change was received
    value_format: jsonb, or null when the entity fetch failed
    notes: >-
      ⚠️ For a Sletting/Fjernet this is NOT a full record, and it is not even
      consistently a stub. Confirmed live 2026-10-04: a Sletting
      (organisasjonsnummer 920045154) answers HTTP 200 with a 6-key stub
      (respons_klasse "SlettetUnderEnhet", slettedato set); a Fjernet
      (organisasjonsnummer 934464524) answers HTTP 410 with an even more
      minimal 3-key body and is stored here as NULL. Branch on endringstype;
      never assume doc is complete or present, never detect deletion from a
      status code.
  - code: process_status
    meaning: What Atlas did with the change
    value_format: applied, tombstoned or skipped_unknown
    notes: Derived from endringstype at load time.

lifecycle: beta
