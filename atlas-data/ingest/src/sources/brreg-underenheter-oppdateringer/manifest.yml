methodology_notes: |
  Walked by CURSOR ONLY — `?oppdateringsid=<last+1>&size=10000` — same trap as
  the enheter feed and verified against this one independently 2026-10-04:
  `page` is capped, `_links.next` is built with `page=`, and a caught-up
  response has no `_embedded` key at all rather than an empty array.

  🔴 Uses `_embedded.oppdaterteUnderenheter` and `_links.underenhet`, NOT the
  enheter feed's `oppdaterteEnheter` / `_links.enhet` — upstream naming, not a
  design choice, and asserted in this source's own tests.

  The watermark lives in `raw.brreg_underenheter_feed_watermark` — its own
  single-row table, not a shared one with the enheter feed's watermark, because
  the two id spaces are independent. Same reasoning as the enheter feed for why
  this is a Postgres row and not a Dagster cursor.

  A run is capped at 50,000 changes (`BRREG_UNDERENHETER_FEED_MAX_CHANGES`),
  same reasoning as the enheter feed's cap.
