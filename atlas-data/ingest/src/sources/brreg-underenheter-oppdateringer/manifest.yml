# Hand-authored catalogue metadata for the underenheter change feed.
# Ingest runs do not modify this file.

source_id: brreg-underenheter-oppdateringer
upstream_id: enhetsregisteret-underenheter-oppdateringer
upstream_url: https://data.brreg.no/enhetsregisteret/api/oppdateringer/underenheter
upstream_landing_page: https://data.brreg.no/enhetsregisteret/api/dokumentasjon
upstream_title: "Enhetsregisteret — underenheter, oppdateringer (endringsfeed)"
description: |
  Brønnøysundregistrene publishes every change to the underenheter register as
  its own ordered feed, independent of the enheter feed `brreg-oppdateringer`
  reads — a real bootstrap run against live data on 2026-10-04 seeded this
  feed's watermark at 21,390,729, an entirely separate counter from enheter's
  own feed. Atlas walks it forward from a durable watermark, recording each
  change in `raw.brreg_underenheter_oppdateringer` and the sub-unit's document
  at that moment in `raw.brreg_underenheter_versions`.

  This is what keeps the bulk snapshot (`brreg-underenheter`) from going stale.
  The snapshot is a point in time; a bulk file cannot express a deletion. Those
  arrive here, as `Sletting` and `Fjernet` change types — confirmed live
  2026-10-04 (a 100-row sample at the current cursor held Ny 51, Endring 35,
  Sletting 14).

  The feed reaches back to its own id 1 (2018, same era as the enheter feed),
  so a missed cycle catches up completely on the next run.
