dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "~409 codes"
  - code: AAR
    meaning: Year
    value_format: '"YYYY_YYYY" range string (single-year)'
    notes: 12 single-year periods, 2014–2025
  - code: KJONN
    meaning: Sex
    value_format: 3 codes
    notes: '"0" both, "1" men, "2" women — girls report higher painkiller use than boys'
  - code: ALDER
    meaning: Age band (Ungdata cohort grouping)
    value_format: 1 code (degenerate)
    notes: 'Always "1_6" — Ungdata survey-cohort identifier (same as fhi-livskvalitet, fhi-depresjon). Verify against Ungdata methodology.'
  - code: STATUS
    meaning: Painkiller-use frequency band
    value_format: 1 code (degenerate)
    notes: 'Always "Minst_ukentlig" (at-least-weekly use) — table reports the share reaching this frequency.'
  - code: SOES
    meaning: Socioeconomic status
    value_format: 1 code (degenerate)
    notes: 'Always "0" — combined socioeconomic statuses (no breakdown in this slice).'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 2 codes
    notes: "SMR (standardised ratio vs national), MEIS (FHI mean / smoothed indicator). No TELLER / RATE — Ungdata is sample-based."
