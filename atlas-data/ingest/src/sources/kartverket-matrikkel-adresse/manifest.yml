upstream_title: "Matrikkelen - Adresse"
description: "Kartverket's national address file, via Geonorge's order-based download API (same mechanism as the other kartverket-* sources). urb-agents #2098/#2099 (R5). 2,604,785 addresses per the request; 2,604,936 measured 2026-11-08. The CSV distribution, 46 columns — Atlas types the dozen this request asks for; everything else stays in raw.doc."
