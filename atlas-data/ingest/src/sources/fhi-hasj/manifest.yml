upstream_title: "Hasjbruk_Ungdata_KH"
description: "FHI Folkehelsestatistikk table 363 — share of Ungdata respondents reporting cannabis use one or more times in the past year. Risk-direction youth-substance-use indicator on the Ungdata cohort base; pairs with fhi-alkohol."
publisher: Folkehelseinstituttet
license: NLOD
license_url: https://data.norge.no/nlod/no/2.0
