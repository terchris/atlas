dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "~409 codes"
  - code: AAR
    meaning: Base year of the projection (anchor year)
    value_format: '"YYYY_YYYY" range string'
    notes: 'The year the forecast is anchored on — *not* the year being projected. PROGNOSEAAR is the target.'
  - code: KJONN
    meaning: Sex
    value_format: 3 codes upstream; Atlas filters to 1
    notes: '"0" both (Atlas only ingests this) — re-ingest for sex-stratified slice'
  - code: ALDER
    meaning: Age band
    value_format: '"min_max" range string'
    notes: "31 codes — includes the universal 0_120, 5-year disjoint slices (0_4, 5_9, …, 100_120), and aggregates (0_17, 45_64, 80_120). Pick a single non-overlapping partition downstream."
  - code: PROGNOSEAAR
    meaning: Year being projected to (target year)
    value_format: 4-digit year as text
    notes: "26 codes upstream (per-year out to ~2050+). Atlas keeps 3 horizons: 2030, 2040, 2050. Add intermediate years as a sibling source if 5-year resolution is needed."
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 3 codes upstream; Atlas filters to 1
    notes: "TELLER (count) only — RATE / SMR are derivable downstream from these counts."

