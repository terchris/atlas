dimensions:
  - code: fylkesnummer
    meaning: Two-digit fylke code, and the table's primary key
    value_format: 2 digits, leading zeros significant — always text
    notes: Matches dim_fylke's own fylke_nr convention; join key between the two.
  - code: fylkesnavn
    meaning: The combined display name, as Kartverket's own fylkesnavn field carries it
    value_format: free text
    notes: "May already be a hyphenated multi-language form, e.g. \"Troms - Romsa - Tromssa\" — distinct from the administrativenhetnavn array's individual entries."
  - code: administrativenhetnavn
    meaning: Every official name for this fylke, as an array of {navn, rekkefolge, sprak}
    value_format: JSON array
    notes: "Several fylker (measured 2026-11-08) carry Norwegian plus Sami (sme) and/or Kven (fkv) forms where official."
  - code: gyldigFra
    meaning: Date this administrative unit became valid
    value_format: compact date string, e.g. "20251013"
    notes: The fylke's most recent boundary-effective date, not its founding date.
  - code: gyldigTil
    meaning: Date this administrative unit stopped being valid
    value_format: compact date string, or absent
    notes: Null on every one of 15 features measured 2026-11-08 — a whole-country "landsdekkende" order returns current units only.
  - code: geometry
    meaning: The county boundary, verbatim from the upstream GeoJSON
    value_format: GeoJSON MultiPolygon, EPSG:4258
    notes: Full resolution, not simplified — dbt derives a simplified geometry for publication.

