# Hand-authored catalogue metadata for the underenheter bulk load.
# Ingest runs do not modify this file.

source_id: brreg-underenheter
upstream_id: enhetsregisteret-underenheter
upstream_url: https://data.brreg.no/enhetsregisteret/api/underenheter/lastned
upstream_landing_page: https://data.brreg.no/enhetsregisteret/api/dokumentasjon
upstream_title: "Enhetsregisteret — underenheter (alle)"
description: |
  Brønnøysundregistrene's underenheter register holds every sub-unit registered
  under a parent organisation — local branches, establishments and divisions
  (organisasjonsform BEDR and others) — around 867,000 of them (measured
  2026-10-04). Brreg regenerates a complete gzipped JSON export daily; Atlas
  downloads that file, streams it, and stores each record verbatim as jsonb in
  `raw.brreg_underenheter_snapshot`, keyed on the sub-unit's own
  organisasjonsnummer.

  This is the sibling of brreg-enheter-alle (the parent-entity register) and was
  named as a follow-on when that source shipped (PLAN-001,
  INVESTIGATE-all-brreg-organisations.md): deferred until enheter's own
  bulk+change-feed machinery had run in production, which it has. Some
  organisations — including local branches of unitary NGOs such as Frelsesarmeen
  and Kirkens Bymisjon — are registered as underenheter rather than as enheter,
  so a copy of enheter alone has a population gap exactly where Atlas's NGO work
  cares (docs/research/ngo-research/ingestion-specs/brreg-underenheter.md).

  This is the **bootstrap** load: a complete point-in-time copy. Keeping it
  current is brreg-underenheter-oppdateringer's job
  (`/oppdateringer/underenheter`), which reads only what moved.

  Nothing is flattened, renamed or re-encoded on the way in. Typed columns for
  the fields Atlas actually queries belong in dbt.
