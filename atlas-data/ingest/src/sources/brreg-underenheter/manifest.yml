methodology_notes: |
  Source file: GET https://data.brreg.no/enhetsregisteret/api/underenheter/lastned
  — one gzipped, pretty-printed JSON array, regenerated daily. Measured
  2026-10-04: 867,024 records live via the API (`?size=1`'s page.totalElements);
  the bulk file's own count will differ by the day's churn, the same way
  enheter's bulk file and live API disagree (see brreg-enheter-alle's
  methodology_notes) — not a defect in either number.

  Same streaming approach as brreg-enheter-alle and the same reason: the file is
  one JSON array, not newline-delimited, and whole-file JSON.parse would need
  the entire document resident. No delimited format anywhere in the path; a test
  asserts a record containing a pipe, a newline and a double quote survives
  byte-identical.

  Personal names can appear in this register for the same reason as enheter
  (roles, sole proprietorships as sub-units) — the same 2026-09-11 ruling from
  Terje that they are lawfully public applies here; this is the same register,
  not a new question.
