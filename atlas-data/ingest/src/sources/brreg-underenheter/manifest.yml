raw_tables:
  - brreg_underenheter_snapshot

dimensions:
  - code: organisasjonsnummer
    meaning: The sub-unit's own nine-digit national identifier, and the table's primary key
    value_format: 9 digits, leading zeros significant — always text, never a number
    notes: >-
      Distinct from the parent's organisasjonsnummer, which lives inside doc as
      overordnetEnhet (a plain string field, verified live 2026-10-04 — not a
      nested object carrying its own organisasjonsnummer key). Stable for the
      life of the sub-unit and retained after deletion.
  - code: doc
    meaning: The upstream Underenhet object exactly as Brreg published it
    value_format: jsonb object
    notes: >-
      Not flattened and not indexed, for the same measured reason as
      brreg_enheter_snapshot.doc. Contains navn, organisasjonsform,
      overordnetEnhet, beliggenhetsadresse, naeringskode1, oppstartsdato,
      nedleggelsesdato and more.
  - code: snapshot_file_date
    meaning: The date of the bulk file this row was loaded from
    value_format: date, or null when the download sent no Last-Modified
    notes: Provenance of the transfer, not of the sub-unit.
  - code: loaded_at
    meaning: When Atlas last wrote this row
    value_format: timestamptz
    notes: Updated by every upsert, so it tracks Atlas's load rather than any upstream event.

