upstream_title: "SSB Klass correspondence tables, classifications 131 og 104"
description: "SSB Klass's correspondence/change log for kommune (131) and fylke (104) codes — every old-code -> new-code transition Klass recorded, with the date it took effect. Sibling to ssb-klass-kommuner/ssb-klass-fylker, which cover each code's own validity window, not the transitions between codes. urb-agents #2098/#2099 (R6)."
