dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "~409 codes"
  - code: AAR
    meaning: Year
    value_format: '"YYYY_YYYY" range string (single-year)'
    notes: 13 single-year periods, 2013–2025
  - code: KJONN
    meaning: Sex
    value_format: 3 codes
    notes: '"0" both, "1" men, "2" women — boys historically report higher >3h/day TV+gaming use than girls'
  - code: ALDER
    meaning: Age band (Ungdata cohort grouping)
    value_format: 1 code (degenerate)
    notes: 'Always "1_6" — Ungdata survey-cohort identifier (same as the other Ungdata sources). Verify against Ungdata methodology.'
  - code: MEDIEBRUK
    meaning: Media-use frequency band
    value_format: 1 code (degenerate)
    notes: 'Always "Merenn3timer" (more than 3 hours per day). The value is the share reaching the threshold — risk direction.'
  - code: SOES
    meaning: Socioeconomic status
    value_format: 1 code (degenerate)
    notes: 'Always "0" — combined SES (no breakdown in this slice).'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 2 codes
    notes: "SMR (standardised ratio vs national), MEIS (FHI mean / smoothed indicator). No TELLER / RATE — Ungdata is sample-based."
