dimensions:
  - code: region_code
    meaning: Geographic code from the workbook row label, or the literal text "Ukjent"
    value_format: "4-digit kommune code (including the Svalbard pseudo-kommune 2100), or the literal string Ukjent (NAV's own unknown-region bucket)"
    notes: >
      Confirmed live 2026-10-02: this table has NO fylke rows (bare "I alt <name>" rollup rows are
      excluded, not summed) and NO bydel rows at all — every real region row is a 4-digit code,
      including Svalbard's own pseudo-kommune code 2100. The one exception is "Ukjent" (NAV's own
      region-not-determinable bucket), which carries no numeric code at all and — unusually for
      this session — is ALSO the literal label of its own fylke-level header row (that header row
      carries zero data and is dropped by the ingest's existing hasData guard; only the
      data-bearing kommune-level "Ukjent" leaf row survives). region_kind is derived downstream via
      classify_region_code, which correctly falls through to its existing `unknown` branch for a
      non-numeric label — no macro change needed; 2100 resolves via the existing `^21\d{2}$`
      svalbard branch.
      ⚠️ Unlike nav-aap, "Ukjent" is present in BOTH sheets here (359 distinct regions in both
      Antall and Prosent — 357 kommuner + Svalbard's 2100 + Ukjent) — but every one of its month
      cells in the Prosent sheet is NAV's own suppression marker (`*`), not a real share. Do not
      assume the nav-aap asymmetry (357 vs 358) carries over to this source; it was checked
      independently and does not hold.
  - code: category_format
    meaning: Which sheet the row came from, not a column within a sheet
    value_format: antall or prosent
    notes: >
      antall = "3. Kommune Antall" (count); prosent = "4. Kommune Prosent av arbeidsst" (share of
      the labour force). Named "prosent" rather than nav-aap's "andel" to match this table's own
      sheet-name vocabulary.
  - code: year
    meaning: "Calendar year, read from the sheet's own period-label cell (e.g. 'Januar - august 2026')"
    value_format: 4-digit integer
    notes: >
      One year per file — the live file is replaced in place as the year progresses. ⚠️ A
      different period-label shape than AAP155's "Periode: <year> <mm> - <year> <mm>" cell — this
      table's own cell reads "<Month> - <month> <year>", confirmed live. Each NAV table's own cell
      was read directly, not assumed uniform across the family.
  - code: month
    meaning: Calendar month, from the sheet's own Norwegian month-name header row
    value_format: 1-12 integer
    notes: A plain integer column, same shape as nav-uforetrygd/nav-aap — no dim_period reference.
  - code: values_json
    meaning: Parsed month->value map for the region and category_format slice, for this sheet's year
    value_format: JSON object with string month-number keys; suppressed cells (NAV's own `*` marker) as null
    notes: Matches the full month spine present in the live file (partial-year, growing monthly).

