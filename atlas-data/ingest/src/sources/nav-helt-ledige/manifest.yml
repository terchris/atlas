methodology_notes: |
  Count and share of the labour force registered as fully unemployed with NAV, per kommune,
  monthly. Slots between nav-uforetrygd (long-tail disability outcome) and nav-aap (transitional
  work-assessment benefit) as the short-tail labour-market signal, per the investigation's own
  framing. Small cells are suppressed with `*` — the workbook's own methodology sheet states the
  exact rule: any cell representing fewer than 4 people, per Statistikklovens § 7-1 (a different
  paragraph than AAP155's § 2-6 — read from this table's own methodology sheet, not assumed
  identical). Two trend breaks are documented in the workbook's own methodology sheet and carried
  here verbatim rather than corrected: (1) a January 2024 kommune/fylke structural reform — figures
  are presented under the currently valid kommune/fylke structure; (2) a labour-force-methodology
  break from November 2018 (new registration method) and a further one from April 2025 (a larger
  modernisation of NAV's labour-market statistics) — two distinct breaks in the same series, not
  one.
