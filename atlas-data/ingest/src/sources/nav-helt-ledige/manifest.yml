# Hand-authored catalogue metadata for NAV HL060 (helt ledige kommune monthly statistics).
# Ingest runs do not modify this file.

source_id: nav-helt-ledige
upstream_id: HL060
upstream_url: https://www.nav.no/no/nav-og-samfunn/statistikk/arbeidssokere-og-stillinger-statistikk/helt-ledige
upstream_landing_page: https://www.nav.no/no/nav-og-samfunn/statistikk/arbeidssokere-og-stillinger-statistikk/helt-ledige
upstream_title: "HL060 Helt ledige. Fylke og kommune. Tidsserie måned."
description: |
  NAV (Arbeids- og velferdsetaten) publishes HL060 on its helt-ledige (fully unemployed)
  statistics page: the count and share of the labour force registered as fully unemployed, per
  kommune, as one xlsx workbook covering every month of the current calendar year to date. Atlas
  downloads that workbook (URL discovered from the page — a relative `/_/attachment/download/...`
  link, re-resolved each run since it changes with every release) and loads the
  `3. Kommune Antall` and `4. Kommune Prosent av arbeidsst` sheets into `raw.nav_helt_ledige`.
  Atlas's fourth NAV-adjacent source, and the third source on the `monthly_sources_refresh`
  Dagster job built for `nav-uforetrygd` and already reused by `nav-aap` — no new job.
  v1 tracks the live current-year file only; whether a historical archive exists for this specific
  table was checked and found inconclusive from a static-HTML scan (same as `nav-aap`, unlike
  `nav-uforetrygd`'s clean archive) — backfill is deferred, not resolved.
publisher: Arbeids- og velferdsdirektoratet
