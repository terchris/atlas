# 🔵 Licence independently confirmed for THIS table specifically, 2026-10-02 —
# the workbook's own first cell states "Kilde: NAV" directly (no SSB
# involvement, unlike nav-sykefravaer/ssb-12451), and the file is served
# from www.nav.no's own attachment system. CC BY 4.0 applies per the same
# general NAV statistics-practices page fetched during nav-aap's Phase 1 —
