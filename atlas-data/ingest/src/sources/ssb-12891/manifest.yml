methodology_notes: |
  Covers surnames used by 200 or more persons in Norway at year-end — NOT an exhaustive list of
  Norwegian surnames. The 200-person threshold is not an arbitrary disclosure-avoidance cutoff: it
  is the exact threshold Norwegian naming law uses to protect rarer surnames from being freely
  adopted by others (a surname held by 200 or fewer people is protected; this table's coverage
  boundary follows that legal line). A surname with fewer than 200 bearers never appears as a row,
  in any year. Added primarily as a name-scrubbing reference list alongside ssb-10501 (first names),
  not as a demographic indicator in the usual Atlas sense — it carries no kommune/fylke breakdown
  because SSB publishes it at national resolution only.
