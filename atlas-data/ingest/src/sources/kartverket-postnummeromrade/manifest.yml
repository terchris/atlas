upstream_landing_page: https://kartkatalog.geonorge.no/metadata/uuid/462a5297-33ef-438a-82a5-07fff5799be3
upstream_title: "Postnummerområder"
description: "Kartverket's Postnummerområder (postcode-area polygons), via Geonorge's order-based download API — there is no static file URL; the ingest places an order for the whole country in GeoJSON/EPSG:4258 and downloads the one-time link the order returns. urb-agents #2098/#2099 (R3): served with both full and simplified geometry; see dim_kartverket_postnummeromrade's own model for the simplification method and tolerance."
