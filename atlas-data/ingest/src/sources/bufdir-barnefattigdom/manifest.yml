# Hand-authored catalogue metadata for Bufdir Barnefattigdom kommunemonitor.
# Ingest runs do not modify this file.

source_id: bufdir-barnefattigdom
upstream_id: barnefattigdom-monitor
upstream_url: https://www.bufdir.no/statistikk-og-analyse/monitor/barnefattigdom/
upstream_landing_page: https://www.bufdir.no/statistikk-og-analyse/monitor/barnefattigdom/
upstream_title: "Barnefattigdom kommunemonitor"
description: |
  Barne-, ungdoms- og familiedirektoratet (Bufdir) publishes the Barnefattigdom kommunemonitor on
  bufdir.no and ships a single bulk ZIP of `Indikator_*.xlsx` workbooks ("last ned hele datasettet").
  Atlas downloads that ZIP (URL discovered from the monitor page), parses sheet `Data` in each
  workbook, and loads kommune- and sub-kommune-level time series into `raw.bufdir_barnefattigdom`
  so analysts can compare Bufdir's poverty lens with register-based sources such as SSB low-income
  statistics.
publisher: Barne-, ungdoms- og familiedirektoratet
license: NLOD
license_url: https://data.norge.no/nlod/no/2.0
periodicity: P1Y
eu_theme: SOCI
attribution: "Kilde: Barne-, ungdoms- og familiedirektoratet, Barnefattigdom kommunemonitor"

tags:
  provider: bufdir
  topic: income
  geo: kommune
  cadence: annual

dimensions:
  - code: indicator_api_id
    meaning: Stable surrogate indicator key for ZIP workbook rows (not Strapi)
    value_format: bf_zip_<24 lowercase hex>
    notes: Derived as SHA-256 fingerprint of the `Indikator_*.xlsx` filename stem; breaks if Bufdir renames workbook files inside the ZIP.
  - code: region_code
    meaning: Geographic code from workbook column Region
    value_format: "0 (land), 2-digit fylke, 4-digit kommune, or longer codes for bydel/delbydel"
    notes: Rows follow whatever geography levels each indicator publishes.
  - code: category_unit
    meaning: Workbook column Enhet (first category axis), normalised lowercase
    value_format: barn or husholdning
    notes: Mirrors the paired rows in each Data sheet for child vs household units.
  - code: category_format
    meaning: Workbook column Tallformat (second category axis), normalised lowercase
    value_format: antall or prosent
    notes: Paired with category_unit — four tuples per workbook × geography when all rows exist upstream.
  - code: year
    meaning: Calendar year column from workbook header row
    value_format: 4-digit integer
    notes: Spines differ by indicator — see values_json for the full year map before filtering NAs.
  - code: values_json
    meaning: Parsed year→value map for the geography and Enhet/Tallformat tuple
    value_format: JSON object with string year keys; suppressed cells as null
    notes: Matches prior raw semantics (full spine per slice); mart reads scalar `value` for the keyed year row.

lifecycle: stable
time_coverage:
  start: null
  end: null
keywords:
  - child-poverty
  - low-income
  - kommune
  - bydel
  - families
methodology_notes: |
  Children under 18 living in households below 60% of the national median equivalised income (EU-scale). Spines differ per indicator — some series start in 2013, others in 2015 or later. Bufdir's poverty lens complements SSB's register-based measures by adding bydel-level breakdowns for the largest kommuner.
suggested_joins:
  - ssb-08764
