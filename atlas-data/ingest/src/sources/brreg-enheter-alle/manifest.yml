# Hand-authored catalogue metadata for the full Enhetsregisteret bulk load.
# Ingest runs do not modify this file.
#
# ⚠️ The licence block below is not boilerplate. The existing seed source
# src/seed-sources/brreg-enheter/ carries NO manifest and therefore no
# attribution — INVESTIGATE-nlod-attribution records that as a live, repo-wide
# gap. PLAN-001 task 2.4 exists so this source does not repeat it.

source_id: brreg-enheter-alle
upstream_id: enhetsregisteret
upstream_url: https://data.brreg.no/enhetsregisteret/api/enheter/lastned
upstream_landing_page: https://data.brreg.no/enhetsregisteret/api/dokumentasjon
upstream_title: "Enhetsregisteret — alle registrerte enheter"
description: |
  Brønnøysundregistrene's Enhetsregisteret holds every legal entity registered in
  Norway — companies, foundations, associations, public bodies and sole
  proprietorships — around 1.17 million of them. Brreg regenerates a complete
  gzipped JSON export daily; Atlas downloads that file, streams it, and stores each
  record verbatim as jsonb in `raw.brreg_enheter_snapshot`, keyed on
  organisasjonsnummer.

  Atlas previously held 122 organisational units, selected by a curated list of 11
  NGOs. Holding the whole register instead means any Norwegian organisation can be
  resolved from its organisasjonsnummer without a new ingest, and it is what makes
  organisational data from unrelated sources join at all.

  This is the **bootstrap** load: a complete point-in-time copy. Keeping it current
  is the change feed's job (PLAN-002, `/oppdateringer/enheter`), which reads only
  what moved. Underenheter (~863k sub-units) are a separate follow-on.

  Nothing is flattened, renamed or re-encoded on the way in. Typed columns for the
  fields Atlas actually queries are built in dbt (PLAN-003).
publisher: Brønnøysundregistrene
license: NLOD
license_url: https://data.norge.no/nlod/no/2.0
periodicity: P1D
eu_theme: GOVE
attribution: "Inneholder data under norsk lisens for offentlige data (NLOD) tilgjengeliggjort av Brønnøysundregistrene"

tags:
  provider: brreg
  topic: organisations
  geo: kommune
  cadence: daily

raw_tables:
  - brreg_enheter_snapshot

dimensions:
  - code: organisasjonsnummer
    meaning: The organisation's nine-digit national identifier, and the table's primary key
    value_format: 9 digits, leading zeros significant — always text, never a number
    notes: >-
      Stable for the life of the organisation and retained after deletion from the
      register, which is why it is a safe join key and why the change feed can
      address a row that no longer has a live entity behind it. Storing it as an
      integer loses leading zeros; several real orgnr begin with 0.
  - code: doc
    meaning: The upstream Enhet object exactly as Brreg published it
    value_format: jsonb object, ~30 top-level keys, several nested
    notes: >-
      Not flattened and not indexed. Contains navn, organisasjonsform,
      forretningsadresse, naeringskode1..3, registreringsdatoEnhetsregisteret,
      konkurs / underAvvikling flags and more. A GIN index over it was measured at
      +42% storage (~0.8 GB) for an access pattern nothing uses — see the migration
      header. Read fields through dbt models, not through jsonb paths in ad-hoc SQL.
  - code: snapshot_file_date
    meaning: The date of the bulk file this row was loaded from
    value_format: date, or null when the download sent no Last-Modified
    notes: >-
      Provenance of the transfer, not of the organisation. The organisation's own
      registration and update dates live inside doc. Null is honest — a guessed date
      would be worse than an absent one.
  - code: loaded_at
    meaning: When Atlas last wrote this row
    value_format: timestamptz
    notes: >-
      Updated by every upsert, so it tracks Atlas's load rather than any upstream
      event. A row whose loaded_at is older than the newest snapshot means the
      bootstrap did not reach it, not that the organisation is stale.

lifecycle: beta
