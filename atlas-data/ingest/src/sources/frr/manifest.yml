description: "Norges Røde Kors's internal Frivillig Resource Register (FRR) — operational data on volunteer resources, status, and positions. Private; never exposed via the public API."
publisher: Norges Røde Kors
license: internal
license_url: internal
periodicity: irregular
eu_theme: SOCI
attribution: "Norges Røde Kors, Frivillig Resource Register (FRR) — internal data"

tags:
