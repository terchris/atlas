methodology_notes: |
  Resident population at year-end. Counts individuals registered as resident in a kommune in Folkeregisteret. Differs from 'present population' (which varies seasonally) and from the registered population at the start of the year. Largest table in the catalogue when wildcarded across all dimensions — Atlas filters to latest year by default.
