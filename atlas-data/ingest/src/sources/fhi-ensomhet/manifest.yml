# Hand-authored, mirroring fhi-bor-alene/manifest.yml's shape.
# The dimensions: block is hand-authored — editorial semantics the catalogue can't compute.
# After commit, this file is human-authored — ingest runs do NOT modify it.

source_id: fhi-ensomhet
upstream_id: "348"
upstream_url: https://statistikk-data.fhi.no/api/open/v1/nokkel/table/348
upstream_landing_page: https://statistikk.fhi.no/nokkel/tabell/348
upstream_title: "Ensomhet_Ungdata_KH"
description: "FHI Folkehelsestatistikk table 348 — loneliness among 8th-10th graders (Ungdata survey, Kommunehelsa), reported as how many feel \"quite a lot or very much bothered\" by loneliness. Per kommune, annual. Only a standardised ratio (SMR) is published for this table — no raw percentage, no count."
publisher: Folkehelseinstituttet
license: NLOD
license_url: https://data.norge.no/nlod/no/2.0
periodicity: P1Y
eu_theme: SOCI
attribution: "Kilde: Folkehelseinstituttet, Folkehelsestatistikk — tabell 348"

tags:
  provider: fhi
  topic: demographics
  geo: kommune
  cadence: annual

dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "409 codes total, measured 2026-11-08; 357 are 4-digit kommune codes. ⚠️ Having a row is not having a value: only 100 of those 357 carry a non-null 'total' figure (96 for each of the boys/girls breakdowns) — the rest are suppressed for small sample size, same shape as every other small-sample FHI/Ungdata table."
  - code: AAR
    meaning: Year or period
    value_format: '"YYYY_YYYY" range string'
    notes: "Single-year only in this ingest (bottom 1). National level (GEO=0) has 2012_2012 through 2025_2025; kommune-level coverage for earlier years not checked — only the latest year is pulled."
  - code: KJONN
    meaning: Sex
    value_format: 3 codes
    notes: '"0" kjønn samlet (total), "1" gutter (boys), "2" jenter (girls)'
  - code: ALDER
    meaning: Age / school grade band
    value_format: single code at this table's grain
    notes: 'Resolves to one value only — "1_6" (8-10.trinn, i.e. the Ungdata youth survey'' own grade band). Requested as "all" rather than hardcoded in case upstream adds a second band.'
  - code: NIVA_PLAGET
    meaning: Severity threshold for the loneliness question
    value_format: single code at this table's grain
    notes: 'Resolves to one value only — "ganske_veldigmyeplaget" (quite a lot or very much bothered). This table does not publish a lower-threshold or multi-level breakdown.'
  - code: SOES
    meaning: Socioeconomic status breakdown
    value_format: single code at kommune grain
    notes: 'Resolves to "0" (samlet / total) at kommune level — a finer SOES breakdown may exist nationally but is not published per kommune (not checked beyond confirming "0" is what kommune-level rows carry).'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 1 usable code
    notes: "Only SMR (standardised ratio vs national average) is published for this table — RATE and TELLER both answer \"not found for datasetId\" on probing. There is no raw percentage and no count; this is a rate-shaped number, never a count, hence T5's instruction to name it clearly as a rate."

lifecycle: beta
time_coverage:
  start: 2025
  end: 2025
keywords:
  - loneliness
  - ensomhet
  - ungdata
  - youth
  - mental-health
  - kommune
suggested_joins:
  - fhi-bor-alene
