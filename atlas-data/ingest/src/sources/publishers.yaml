# publishers.yaml — per-publisher metadata for the Atlas sources catalogue.
#
# Each entry is keyed by `id` (URL slug used in /sources/by/<id>). The
# `display_name` MUST exactly match the `publisher:` field in every manifest
# from that publisher — the validator cross-checks this.
#
# `logo` paths resolve to website/static/<path> at build time.
# `feedback_url` is the default "Meld feil → Report to publisher" target;
# individual manifests can override via the per-source `feedback_url` field.

publishers:
  - id: ssb
    display_name: Statistisk sentralbyrå
    homepage: https://www.ssb.no/
    logo: /img/publishers/ssb.svg
    feedback_url: https://www.ssb.no/omssb/kontakt-oss
    notes: |
      Norway's national statistics office. Maintains the StatBank
      (statistikkbanken) — the canonical source of demographic, economic,
      and social indicators at kommune, fylke, and national resolution.
      Data released under NLOD; tables identified by numeric IDs preserved
      with leading zeros (e.g. table 07459).

  - id: fhi
    display_name: Folkehelseinstituttet
    homepage: https://www.fhi.no/
    logo: /img/publishers/fhi.png
    feedback_url: https://www.fhi.no/skjema/kontakt-folkehelseinstituttet/
    notes: |
      Norwegian Institute of Public Health. Publishes the Folkehelseprofiler
      and the underlying Folkehelsestatistikk via statistikk.fhi.no.
      Most tables use 3-year rolling averages and standardised ratios (SMR)
      to compare kommune-level health outcomes.

  - id: bufdir
    display_name: Barne-, ungdoms- og familiedirektoratet
    homepage: https://www.bufdir.no/
    logo: /img/publishers/bufdir.png
    feedback_url: https://www.bufdir.no/kontakt/
    notes: |
      Directorate for Children, Youth and Family Affairs. Publishes the
      Barnefattigdom kommunemonitor and related family / child-welfare
      indicators at kommune and bydel resolution. Data released under NLOD.

  - id: redcross
    display_name: Norges Røde Kors
    homepage: https://www.rodekors.no/
    logo: /img/publishers/redcross.svg
    feedback_url: https://www.rodekors.no/kontakt-oss/
    notes: |
      Norwegian Red Cross. Source of NGO-supply data via the public
      Organizations API (branches and per-branch activities).

  - id: brreg
    display_name: Brønnøysundregistrene
    homepage: https://www.brreg.no/
    logo: /img/publishers/brreg.svg
    feedback_url: https://www.brreg.no/om-oss/kontakt-oss/
    notes: |
      The Brønnøysund Register Centre — the Norwegian government agency that
      operates the country's central registers. Atlas reads Enhetsregisteret
      (every registered legal entity, ~1.17M) and Frivillighetsregisteret (the
      voluntary-organisation register, a filtered view of the same entities).
      Data released under NLOD 2.0; `organisasjonsnummer` is the join key that
      makes organisational data from any Norwegian source line up.

      No logo: Brreg's mark is not offered under the same open licence as the
      data, so the publisher page renders without one rather than
      redistributing it.

  - id: nav
    display_name: Arbeids- og velferdsdirektoratet
    homepage: https://www.nav.no/
    logo: /img/publishers/nav.svg
    feedback_url: https://www.nav.no/kontaktoss
    notes: |
      The Norwegian Labour and Welfare Administration. Publishes open
      labour-market and benefits statistics — registered unemployment,
      disability benefit (uføretrygd), work-assessment allowance (AAP) and
      sick-leave figures — mostly as monthly Excel releases per kommune.
      `display_name` is the formal directorate name; the public brand is
      "NAV", used in `publisher:` on every NAV manifest to match.

  - id: imdi
    display_name: Integrerings- og mangfoldsdirektoratet
    homepage: https://www.imdi.no/
    logo: /img/publishers/imdi.png
    feedback_url: https://www.imdi.no/om-imdi/kontakt-oss/
    notes: |
      The Directorate of Integration and Diversity. Publishes refugee
      resettlement figures (bosettingstall) and immigration statistics by
      reason and country background, per kommune and year. Atlas's existing
      FHI-mediated immigration figures (innvkat, innvandrere) describe *who*;
      IMDi's data is the *when/where* resettlement-flow signal neither of
      those carries.

  - id: udir
    display_name: Utdanningsdirektoratet
    homepage: https://www.udir.no/
    logo: /img/publishers/udir.png
    feedback_url: https://www.udir.no/om-udir/kontakt-oss/
    notes: |
      The Directorate for Education and Training. Publishes school-level
      register data (GSI — Grunnskolens Informasjonssystem), the annual
      pupil survey (Elevundersøkelsen: trivsel, mobbing) and absence
      statistics, at a sharper resolution than Atlas's existing FHI-mediated
      bullying figure (`fhi-mobbing`, a 3-year rolling 7th+10th-grade
      aggregate).

  - id: husbanken
    display_name: Husbanken
    homepage: https://www.husbanken.no/
    logo: /img/publishers/husbanken.svg
    feedback_url: https://www.husbanken.no/om-husbanken/kontakt/
    notes: |
      The Norwegian State Housing Bank. Publishes housing-support
      statistikkbank data (bostøtte, startlån) per kommune — the housing
      half of the income/welfare picture Atlas's SSB and NAV sources do not
      carry on their own.
