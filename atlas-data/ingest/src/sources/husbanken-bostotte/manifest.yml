dimensions:
  - code: region_code
    meaning: Kommune code, read directly from the hypercube's `KommuneNr` dimension
    value_format: 4-digit code (SSB standard) — not always a real kommune
    notes: >
      ⚠️ Confirmed live 2026-10-02, matching the exact lesson udir-gsi learned: Svalbard's two
      pseudo-codes (`2100`, `2111`) are present among Husbanken's 883 distinct `KommuneNr` values,
      always carrying real zero values for every measure (not suppressed — Husbanken's bostøtte
      programme genuinely administers no Svalbard cases). Named `region_code`, not `kommune_nr`, for
      this reason; `kommune_nr` resolution happens downstream via this project's existing
      `classify_region_code`/`region_code_to_kommune_nr` dbt macros.

      ⚠️ Also confirmed live: `KommuneNr` carries Oslo's 15 bydeler (plus one discontinued pre-2004
      one) as 4-digit codes `0311`-`0326`, named via Husbanken's own Qlik app (e.g. `0311` = "Gamle
      Oslo"). This is a second, incompatible bydel numbering from the 6-digit convention FHI's
      sources use for the same districts — `classify_region_code` now recognises both.
  - code: year
    meaning: Calendar year, read from the hypercube's `År` dimension
    value_format: 4-digit year
    notes: >
      ⚠️ Confirmed live: the underlying source records at DAILY grain (31 distinct `Dato` values
      checked for a single January) — an earlier investigation wrongly assumed annual grain. Atlas
      publishes at annual grain as its own choice (matching this source's sibling indicators and
      PLAN-011's recommendation), not because the source is coarser than that.

      ⚠️ Also confirmed live: a real null-year bucket exists in Husbanken's own data (`År` as the
      literal text `-`), seen both nationally and per-kommune (e.g. Svalbard code 2111). These rows
      are dropped during parsing, not fabricated into a fake year — see parse.ts.
  - code: measure
    meaning: Which bostøtte figure this row's value is — not a format variant
    value_format: "soknad | vedtak | utbetaling | avslag | belop"
    notes: >
      Five measures: application count, decision count, payout count, rejection count, and the paid
      kroner amount. Named via explicit `qLabel`s set on the Qlik request (`soknad`/`vedtak`/
      `utbetaling`/`avslag`/`belop`) — without a `qLabel`, Qlik echoes the raw expression string
      (e.g. `Sum(BostøtteSøknadTeller)`) instead, confirmed live.
  - code: value
    meaning: The measure's numeric value for this kommune and year
    value_format: Integer count, or kroner for the `belop` measure; no suppression marker found
    notes: >
      Checked live against Røyrvik (kommune 5043, Norway's smallest by bostøtte volume) — every cell
      is a real number, not a suppression placeholder. No suppression convention was found anywhere
      in this dataset during Phase 1/2 research.

