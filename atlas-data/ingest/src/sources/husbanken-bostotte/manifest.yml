upstream_landing_page: https://www.husbanken.no/tall-og-analyse/
upstream_title: "Statistikkbank — Bostøtte"
description: |
  Husbanken publishes bostøtte (housing allowance) application counts, decision counts, payout
  counts, rejection counts and the paid-out kroner amount, per kommune, per year, through its public
  "Statistikkbank" Qlik Sense app. Atlas reaches this over the Qlik Engine API (WebSocket JSON-RPC
  2.0, officially documented by Qlik), not Power BI as an earlier investigation assumed — see
  atlas-data/ingest/src/sources/husbanken-bostotte/README.md for the full mechanism, including why
  a single-page hypercube fetch fails and the paginated fetch this source uses instead.
publisher: Husbanken
