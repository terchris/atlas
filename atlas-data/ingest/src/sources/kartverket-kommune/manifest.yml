upstream_title: "Administrative enheter kommuner"
description: "Kartverket's current municipality boundaries, via Geonorge's order-based download API (same mechanism as kartverket-postnummeromrade — no static file URL exists). urb-agents #2098/#2099 (R4). Current state only, unlike dim_kommune's SSB-Klass-based full history — see the raw table's own migration header."
