dimensions:
  - code: indicator_api_id
    meaning: Stable surrogate indicator key for ZIP workbook rows (not Strapi)
    value_format: bv_zip_ind_<code> (e.g. bv_zip_ind_1a), or bv_zip_<24 lowercase hex> fallback
    notes: >
      Derived from the workbook filename's leading alphanumeric code (1a, 3m, 4f, ...) —
      Barnevern's indicator codes are alphanumeric, never purely numeric like the sibling
      Barnefattigdom source's Indikator_<n>. Hash fallback for any non-conforming filename.
  - code: region_code
    meaning: Geographic code from workbook column Region
    value_format: "0 (land), 2-digit fylke, 4-digit kommune, or 6-digit codes for bydel rows"
    notes: Rows follow whatever geography levels each indicator publishes.
  - code: category_format
    meaning: Workbook column Tallformat, normalised lowercase
    value_format: antall or andel
    notes: >
      Barnevern's own vocabulary — "andel" (share), not the sibling Barnefattigdom source's
      "prosent", verified live 2026-10-01 across all 23 standard workbooks. Despite the name,
      "andel" values are not all 0-100 percentages (e.g. kroner-per-child expenditure figures
      also use it) — treat it as "Norwegian-decimal formatted", not "is a percentage". Also:
      Barnevern's workbooks have no Enhet column (unlike the sibling Barnefattigdom source) —
      there is no category_unit dimension here.
  - code: year
    meaning: Calendar year column from workbook header row
    value_format: 4-digit integer
    notes: Spines differ by indicator — observed range 2015-2025 across sampled workbooks.
  - code: values_json
    meaning: Parsed year→value map for the geography and category_format slice
    value_format: JSON object with string year keys; suppressed cells as null
    notes: Matches the sibling source's raw semantics (full spine per slice).

lifecycle: stable
time_coverage:
  start: null
  end: null
keywords:
  - child-welfare
  - barnevern
  - kommune
  - families
methodology_notes: |
  Kommune-level child-welfare register indicators: undersøkelser (investigations), tiltak
  (interventions, in-home and out-of-home), fosterhjem i familie/nære nettverk, spending per
  child, staffing per 1000 children, deadline-compliance ("fristbrudd"), and turnover among
  saksbehandlere. Spines differ per indicator. Complements the sibling Barnefattigdom source's
  income-based poverty lens with a contact-with-the-system lens.
