# Hand-authored catalogue metadata for Bufdir Barnevern kommunemonitor.
# Ingest runs do not modify this file.

source_id: bufdir-barnevern
upstream_id: barnevern-monitor
upstream_url: https://www.bufdir.no/statistikk-og-analyse/monitor/barnevern/
upstream_landing_page: https://www.bufdir.no/statistikk-og-analyse/monitor/barnevern/
upstream_title: "Barnevern kommunemonitor"
description: |
  Barne-, ungdoms- og familiedirektoratet (Bufdir) publishes the Barnevern kommunemonitor on
  bufdir.no and ships a single bulk ZIP of indicator workbooks ("last ned hele datasettet"),
  the same mechanism as the sibling Barnefattigdom monitor. Atlas downloads that ZIP (URL
  discovered from the monitor page), parses sheet `Sheet1` in each standard-coded workbook, and
  loads kommune- and sub-kommune-level child-welfare time series into `raw.bufdir_barnevern` —
  contact with, and removal into, the child-welfare system, alongside spending, staffing, and
  deadline-compliance indicators. Plugs the barnevern axis Report #2 (Child Welfare /
  Vulnerability Composite) is missing today. One of 24 workbooks in the live bundle
  (`Turnover_kommunalt barnevern_2016-2024.xlsx`) has a structurally different layout and is
  excluded — see `parse.ts`'s `isStandardIndicatorWorkbook`.
