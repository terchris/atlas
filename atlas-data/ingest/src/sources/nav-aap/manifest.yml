upstream_id: AAP155
upstream_url: https://www.nav.no/no/nav-og-samfunn/statistikk/aap-nedsatt-arbeidsevne-og-uforetrygd-statistikk/arbeidsavklaringspenger
upstream_landing_page: https://www.nav.no/no/nav-og-samfunn/statistikk/aap-nedsatt-arbeidsevne-og-uforetrygd-statistikk/arbeidsavklaringspenger
upstream_title: "AAP155 Mottakere av arbeidsavklaringspenger. Kommune."
description: |
  NAV (Arbeids- og velferdsetaten) publishes AAP155 on its arbeidsavklaringspenger (AAP —
  work-assessment allowance, a transitional benefit paid while NAV assesses someone's capacity for
  work) statistics page: the count and share of the population receiving AAP, per kommune, as one
  xlsx workbook covering every month of the current calendar year to date. Atlas downloads that
  workbook (URL discovered from the page — a relative `/_/attachment/inline/...` link, re-resolved
  each run since it changes with every release) and loads the `1. Kommune. Antall` and
  `2. Kommune. Andel` sheets into `raw.nav_aap`. Atlas's second NAV source and second
  monthly-cadence source, reusing the `monthly_sources_refresh` job built for `nav-uforetrygd`.
  v1 tracks the live current-year file only; whether a historical archive exists for this specific
  table was checked and not found (unlike `nav-uforetrygd`'s PST302, which has one) — backfill is
  unresolved, not just deferred by convention.
