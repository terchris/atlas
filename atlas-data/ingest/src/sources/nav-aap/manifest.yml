tags:
  provider: nav
  topic: social
  geo: kommune
  cadence: monthly

dimensions:
  - code: region_code
    meaning: Geographic code from the workbook row label, or the literal text "Ukjent"
    value_format: "4-digit kommune code, or the literal string Ukjent (NAV's own unknown-region bucket)"
    notes: >
      Confirmed live 2026-10-02: this table has NO fylke rows and NO bydel rows at all (unlike
      nav-uforetrygd's PST302) — every real region row is a 4-digit kommune code. The one exception
      is "Ukjent" (NAV's own region-not-determinable bucket, a real and substantial count — 1,500+
      people nationally per month, not a rounding artifact), which carries no numeric code at all.
      region_kind is derived downstream via classify_region_code, which correctly falls through to
      its existing `unknown` branch for a non-numeric label — no macro change needed.
      ⚠️ "Ukjent" exists only in the Antall (count) sheet — the Andel (share) sheet omits it
      entirely (357 regions there, 358 in Antall), presumably because there is no population
      denominator to compute a share against for a non-geographic bucket.
  - code: category_format
    meaning: Which sheet the row came from, not a column within a sheet
    value_format: antall or andel
    notes: Same convention as nav-uforetrygd — NAV publishes count and share as two separate sheets.
  - code: year
    meaning: "Calendar year, read from the sheet's own period-label cell (e.g. 'Periode: 2026 01 - 2026 08')"
    value_format: 4-digit integer
    notes: One year per file — the live file is replaced in place as the year progresses.
  - code: month
    meaning: Calendar month, from the sheet's own Norwegian month-name header row
    value_format: 1-12 integer
    notes: A plain integer column, same shape as nav-uforetrygd — no dim_period reference.
  - code: values_json
    meaning: Parsed month->value map for the region and category_format slice, for this sheet's year
    value_format: JSON object with string month-number keys; suppressed cells (NAV's own `*` marker) as null
    notes: Matches the full month spine present in the live file (partial-year, growing monthly).

lifecycle: stable
time_coverage:
  start: null
  end: null
keywords:
  - arbeidsavklaringspenger
  - aap
  - welfare
  - kommune
  - monthly
methodology_notes: |
  Count and share of people receiving arbeidsavklaringspenger (AAP) per kommune. AAP is a
  transitional benefit paid while NAV assesses someone's remaining capacity for work — distinct
  from `nav-uforetrygd`'s uføretrygd, which is the longer-term outcome once that assessment
  concludes someone cannot work. Small cells are suppressed with `*` — the workbook's own
  methodology sheet states the exact rule: any cell representing fewer than 4 people, per
  Statistikklovens § 2-6.
suggested_joins: []
