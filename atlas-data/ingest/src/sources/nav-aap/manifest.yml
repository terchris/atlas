# 🔵 Licence independently re-confirmed for AAP specifically, 2026-10-02 —
# fetched NAV's general statistics-practices page directly ("Statistikk fra
# Nav på nav.no er åpne data og lisens for bruk er Creative Commons
# Navngivelse 4.0 Internasjonal", linking creativecommons.org/licenses/by/4.0/deed.no).
# This is a blanket statement covering all NAV statistics, not a per-table
