dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "~409 codes"
  - code: AAR
    meaning: 5-year rolling window (year-of-death)
    value_format: '"YYYY1_YYYY5" 5-year period label'
    notes: 31 rolling windows upstream, from 1990–1994 to ~2020–2024. Atlas pulls latest 3.
  - code: KJONN
    meaning: Sex
    value_format: 3 codes
    notes: '"0" both, "1" men, "2" women — male suicide rates are markedly higher than female'
  - code: ALDER
    meaning: Age band
    value_format: '"min_max" range string'
    notes: '13 bands incl. 0_120 aggregate, 0_74, 15_24 (youth), 25_44, 45_74, 75+, etc.'
  - code: AARSAK
    meaning: Cause of death
    value_format: 1 code (degenerate)
    notes: 'Always "SELVMORD" — table is pre-filtered to suicide. Stored for shape consistency with the wider FHI cause-of-death tables 342 / 343.'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 4 codes upstream; Atlas filters to 1
    notes: "MEIS only (FHI's smoothed indicator that pools across geography to stabilise small-area estimates). Raw RATE / TELLER / SMR available upstream for analyses where pooling is inappropriate."

