dimensions:
  - code: oppdateringsid
    meaning: Brreg's monotonic change identifier, and the cursor the feed is walked by
    value_format: bigint, sparse
    notes: >-
      🔴 Sparse, and that matters. The id space runs to ~25.18M against ~16.4M
      records, so the gap between two ids is NOT the number of changes between
      them — asking for id 16,417,000 returns a first record of 16,427,801.
      Never compute a backlog by subtracting ids; read `page.totalElements` at the
      cursor, which is a correct remaining-record count.
  - code: endringstype
    meaning: What kind of change Brreg recorded
    value_format: Ny, Endring, Sletting, Fjernet or Ukjent
    notes: >-
      All five occur and all five are handled. `Sletting` is the deletion in
      current traffic; `Fjernet` is real but concentrated in older eras (23 of 500
      at oppdateringsid 16,400,000, and absent from the 2026-09-11 daily sample);
      `Ukjent` is the entire pre-2018-08 history and must never delete anything.
      Stored verbatim and not constrained to an enum — a sixth value must land and
      be counted, not rejected at the door.
  - code: organisasjonsnummer
    meaning: The organisation the change is about
    value_format: 9 digits, leading zeros significant — always text
    notes: >-
      Joins to raw.brreg_enheter_snapshot. Retained after deletion, which is what
      lets a tombstone address a row that no longer has a live entity behind it.
  - code: doc
    meaning: The organisation's document as it stood when the change was received
    value_format: jsonb, or null when the entity fetch failed
    notes: >-
      ⚠️ For a `Sletting` this is Brreg's SIX-KEY STUB, not a full record — a
      deleted organisation still answers HTTP 200 with `slettedato` set. Branch on
      endringstype; never assume doc is a complete Enhet, and never detect deletion
      from a status code.
  - code: process_status
    meaning: What Atlas did with the change
    value_format: applied, tombstoned or skipped_unknown
    notes: >-
      Derived from endringstype at load time. `skipped_unknown` covers both
      `Ukjent` and any future sixth value, deliberately — the run counts and
      surfaces them rather than guessing an action.

