source_id: fhi-mediebruk-underhold
upstream_id: "667"
upstream_url: https://statistikk-data.fhi.no/api/open/v1/nokkel/table/667
upstream_title: "Mediebruk_underhold_ungdata"
description: "FHI Folkehelsestatistikk table 667 — share of Ungdata respondents reporting more than 3 hours per day on streaming / entertainment media (TV streaming, music, podcasts, etc.). Companion to fhi-mediebruk-spill and fhi-mediebruk-some on the Ungdata cohort."
publisher: Folkehelseinstituttet
license: NLOD
license_url: https://data.norge.no/nlod/no/2.0
periodicity: P1Y
eu_theme: HEAL
attribution: "Kilde: Folkehelseinstituttet, Folkehelsestatistikk tabell 667 (Ungdata)"

tags:
  provider: fhi
  topic: health
  geo: kommune
  cadence: annual

dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "~409 codes"
  - code: AAR
    meaning: Year
    value_format: '"YYYY_YYYY" range string (single-year)'
    notes: 8 single-year periods, 2018–2025 (shorter series than the other two media tables — streaming was a newer category)
  - code: KJONN
    meaning: Sex
    value_format: 3 codes
    notes: '"0" both, "1" men, "2" women'
  - code: ALDER
    meaning: Age band (Ungdata cohort grouping)
    value_format: 1 code (degenerate)
    notes: 'Always "1_6" — Ungdata survey-cohort identifier. Verify against Ungdata methodology.'
  - code: MEDIEBRUK
    meaning: Media-use frequency band
    value_format: 1 code (degenerate)
    notes: 'Always "Merenn3timer" (more than 3 hours per day). The value is the share reaching the threshold — risk direction (though weaker mental-health-outcome correlation than the SOME social-media table).'
  - code: SOES
    meaning: Socioeconomic status
    value_format: 1 code (degenerate)
    notes: 'Always "0" — combined SES.'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 2 codes
    notes: "SMR (standardised ratio vs national), MEIS (FHI mean / smoothed indicator). No TELLER / RATE — Ungdata is sample-based."

lifecycle: stable
time_coverage:
  start: 2018
  end: 2025
