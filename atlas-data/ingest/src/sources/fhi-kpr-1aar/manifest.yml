  - code: AAR
    meaning: Year
    value_format: '"YYYY_YYYY" range string (single-year despite the range form)'
    notes: 8 single-year periods upstream (2017–2024); Atlas pulls latest 1
  - code: KJONN
    meaning: Sex
    value_format: 3 codes upstream; Atlas filters to 1
    notes: '"0" combined (only value Atlas ingests). Sex-stratified analysis would need a sibling source.'
  - code: ALDER
    meaning: Age band
    value_format: '"min_max" range string'
    notes: 10 bands incl. 0_74 aggregate, 15_24, 25_44, 45_74 disjoint slices
  - code: KODEGRUPPE
    meaning: ICPC-2 code-group identifier (primary-care diagnoses / symptoms)
    value_format: 11 code-range strings
    notes: 'P01_P29 (psych symptoms), P70_P99 (psych diagnoses), P01_P29ogP70_P99 (combined chapter P — exclude from disjoint sums), K70_K99 (cardiovascular), L01_L29 / L70_L99 (musculoskeletal), Skader (injuries), plus specific symptom clusters.'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 4 codes upstream; Atlas filters to 1
    notes: "RATE (per-1000 contact rate — only value Atlas ingests). TELLER / SMR / MEIS available upstream."

