dimensions:
  - code: GEO
    meaning: Region (mixed kommune / fylke / bydel / nasjon)
    value_format: 1- to 6-character numeric code
    notes: "~409 codes"
  - code: AAR
    meaning: Year
    value_format: '"YYYY_YYYY" range string (single-year)'
    notes: 14 single-year periods upstream (2012–2025); Atlas pulls latest 4 to fit cell budget
  - code: KJONN
    meaning: Sex
    value_format: 3 codes
    notes: '"0" both, "1" men, "2" women — girls report markedly higher rates of depressive symptoms'
  - code: ALDER
    meaning: Age band (Ungdata cohort grouping)
    value_format: 1 code (degenerate)
    notes: 'Always "1_6" — Ungdata survey-cohort identifier (same as fhi-livskvalitet). Verify against Ungdata methodology.'
  - code: DEPRESJON
    meaning: Depression-symptom response
    value_format: 1 code (degenerate)
    notes: 'Always "Ja" — yes-respondents only. The value is the share reaching the symptomatic threshold.'
  - code: SOES
    meaning: Socioeconomic status
    value_format: 4 codes
    notes: '"0" combined + "1"/"2"/"3" specific levels (typically low/middle/high family SES). Verify against Ungdata methodology.'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 2 codes
    notes: "SMR (standardised ratio vs national), MEIS (FHI mean / smoothed indicator). No TELLER / RATE — Ungdata is sample-based."
