dimensions:
  - code: organisasjonsnummer
    meaning: The organisation's nine-digit identifier, and the join key to Enhetsregisteret
    value_format: 9 digits, leading zeros significant — always text
    notes: >-
      Also the pagination key: this API walks by `searchAfter=<last
      organisasjonsnummer>` rather than by page number.
  - code: icnpo_nummer
    meaning: Primary ICNPO code as the organisation classified itself
    value_format: 4-digit string, e.g. "9100"
    notes: >-
      🟢 Taken from `icnpoKategorier` at `rekkefoelge` 1, not array position 0 — the
      array is not guaranteed sorted and taking the first element would silently
      promote a secondary classification. The registrant's own classification is
      better evidence than one derived from a NACE industry code, which is the route
      available for organisations NOT in this register.
  - code: icnpo_kategori
    meaning: Primary ICNPO category label
    value_format: e.g. ICNPOKategori.internasjonaleOrganisasjoner
    notes: Paired with icnpo_nummer from the same array element. Null when the organisation declares none.
  - code: doc
    meaning: The upstream record exactly as Brreg published it
    value_format: jsonb object
    notes: >-
      Holds frivilligOrganisasjonsstatus, kontonummer, innfoertDato,
      foersteGangInnfoert, grasrotandel, regnskapsrapportering, vedtekter,
      paategninger and the complete icnpoKategorier array including any secondary
      categories the typed columns do not carry.

