    meaning: Quality-of-life score band
    value_format: 1 code (degenerate)
    notes: 'Always "8_10" — share of respondents reporting high quality of life (8–10 on a 0–10 self-report scale).'
  - code: SOES
    meaning: Socioeconomic status
    value_format: 1 code (degenerate)
    notes: 'Always "0" — combined socioeconomic statuses (no breakdown in this slice).'
  - code: MEASURE_TYPE
    meaning: Which number
    value_format: 2 codes
    notes: "SMR (standardised ratio vs national), MEIS (FHI mean / smoothed indicator). No TELLER / RATE — Ungdata is sample-based, not an enumeration."
