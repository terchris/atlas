methodology_notes: |
  Counted as of October 1st each school year, per Udir's own GSI collection cycle. "Individuelt
  tilrettelagt opplæring/spesialundervisning" and "forsterket opplæring i norsk" are two distinct
  support categories, not a breakdown of one category into the other.
