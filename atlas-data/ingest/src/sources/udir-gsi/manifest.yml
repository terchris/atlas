# Hand-authored catalogue metadata for Udir's GSI (Grunnskolens informasjonssystem).
# Ingest runs do not modify this file.

source_id: udir-gsi
upstream_id: GSK_Elev_Skol
upstream_url: https://www.udir.no/tall-og-forskning/statistikk/statistikk-grunnskole/tall-om-elever-og-skoler/
upstream_landing_page: https://www.udir.no/tall-og-forskning/innrapportering/gsi/
upstream_title: "GSI — Elever og skoler"
description: |
  Utdanningsdirektoratet (Udir) publishes GSI (Grunnskolens informasjonssystem) — pupil counts,
  counts of pupils with individually-tailored instruction, counts of pupils with reinforced
  Norwegian instruction, and school counts — per kommune, per school year, reported annually as of
  October 1st. Atlas reaches this through Udir's own statistics API (statistikkportalen.udir.no/
  api/rapportering, "USS — Udirs StatistikkSystem"), resolving the current report version and the
  set of available school years dynamically rather than hardcoding either. The API's own
  documentation (https://www.udir.no/om-udir/data/) names a different, dead hostname
  (api.udir-statistikkbanken.no) for a sibling endpoint (Elevundersøkelsen) — the correct host for
  the system this source actually uses is statistikkportalen.udir.no, found by reading a live error
  response rather than trusted from the docs page. See
  atlas-data/ingest/src/sources/udir-gsi/README.md for the full mechanism.
publisher: Utdanningsdirektoratet
license: NLOD
license_url: https://data.norge.no/nlod/no/2.0
periodicity: P1Y
eu_theme: EDUC
attribution: "Kilde: Utdanningsdirektoratet (Udir), GSI"

# 🔵 Licence confirmed DIRECTLY on Udir's own terms page, 2026-10-01 —
# unlike imdi-bosetting's NLOD default, this is not Atlas's fallback:
# "Dataene er lagt ut for viderebruk under Norsk lisens for offentlig data
# (NLOD)" — https://www.udir.no/om-udir/data/, Terms of Use section.

tags:
  provider: udir
  topic: education
  geo: kommune
  cadence: annual

dimensions:
  - code: region_code
    meaning: SSB-format region code, read directly from the API's own `kode` field at the third
      hierarchy level (fylke two levels up, individual school one level down)
    value_format: 4-digit code (SSB standard) — not always a real kommune
    notes: >
      Verified live 2026-10-02: the GSI data endpoint's `EnhetID` hierarchy already carries real
      SSB-format codes at this level when the request includes `inkluderKoder=true` — no crosswalk
      needed, unlike imdi-bosetting's free-text names. ⚠️ But "same tree depth as a kommune" is not
      "is a kommune": `2100` (Svalbard) and `2111` sit at this exact depth because GSI reports a
      school there, matching SSB's own `21xx` Svalbard pattern. Named `region_code`, not
      `kommune_nr`, for this reason — `kommune_nr` is resolved downstream via this project's
      existing `classify_region_code`/`region_code_to_kommune_nr` dbt macros, same as every other
      kommune-grain source, not assumed from the raw code's shape.
  - code: year
    meaning: School year, read from the `TidID` filter dimension (e.g. 202510 = school year 2025-26)
    value_format: 6-digit school-year code, YYYY10 (the trailing 10 is the API's own convention, not
      an Atlas derivation)
    notes: >
      Every available year is discovered dynamically via the API's own filterVerdier endpoint, not
      a hardcoded range — a year Udir adds later is picked up automatically.
  - code: measure
    meaning: Which GSI figure this row's value is — not a format variant
    value_format: "Antall elever | Antall elever med individuelt tilrettelagt opplæring/spesialundervisning | Antall elever med forsterket opplæring i norsk | Antall skoler"
    notes: >
      Four distinct counts (total pupils, pupils with individually-tailored instruction, pupils
      with reinforced Norwegian instruction, school count), named verbatim from the API's own column
      metadata — no separate text-lookup round trip needed to label them. This is the grand-total
      slice only (all grades, all sexes, all ownership types combined) — the underlying report also
      supports breaking these same four measures down by trinn (grade), kjønn (sex) and eierform
      (public/private), which this source does not ingest. See
      atlas-data/ingest/src/sources/udir-gsi/README.md for why.
  - code: value
    meaning: The measure's numeric value for this kommune and year
    value_format: Integer count; null when suppressed
    notes: >
      Udir's own suppression marker is the literal character `*` — the same convention
      `nav-uforetrygd` uses. Confirmed live on real small kommuner (e.g. Træna, Utsira) where the
      individually-tailored-instruction and Norwegian-reinforcement counts are suppressed while the
      plain pupil/school counts for the same kommune are not.

lifecycle: stable
time_coverage:
