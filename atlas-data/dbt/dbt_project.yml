name: atlas
version: 0.0.0
config-version: 2

# Name of the profile block in profiles.yml (colocated in this directory).
profile: atlas

model-paths:     ["models"]
analysis-paths:  ["analyses"]
test-paths:      ["tests"]
seed-paths:      ["seeds"]
macro-paths:     ["macros"]
snapshot-paths:  ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  atlas:
    # Default materialisation for any model we don't override.
    +materialized: view
    # dbt-osmosis: keep one schema.yml per directory (existing convention).
    # See atlas-data/dbt/check-osmosis.sh and PLAN-001 phase 1.
    +dbt-osmosis: schema.yml
    # Per-source indicator passthroughs live in models/indicators/ and are
    # materialised as tables in the marts schema.
    indicators:
      +materialized: table
      +schema: marts
    # Conformed dimensions live in models/dimensions/ and also land in marts.
    dimensions:
      +materialized: table
      +schema: marts
    # Application-shaped and cross-source marts.
    marts:
      +materialized: table
      +schema: marts

seeds:
  atlas:
    # Reference seeds (ref_*) decode coded fields from upstream sources into
    # human-readable labels. Dimension seeds (dim_*) and crosswalks
    # (crosswalk_*) carry conformed reference data joined to facts. All
    # land in marts so consuming models can join them without cross-schema
    # syntax. Refresh policy: see seeds/README.md.
    +schema: marts
    # Pin types so dbt's CSV sniffing doesn't strip leading zeros from
    # codes that look numeric (e.g. ICNPO "1100", postnummer "0150").
    # A column type listed here is only applied if the CSV has that column;
    # extra entries are harmless.
    +column_types:
      code: text
      parent_code: text
      label_no: text
      label_en: text
      description: text
      sort_order: integer
      postnummer: text
      post_office: text
      kommune_nr: text
      name: text
      name_kind: text
      orgnr: text
      slug: text
      brand_name: text
      website_url: text
      tier: text
      chapter_data_shape: text
      has_chapters: boolean
      primary_focus: text
      icnpo_code_1: text
      icnpo_code_2: text
      icnpo_code_3: text
      # _sources_manifest columns (PLAN-007 phase 2). upstream_id pinned
      # to text so SSB table IDs like "08764" keep their leading zero;
      # the rest are pinned to avoid CSV type-sniffing surprises.
      source_id: text
      upstream_id: text
      upstream_url: text
      upstream_title: text
      publisher: text
      license: text
      license_url: text
      periodicity: text
      eu_theme: text
      attribution: text
      tags: text
      # eu_data_theme.csv columns
      uri: text
      # _sources_dimensions.csv columns
      meaning: text
      value_format: text
      notes: text
