name: atlas
version: 0.0.0
config-version: 2

# Name of the profile block in profiles.yml (colocated in this directory).
profile: atlas

model-paths:     ["models"]
analysis-paths:  ["analyses"]
test-paths:      ["tests"]
seed-paths:      ["seeds"]
macro-paths:     ["macros"]
snapshot-paths:  ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ── Ingest cadence -> maximum tolerated age, in days ──────────────────────────
#
# 🔴 ONE LITERAL, TWO READERS. `mart_source_freshness` computes the comparison
# and `tests/raw_sources_were_refreshed_recently.sql` gates on it. The map used
# to live inline as the default of a `var()` call in the test; a second reader
# would have meant a second default, and two numbers that must agree is the
# failure this project keeps meeting. Neither reader supplies a default now, so
# deleting this block breaks both loudly rather than silently halving a bound.
#
# Mostly the polling interval plus enough slack to absorb one late tick, and no
# more:
#     weekly     7 + 1
#     monthly   31 + 4   (a 31-day month, then four days to notice a missed tick)
#     daily      1 + 1
#
# 🔴 half_hourly IS NOT DERIVED FROM ITS INTERVAL, AND THAT IS DELIBERATE. The
# Brreg change feed writes rows only when changes arrive, so for those tables
# max(loaded_at) measures UPSTREAM ACTIVITY, not pipeline health. Measured
# against Brreg's quietest days the longest quiet gap is ~4.2 h, and a Saturday
# tail into a Sunday lead bridges ~6 h. One day is tight enough to catch a dead
# feed within a day and loose enough never to fire on a quiet weekend. The tight
# signal for those sources is Dagster's FreshnessPolicy (cadence.BRREG_FRESHNESS,
# 2 h warn / 6 h fail), which measures materialisation. Two systems, two
# questions — do not tighten this one to match that one.
vars:
  ingest_cadence_max_age_days:
    half_hourly: 1
    daily: 2
    weekly: 8
    monthly: 35

models:
  atlas:
    # Default materialisation for any model we don't override.
    +materialized: view
    # dbt-osmosis: keep one schema.yml per directory (existing convention).
    # See atlas-data/dbt/check-osmosis.sh and PLAN-001 phase 1.
    +dbt-osmosis: schema.yml
    # Push column + table descriptions into pg_description (Postgres
    # native COMMENT ON statements) on every dbt run. PostgREST's
    # OpenAPI spec then includes them per column, and any MCP server
    # / catalogue introspection tool reading the DB sees the semantic
    # context Atlas writes in schema.yml. Without this, marts.* columns
    # appear in the API spec with names only — useless for AI agents
    # trying to understand "what is org_nr?" without the
    # dbt-osmosis-propagated description.
    +persist_docs:
      relation: true
      columns: true
    # See the block below, and macros/analyze_if_table.sql for why it is a
    # macro rather than a literal `analyze {{ this }}`.
    +post-hook: "{{ analyze_if_table() }}"
    # 🔴 EVERY TABLE IS ANALYSED AFTER IT IS BUILT, AND WITHOUT THIS THE PUBLIC
    # API HANDS CONSUMERS FICTION.
    #
    # dbt rebuilds these tables on every transform, which resets their planner
    # statistics to nothing. Autovacuum never catches up before the next
    # rebuild, so Postgres estimates row counts from raw page counts — and
    # PostgREST's `Prefer: count=estimated`, the cheap way a consumer sizes a
    # relation before fetching it, reports those estimates verbatim.
    #
    # ⚠️ Measured on the published API, 2026-09-19, by an outside consumer
    # building a real app (urb-agents #1250) and reproduced here:
    #
    #     activity_catalog        estimated=420   exact=0
    #     distrikt_summary        estimated=410   exact=0
    #     kommune_local_chapters  estimated=280   exact=0
    #     ngo_index               estimated=210   exact=11
    #     meta_sources            estimated=170   exact=44
    #
    # Three relations claimed hundreds of rows while returning none. A consumer
    # following the obvious discovery pattern — count cheaply, then fetch —
    # built a dashboard whose headline number was not true.
    #
    # 🔵 `raw.brreg_enhet` estimated sensibly throughout, which is the control:
    # it is written by the ingest rather than rebuilt by dbt, so autovacuum gets
    # to analyse it. The difference between the two is this hook.
    #
    # 🔴 THIS FIXES TABLES. IT CANNOT FIX VIEWS, AND READING IT AS "ESTIMATES ARE
    # SANE NOW" IS HOW A CONSUMER GETS BURNED.
    #
    # A view has no `reltuples` for ANALYZE to populate — the planner estimates
    # from the underlying query instead. So the two rollups that became views to
    # fix a drift defect (#1265, #337) re-broke their own estimates, measured
    # 2026-09-20: kommune_ngo_summary 12.8x over, kommune_ngo_totals 19.5x over.
    #
    # ⚠️ That is not a reason to materialise them back. Correct data with a bad
    # row estimate beats stale data with a good one, and the consumer that found
    # it said so first. The remedy is that `count=estimated` is documented as
    # unreliable on views, on meta_endpoints.table_type where a consumer looks.
    #
    # ⚠️ ANALYZE also cannot help an EMPTY table: the planner floors its estimate
    # at 1, so three relations holding zero rows report `estimated = 1`. "Is
    # there any data here?" answered cheaply returns yes.
    #
    # ⚠️ Hooks are ADDITIVE in dbt, so `marts.api` keeps restore_api_v1_view()
    # below and gains this as well. Do not move this onto the top-level
    # `atlas:` key — that also covers view-materialised models, and `ANALYZE`
    # on a view is a warning on every run, which is how a log stops being read.
    # Per-source indicator passthroughs live in models/indicators/ and are
    # materialised as tables in the marts schema.
    indicators:
      +materialized: table
      +schema: marts
    # Conformed dimensions live in models/dimensions/ and also land in marts.
    dimensions:
      +materialized: table
      +schema: marts
    # Application-shaped and cross-source marts.
    marts:
      +materialized: table
      +schema: marts
      # 🔴 Every api_v1 wrapper is recreated the instant its mart is rebuilt.
      #
      # Rebuilding a mart table drops it `cascade` (dbt's own table.sql renames
      # the old aside, then drops it), which destroys the api_v1 view on top of
      # it. `apply-api-v1.sh` used to be the only thing that put them back — at
      # the END of the run — so the public API served 404 for the length of every
      # transform, and indefinitely after any FAILED one.
      #
      # Set here rather than on fourteen models so a new api mart inherits it
      # without anyone remembering. See macros/restore_api_v1_view.sql for the
      # mechanism, the measurement, and what this deliberately does not fix.
      api:
        +post-hook: "{{ restore_api_v1_view() }}"

seeds:
  atlas:
    # Reference seeds (ref_*) decode coded fields from upstream sources into
    # human-readable labels. Dimension seeds (dim_*) and crosswalks
    # (crosswalk_*) carry conformed reference data joined to facts. All
    # land in marts so consuming models can join them without cross-schema
    # syntax. Refresh policy: see seeds/README.md.
    +schema: marts
    # Mirror models' persist_docs setting — schema.yml descriptions for
    # seeds (e.g. dim_postnummer, ref_brreg_icnpo) flow into pg_description
    # the same way model descriptions do. Important because seeds are
    # exposed via PostgREST's marts.* schema to consumers.
    +persist_docs:
      relation: true
      columns: true
    # See the block below, and macros/analyze_if_table.sql for why it is a
    # macro rather than a literal `analyze {{ this }}`.
    +post-hook: "{{ analyze_if_table() }}"
    # Pin types so dbt's CSV sniffing doesn't strip leading zeros from
    # codes that look numeric (e.g. ICNPO "1100", postnummer "0150").
    # A column type listed here is only applied if the CSV has that column;
    # extra entries are harmless.
    +column_types:
      code: text
      parent_code: text
      label_no: text
      label_en: text
      description: text
      sort_order: integer
      postnummer: text
      post_office: text
      kommune_nr: text
      name: text
      name_kind: text
      orgnr: text
      slug: text
      brand_name: text
      website_url: text
      tier: text
      chapter_data_shape: text
      has_chapters: boolean
      primary_focus: text
      icnpo_code_1: text
      icnpo_code_2: text
      icnpo_code_3: text
      # _sources_manifest columns (PLAN-007 phase 2). upstream_id pinned
      # to text so SSB table IDs like "08764" keep their leading zero;
      # the rest are pinned to avoid CSV type-sniffing surprises.
      source_id: text
      upstream_id: text
      upstream_url: text
      upstream_title: text
      publisher: text
      license: text
      license_url: text
      periodicity: text
      eu_theme: text
      attribution: text
      upstream_landing_page: text
      tags: text
      # eu_data_theme.csv columns
      uri: text
      # _sources_dimensions.csv columns
      meaning: text
      value_format: text
      notes: text
