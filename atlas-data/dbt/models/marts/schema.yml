version: 2
models:
  - name: fact_kommune_indicators
    description: |
      First cross-source mart. Long-format union of kommune-level indicators
      joined to dim_kommune and dim_fylke. One row per
      (source_id, kommune_nr, year, contents_code). Frontend and analyst
      consumers should read from this table when they need kommune-level
      indicator values regardless of which source produced them.

      Currently includes ssb-08764 (child poverty EU/OECD) and ssb-06913
      (population change). Sources with shape-mismatches (ssb-07459 by sex/age,
      ssb-12944 by age_group/period) are not here yet — they need either
      source-specific marts or an extended schema once use cases clarify.
    columns:
      - name: source_id
        description: Atlas source identifier, e.g. 'ssb-08764'.
        data_tests:
          - not_null
          - accepted_values:
              values: [ssb-08764, ssb-06913, ssb-06944, fhi-bor-alene, ssb-13995, ssb-06947, 
                    ssb-06083, ssb-12292, ssb-12063, ssb-12131, ssb-12132, ssb-09429, fhi-trangbodd, 
                    fhi-mobbing, fhi-vgs-gjennomforing, ssb-crime-tables,
                    fhi-alkohol, fhi-depresjon, fhi-fortrolig-venn, fhi-hasj, fhi-livskvalitet,
                    fhi-mediebruk-some, fhi-mediebruk-spill, fhi-mediebruk-underhold,
                    fhi-smertestillende,
                    fhi-neet, fhi-befolkning, fhi-befolkningsvekst, fhi-innvkat,
                    fhi-kpr-1aar, fhi-prognose, fhi-selvmord, fhi-innvandrere,
                    ssb-12944]
      - name: kommune_nr
        description: 4-digit kommune code. FK to dim_kommune.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Joined from dim_kommune.
        data_tests: [not_null]
      - name: fylke_nr
        description: 2-digit fylke code (derived from kommune_nr in dim_kommune). FK to dim_fylke.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
      - name: fylke_name
        description: >-
          Joined from dim_fylke. NULL if kommune's fylke_nr isn't in dim_fylke (rare — happens for codes
          like Svalbard 21xx without a matching fylke).
      - name: year
        description: |
          Calendar year — and for a source published in multi-year windows,
          the FIRST year of the window rather than the year of the data.

          🔴 `fhi-selvmord` uses 5-year rolling windows, so its newest row
          reads `year = 2020` and covers 2020-2024. `fhi-mobbing` uses
          3-year windows. ⚠️ On 2026-09-21 that made a current series look
          six years stale to a careful reader, who was about to tell a
          consumer so (urb-agents #1321).

          ⚠️ THIS LINE PREVIOUSLY SAID THE FACT COULD NOT EXPRESS THE
          WINDOW, and told readers to go read the indicator model. That was
          true until 2026-09-21 and is no longer: `window_years` below
          carries the span. The advice was also the defect — a consumer who
          has to leave the table to render a year correctly mostly will
          not, and the two errors in urb-agents #1321 and #1331 are what
          that looks like. Read `year` together with `window_years`.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: 2050
      - name: window_years
        description: |
          How many calendar years `year` covers. 1 for a point-in-time
          observation, 5 for `fhi-selvmord`'s rolling window, 3 for
          `fhi-mobbing`. The covered span is `year` to
          `year + window_years - 1` inclusive.

          🔴 THIS IS A FACT ABOUT THE UPSTREAM TABLE, NOT AN ATLAS OPINION.
          It is derived, not declared: `period_end_year - period_start_year
          + 1` from the source's own period string, via the `window_years()`
          macro. For the 11 CTEs whose source publishes no period columns
          it is the literal 1, which is the same claim their single-year
          `period` already makes.

          ⚠️ 1 HERE MEANS "ONE YEAR", NOT "UNKNOWN". A source that is
          genuinely windowed but ships no period columns would read 1 and
          be wrong.

          🔵 THE UPSTREAM'S OWN WORDS ARE IN `api_v1.meta_dimensions`. Query
          `?code=in.(AAR,Tid)&select=source_id,meaning,value_format` for what
          each source says its time dimension is — `fhi-selvmord` "5-year
          rolling window", `fhi-vgs-gjennomforing` "3-year rolling cohort",
          `fhi-kpr-1aar` "single-year despite the range form". That relation
          is the independent check on this column, and
          `check-window-agrees-with-the-catalogue.sh` fails CI when the two
          disagree.

          ⚠️ An earlier version of this description claimed every windowed
          source in Atlas was an FHI table. `ssb-12944` is "3-year rolling
          period" and is only absent from this fact because it is still in
          the serving BACKLOG — it is the next source that would get a
          wrong 1 (urb-agents #1333).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 10
      - name: contents_code
        description: Source-specific ContentsCode verbatim from upstream (e.g. 'EUskala60', 
          'Folkemengde').
        data_tests: [not_null]
      - name: contents_label
        description: Human-readable label for contents_code, verbatim from upstream.
      - name: value
        description: >-
          Numeric value. Unit depends on (source_id, contents_code) — see the source's README. NULL when
          upstream suppressed the cell.
      - name: status
        description: SSB suppression marker. NULL when value is present.
      - name: kommune_is_active
        description: >-
          Whether the kommune is active today. False for historical kommune codes that only appear because
          the upstream retained them. ⚠️ TRUE for SSB's 9999 'Uoppgitt' — it is a current code. Use
          kommune_is_sentinel as well; see below.
        data_tests:
          - not_null
      - name: kommune_is_sentinel
        description: |
          True for a code that is current but is not a municipality — SSB's
          9999 'Uoppgitt'. Carried from dim_kommune so downstream marts can
          exclude it without re-deriving what a sentinel is.

          🔴 `kommune_is_active` alone is not enough, and that gap was live.
          Every mart meaning "the municipalities" filtered on is_active and
          therefore included a non-place: coverage_gap_barnefattigdom emitted a
          row for it, indicator_summary counted it in its coverage figures, and
          indicator_missing_kommuner asserted once per series that it was
          missing data it could never have (urb-agents #1301).

          🔵 dim_kommune still carries the row. Klass 131 publishes 9999 and
          Atlas does not drop what SSB publishes — the dimension mirrors the
          source, the marts are Atlas's own constructs and Atlas defines their
          grain.
        data_tests:
          - not_null
      - name: updated_at
        description: When the underlying raw row was last loaded.
        data_tests: [not_null]
    data_tests:
      # 🔵 This grain test is what makes the bufdir union decidable.
      #
      # indicators__bufdir_barnefattigdom emits exactly this fact's shape and is
      # not unioned in (see the model). Bufdir renumbers indicators, so a naive
      # union could put the same (kommune, year, contents_code) in twice and
      # silently inflate indicator_summary and indicator_latest_values — both
      # would still return rows. This turns that into a caught failure.
      #
      # ⚠️ I claimed on 2026-09-19 that this test did not exist and added a
      # second copy of it (urb-agents #1257, commit be100c1). It has been here
      # since the model was written. I reached that conclusion by grepping for
      # it and piping through `head -6`, which cut the file above the answer —
      # a search whose output I truncated and then treated as the file's
      # contents. The duplicate was a YAML duplicate key, which dbt tolerates
      # and js-yaml rejects, so it broke the website generator while every dbt
      # gate stayed green.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - kommune_nr
            - year
            - contents_code

  - name: fact_chapter_activities
    description: |
      The supply-side fact: one row per (chapter, activity) for every NGO in
      dim_ngo. Cross-NGO Coverage-gap queries join this to dim_activity (for
      service_category_code) and to dim_chapter (for is_active, chapter_level,
      kommune_nr filters).

      v1 contains Red Cross only; PLAN-003 adds Folkehjelp via a UNION ALL in
      the source CTE. Per-activity dormancy is not modelled in v1 — is_active
      inherits from the chapter; if Atlas later needs per-activity dormancy
      (Red Cross local active but its Norsktrening on hold), add a separate
      flag in supply__* and propagate.
    columns:
      - name: chapter_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_chapter'), field: chapter_id}
        description: Composite slug, namespaced by NGO. Stable across refreshes.
      - name: activity_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_activity'), field: activity_id}
        description: Composite slug, e.g. 'redcross-besokstjeneste'. Stable across refreshes.
      - name: ngo_orgnr
        description: Denormalised from dim_chapter for query convenience.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_ngo'), field: orgnr}
      - name: kommune_nr
        description: Denormalised from dim_chapter. NULL for non-local chapters (regional, 
          national).
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config: {severity: warn}
      - name: local_activity_name
        description: >-
          NGO's local display string for the activity at this chapter (e.g. 'Modum Røde Kors Hjelpekorps').
      - name: is_active
        data_tests:
          - not_null
          - accepted_values: {values: [true, false]}
        description: |
          Whether this NGO still offers the activity. False for retired
          activities kept in the catalog so historical
          fact_chapter_activities rows can still resolve activity_id.
      - name: canonical_name
        description: Denormalised from dim_activity for query convenience.
        data_tests: [not_null]
      - name: source_id
        description: "Atlas source identifier — constant 'redcross-branches' for every row, since this fact derives from that one source."
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
        description: When the row was last loaded from the upstream supply staging model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chapter_id, activity_id]

  - name: chapter_kommune_coverage
    description: |
      Link table between dim_chapter (regional-level rows) and dim_kommune,
      declaring which kommuner each regional chapter serves. Local-level
      chapters don't need rows here — their kommune_nr lives on dim_chapter
      directly. Built by UNIONing per-NGO supply__<ngo>_chapter_kommune_coverage
      staging models. See INVESTIGATE-multi-ngo-supply-model-extensions §C.
    columns:
      - name: chapter_id
        description: Composite slug, namespaced by NGO. Stable across refreshes.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_chapter')
              field: chapter_id
      - name: kommune_nr
        description: >-
          Resolved via dim_postnummer. NULL for branches that span multiple kommuner (regional, national).
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config: {severity: warn}
      - name: source
        description: |
          How this (chapter, kommune) link was established.
          'declared' = the NGO publishes the kommune list directly for
          this regional chapter; 'inferred' = derived by Atlas from
          child-chapter coverage (e.g. union of local kommuner under
          the regional parent).
        data_tests:
          - not_null
          - accepted_values:
              values: [declared, inferred]
      - name: updated_at
        description: When the row was last loaded from the upstream supply staging model.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chapter_id, kommune_nr]
