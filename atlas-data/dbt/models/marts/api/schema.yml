version: 2
models:
  - name: mart_indicator_summary
    meta:
      title: "Indicator coverage summary"
    description: |
      One row per (source_id, contents_code) summarising the latest-year
      coverage and value range for every indicator in
      fact_kommune_indicators. This is the backing dataset for the data
      explorer index page (atlas-frontend /data) and is the equivalent of
      the listIndicators() inline query that PostgREST projects as
      /mart_indicator_summary on the public API.

      Query shape: latest-year-per-indicator + group-by + value/null counts
      filtered to active kommuner only. Inactive kommuner (historical
      codes retained by upstream) are excluded from the counts so consumers
      see "how many of today's kommuner have data?" not "how many rows
      exist?".

      Refreshed nightly together with fact_kommune_indicators. The
      upstream_updated column carries the most recent raw load timestamp
      across the rows that contributed to this summary, so freshness can
      be inspected per indicator without joining to raw.* sources.
    columns:
      - name: source_id
        description: |
          Atlas source identifier, e.g. 'ssb-08764'. Joins back to
          fact_kommune_indicators.source_id and to the source declarations
          in indicators/sources.yml.
        data_tests:
          - not_null
          # ✅ STEP TWO IS DONE: the real foreign key is registered, by
          # macros/register_source_id_fk.sql as a post-hook on this model
          # AND on mart_meta_sources. PostgREST derives resource embedding
          # from pg_constraint, so until 2026-09-20
          # ?select=...,meta_sources(license) returned PGRST200 and the
          # schema map a consumer renders had no edges (urb-agents #1252).
          # Terje authorised it with the build-failure risk in front of him.
          #
          # ⚠️ THIS TEST IS NOT REDUNDANT NOW. The constraint is dropped by
          # an ordinary rebuild — dbt renames the old table aside and drops
          # it cascade — and the macro deliberately WARNS rather than
          # failing the transform when it cannot be re-created. So a
          # referential violation shows up here, loudly, in transform_checks,
          # while the public API keeps serving. The FK's own presence is
          # checked separately by the embedding_fk_is_registered asset
          # check, because "warned and continued" and "never ran" look the
          # same from outside.
          - relationships:
              to: ref('mart_meta_sources')
              field: source_id
      - name: contents_code
        description: |
          Source-specific ContentsCode verbatim from upstream (e.g.
          'EUskala60', 'Folkemengde'). Combined with source_id forms the
          natural key of this view.
        data_tests:
          - not_null
      - name: contents_label
        description: |
          Human-readable label for contents_code, verbatim from upstream.
          NULL only if every contributing row had a NULL label (rare).
      - name: upstream_title
        description: |
          What this series is ABOUT, from the source catalogue. The
          subject was previously unreachable from this view — a
          consumer used 8 of 195 series and missed the ones matching
          its own question, because `contents_label` describes the
          UNIT ("Andel (prosent)") and the subject lived only in an
          opaque slug (urb-agents #1250, #1252). Joined from
          mart_meta_sources; NULL only if a source is absent from the
          catalogue, which `relationships` below asserts cannot happen.
      - name: publisher
        description: |
          Who publishes the upstream series (SSB, FHI, Bufdir, Brreg).
          Joined from mart_meta_sources.
      - name: eu_theme
        description: |
          EU high-value-dataset theme. Populated for all 44 sources —
          filter on it to ask "what does Atlas have about X?", which is
          the question this view could not previously answer.
      - name: tags
        description: |
          Topic vocabulary from the source manifest, e.g.
          ['provider:brreg', 'topic:ngo-supply']. Joined from
          mart_meta_sources.

          🔴 QUOTE THE VALUE. A tag contains a colon, and unquoted it is
          rejected: `?tags=cs.{topic:ngo-supply}` returns 22P02 malformed
          array literal. The working form is
          `?tags=cs.{"topic:ngo-supply"}`.

          ⚠️ The unquoted spelling was published HERE, in this description,
          until 2026-09-20 — so a consumer following the documentation got
          an error and had to work the quoting out for itself (urb-agents
          #1281). Same class as the `personer` description: the contract
          said something a consumer acted on and it was wrong.
      - name: latest_year
        description: |
          Most recent calendar year for which this (source_id,
          contents_code) has a VALUE in fact_kommune_indicators. The
          coverage and value-range columns below are computed against
          this year only.

          🔴 THIS CHANGED ON 2026-09-21 AND THE OLD BEHAVIOUR WAS WRONG.
          It was "has any rows", which pointed at years the publisher had
          not released yet: upstream ships the full grid, so a row exists
          with a NULL value. Seven of `ssb-06913`'s eight series resolved
          to 2026 with `kommuner_with_value` 0 and both value bounds null
          — a live series whose summary read as empty (urb-agents #1351).

          ⚠️ IT IS THE LATEST YEAR AN ACTIVE, NON-SENTINEL KOMMUNE HAS A
          VALUE — the same subject the coverage below is counted over. A
          first version filtered only on `value is not null` and was
          defeated by SSB zero-filling retired kommune codes: 0101 Halden
          (-2019) and 0801 Kragerø (-1959) carry a literal 0 for every
          year forever, so the year looked populated while every active
          kommune was null there. `latest_year` and `kommuners_with_value`
          disagreed about which rows count (urb-agents #1354).

          ⚠️ A series with no value in ANY year keeps the newest year it
          has rows for, rather than going null. Disappearing from the
          catalogue is the worse failure: "0 of 357" invites a question,
          an absent row does not.

          ⚠️ READ IT WITH `latest_year_window_years`. For a windowed
          source this is the FIRST year of the window, not the year of
          the data, and rendering it alone prints a date that is wrong by
          up to four years.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2040
      - name: latest_year_window_years
        description: |
          How many calendar years `latest_year` covers: 1 for an annual
          series, 5 for `fhi-selvmord`, 3 for `fhi-mobbing`. The span is
          `latest_year` to `latest_year + latest_year_window_years - 1`.

          🔴 WHY IT IS A COLUMN AND NOT A SENTENCE. The window was already
          stated in prose in this catalogue. On 2026-09-21 it was misread
          twice in one day in opposite directions — a reviewer called a
          live `fhi-selvmord` series six years stale, and a consumer
          shipped the caption «Mobbetallene er fra 2022» for a 2022-2024
          window. The consumer's proposed workaround, matching `/1-year/i`
          against the description, false-positives on `fhi-kpr-1aar`,
          whose title contains "KPR 1-year" and which is annual anyway
          (urb-agents #1331).

          🔵 CROSS-CHECK IT AGAINST `meta_dimensions`, WHICH SAID ALL THIS
          FIRST. `?code=in.(AAR,Tid)&select=source_id,meaning,value_format`
          carries the upstream's own description of its time dimension. On
          2026-09-21 a consumer, ops-dev and this agent each derived the
          windowing independently while that relation was already published
          and already said it — and the claim "exactly two FHI sources are
          windowed", used as evidence, was wrong; the catalogue named three
          (urb-agents #1333).

          ⚠️ IT IS A `max()` OVER THE KOMMUNER AT `latest_year`, because
          this view's grain is one row per (source, contents_code) and the
          window lives on the fact row. That is only honest if the window
          is uniform across kommuner within an indicator-year, which is
          asserted by the singular test
          `window_is_uniform_within_an_indicator_year`. If that test ever
          fails, this column is lossy and the failure is the warning.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 10
      - name: kommuner_with_value
        description: |
          Count of active kommuner (kommune_is_active = true) that have a
          non-NULL value for this indicator at latest_year. The headline
          coverage number on the data explorer.
        data_tests:
          - not_null
      - name: kommuner_with_null
        description: |
          🔴 FOR AN `fhi-*` SOURCE THIS IS SUPPRESSION, NOT ABSENCE, AND THE
          TWO LEAD TO OPPOSITE CONCLUSIONS IN A NEED INDEX.

          FHI hides small numbers by policy. Quoted from FHI's own table
          metadata (table 377, read 2026-09-22):

            "Statistikk basert på færre enn 6 tilfeller skjules av
             personvernhensyn... Dersom mer enn 20 prosent av tallene i en
             tidsserie er skjult av personvernhensyn, skjules hele
             tidsserien for ikke å skape et skjevt inntrykk av situasjonen
             i kommunen."

          So FHI hides a cell under ~6 cases, and hides the WHOLE SERIES
          when more than 20% of it is hidden — explicitly to avoid giving a
          skewed impression of that kommune. ⚠️ A consumer that reads the
          resulting gap as "no need here" is producing exactly the skew the
          suppression exists to prevent, and doing it in the direction that
          moves help away from the smallest places.

          🔵 MEASURED, and the shape is unambiguous (urb-agents #1369,
          #1379): 105 kommuner are missing from 10 or more `fhi-*` series,
          median population 1,452, monotonic in population. `1151 Utsira`,
          219 people, is missing from 15. EVERY kommune is absent from at
          least three series — so a kommune appearing here is ordinary and
          is not a defect to report.

          ⚠️ The thresholds above are table 377's; the policy is FHI-wide
          but each table states its own. Read the source's metadata rather
          than assuming 6.

          🔵 It is NOT suppression for SSB sources. SSB zero-fills instead —
          a dissolved kommune carries a literal 0 forever — which is a
          different failure and was the cause of the `latest_year` defect
          fixed in a657f4f. Two publishers, two conventions, and the same
          column has to be read differently for each.

          Count of active kommuner that have a row at latest_year but
          value IS NULL (i.e. upstream suppressed the cell). Inactive
          kommuner are not counted.
        data_tests:
          - not_null
      - name: min_value
        description: |
          Minimum non-NULL value across all rows at latest_year, regardless
          of whether the kommune is active. NULL if no row had a value.
      - name: max_value
        description: |
          Maximum non-NULL value across all rows at latest_year, regardless
          of whether the kommune is active. NULL if no row had a value.
      - name: upstream_updated
        description: |
          Most recent fact_kommune_indicators.updated_at across the rows
          that contributed to this summary. Useful for staleness checks
          per indicator without joining to raw.*.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source_id, contents_code]

  - name: mart_indicator_latest_values
    meta:
      title: "Latest indicator values per kommune"
    description: |
      One row per (source_id, contents_code, kommune_nr) at each
      indicator's latest_year, restricted to active kommuner. Backs the
      data explorer's per-indicator detail page (atlas-frontend
      /data/[source_id]/[contents_code]) and is the equivalent of the
      loadIndicatorValues() inline query.

      🔴 ROW COUNT IS NOT COVERAGE. A row exists for every active kommune
      the source publishes at all, INCLUDING those where `value` is null.
      So a series returns ~357 rows whether 357 kommuner have a number or
      66 do, and counting rows overstates coverage by up to five times.

      ⚠️ This has always been true and became dangerous on 2026-09-21,
      when nine Ungdata sources published at 18-43 % kommune coverage
      against SSB register sources at nearly 100 %. `fhi-hasj` returns
      357 rows carrying 66 values.

      ✅ `indicator_summary.kommuner_with_value` is the live count and the
      only thing to trust. It is not restated here on purpose — a number
      copied into a description goes stale, which is the defect that made
      `fhi-depresjon` advertise fourteen years of data it never held.

      PostgREST consumers filter via
      ?source_id=eq.X&contents_code=eq.Y. The full table is the
      cross-product of every indicator with every active kommune that
      has a row at latest_year, so the unfiltered row count is large
      (~360 active kommuner × ~70 indicators in v1).

      Inactive kommuner (kommune_is_active = false) are excluded so the
      output reflects today's kommune set, not historical codes that
      upstream still emits.
    columns:
      - name: source_id
        description: |
          Atlas source identifier, e.g. 'ssb-08764'. Joins back to
          fact_kommune_indicators.source_id.
        data_tests:
          - not_null
      - name: contents_code
        description: |
          Source-specific ContentsCode verbatim from upstream (e.g.
          'EUskala60', 'Folkemengde'). Combined with source_id and
          kommune_nr forms the natural key of this view.
        data_tests:
          - not_null
      - name: kommune_nr
        description: |
          4-digit zero-padded kommune code. FK to dim_kommune; only
          active kommuner are included.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Joined from fact_kommune_indicators (originally from dim_kommune).
        data_tests:
          - not_null
      - name: fylke_name
        description: |
          Joined from fact_kommune_indicators (originally from
          dim_fylke). NULL when the kommune's fylke_nr isn't present in
          dim_fylke (rare — happens for codes like Svalbard 21xx).
      - name: value
        description: |
          Numeric value at latest_year. Unit depends on (source_id,
          contents_code) — see the source's README. NULL when upstream
          suppressed the cell.
      - name: status
        description: |
          SSB suppression marker (e.g. ':' for 'not available'). NULL
          when value is present.
      - name: year
        description: |
          The latest year for this (source_id, contents_code). Repeats
          across all kommuner for a given indicator — kept on the row so
          PostgREST consumers can read it without a separate join.

          ⚠️ For a windowed source this is the FIRST year of the window.
          Render it with `window_years`, never alone.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2040
      - name: window_years
        description: |
          How many calendar years `year` covers, carried from
          fact_kommune_indicators. 1 for an annual series. The span is
          `year` to `year + window_years - 1` inclusive. See
          `mart_indicator_summary.latest_year_window_years` for why this
          is a column rather than prose.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 10
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source_id, contents_code, kommune_nr]

  - name: mart_indicator_missing_kommuner
    meta:
      title: "Indicator coverage gaps per kommune"
    description: |
      🔴 A ROW HERE IS NOT EVIDENCE OF LOW NEED. For `fhi-*` sources it is
      usually FHI's disclosure suppression: it hides numbers based on fewer
      than ~6 cases, and hides a whole series when more than 20% of it is
      hidden, "for ikke å skape et skjevt inntrykk av situasjonen i
      kommunen" — to avoid a skewed impression of that kommune.

      ⚠️ Measured: 105 kommuner are missing from 10+ `fhi-*` series, median
      population 1,452, monotonic in population, and EVERY kommune is absent
      from at least three. Treating absence as zero in a ranked index
      inverts the signal for the smallest kommuner (urb-agents #1379). See
      `indicator_summary.kommuners_with_null`.

      One row per (source_id, contents_code, kommune_nr) for every
      active kommune that has *no* non-NULL value at the indicator's
      latest_year. The "coverage gap" sidebar on the data explorer
      detail page; equivalent to the listMissingKommuner() inline query.

      PostgREST consumers filter via
      ?source_id=eq.X&contents_code=eq.Y. Membership semantics: a
      kommune is considered "missing" if it either has no row at
      latest_year, or has a row with value IS NULL. Status markers (':',
      'X') do not count as a value.

      The full table is the cross-product of every indicator with every
      active kommune that lacks data. Most cells are present, so the
      unfiltered row count is the per-indicator gap-list aggregated
      across all indicators.
    columns:
      - name: source_id
        description: Atlas source identifier, e.g. 'ssb-08764'.
        data_tests:
          - not_null
      - name: contents_code
        description: |
          Source-specific ContentsCode verbatim from upstream (e.g.
          'EUskala60', 'Folkemengde').
        data_tests:
          - not_null
      - name: kommune_nr
        description: |
          4-digit zero-padded kommune code. FK to dim_kommune; only
          active kommuner with no value at latest_year are listed.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Joined from dim_kommune.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source_id, contents_code, kommune_nr]

  - name: mart_coverage_gap_barnefattigdom
    meta:
      title: "Child-poverty coverage gap (kommune)"
    description: |
      One row per active kommune for the latest year of SSB 08764 child
      poverty data, combining the EUskala60 share (% of children in
      low-income households) with the Personer count (number of
      children). Backs the barnefattigdom map page (atlas-frontend
      /coverage-gap/barnefattigdom).

      First member of the mart_coverage_gap_<topic> family. Future
      coverage-gap maps follow the same shape: latest year per kommune,
      one row per kommune, value(s) pivoted out of contents_code into
      named columns. PostgREST projects this view as a single endpoint;
      consumers don't filter, they read the whole map dataset in one
      request.

      Inactive kommuner are excluded so the map renders today's
      kommune set. NULL values are kept in place — Map.tsx renders
      them as "no data".
    columns:
      - name: kommune_nr
        description: |
          4-digit zero-padded kommune code. FK to dim_kommune; only
          active kommuner are included. Unique within this view.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Joined from fact_kommune_indicators (originally from dim_kommune).
        data_tests:
          - not_null
      - name: fylke_name
        description: |
          Joined from fact_kommune_indicators (originally from
          dim_fylke). NULL for kommuner whose fylke_nr isn't in
          dim_fylke (rare — Svalbard 21xx).
      - name: year
        description: |
          The latest year for ssb-08764/EUskala60. Same value across all
          rows; carried on each row so the consumer reads it without a
          separate query.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2040
      - name: value_pct
        description: |
          EU-skala 60 % share — the percent of children under 18 in
          low-income households (defined as < 60 % of national median
          equivalised income). NULL when upstream suppressed the cell.
      - name: personer
        description: |
          DENOMINATOR, NOT A COUNT OF POOR CHILDREN. Every person under
          18 in the kommune that year — SSB 08764 ContentsCode
          'Personer', whose own metadata reads "Persons under 18 years
          of age", unit persons.

          The number of children in low-income households is
          personer * value_pct / 100. It is not published as a column;
          derive it.

          This description said "number of children under 18 in
          low-income households" until 2026-09-19, which is false by
          roughly ninefold and about child poverty. A consumer building
          on the published API summed the column, got 1,097,107 against
          a national under-18 population of about 1.1 million, and
          caught it (urb-agents #1250, #1251). Derived correctly the
          same sum is 124,670, near the ~11 % national rate.

          Nothing in the data contradicted the wrong reading: the
          column is plausible, non-null and internally consistent, and
          only summing it and recognising the total gives it away. The
          view description two entries above was right the whole time,
          so the contract disagreed with itself.

          NULL when upstream suppressed the cell.
      - name: barn_i_lavinntekt
        description: |
          Children under 18 in low-income households — the number most
          consumers come here for. DERIVED as
          personer * value_pct / 100, rounded.

          SSB does not publish this. Table 08764 carries the total and
          the shares only, so every consumer has to compute it, and one
          got it wrong because the `personer` description claimed to be
          this column already (urb-agents #1250, #1251). Added on
          Terje's authorisation rather than renaming `personer`, so the
          consumer that found the defect keeps working.

          ESTIMATE, NOT A COUNT. value_pct is published to one decimal,
          so the true value lies within ±0.05 % of personer: about ±65
          children for Oslo, ±4 for a kommune of 7 000. Do not present
          it as SSB's own figure.

          NULL when either input was suppressed upstream.
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "<= personer"
              config:
                where: "barn_i_lavinntekt is not null and personer is not null"
  - name: mart_ngo_index
    meta:
      title: "NGO registry"
    description: |
      🔴 WHAT THIS RELATION DELIBERATELY DOES NOT CARRY. The demo consumer
      matches an organisation's local units in Brønnøysundregistrene by a
      name SUBSTRING it maintains itself, and it asked Atlas explicitly NOT
      to publish that (urb-agents #1387):

        "That is a heuristic we invented and are answerable for;
         ngo_index has no such column and should not."

      🔵 The split it drew, and it is the right one: the ROSTER is ours —
      orgnr, canonical name, primary_focus, tier — and the MATCHING RULE is
      theirs. A published pattern column would make Atlas answerable for a
      guess it did not make, and would make one consumer's heuristic look
      like a property of the organisation.

      ⚠️ THIS NOTE EXISTS BECAUSE THE OBVIOUS RESPONSE IS THE WRONG ONE.
      That consumer has now deleted three hardcoded copies of Atlas data in
      two days, and each time the right fix was to publish what it was
      copying — served_as for the unserved list, window_years for the
      windowed-years map. The reflex "it keeps a copy, so publish it" is
      correct twice and wrong here. It keeps this copy on purpose.

      One row per NGO in dim_ngo with chapter_count and has_supply
      decorations. Backs the NGO landing page (atlas-frontend /ngo) and
      is equivalent to the listNgos() inline query.

      chapter_count counts only active chapters (dim_chapter.is_active),
      so a defunct NGO sits at 0 even if its historical chapters are
      retained. has_supply is the convenience boolean (chapter_count > 0).
      The full table is small (~11 rows in v1, growing as new NGOs
      land), so PostgREST consumers typically read all of it.
    columns:
      - name: orgnr
        description: |
          9-digit Brreg organisasjonsnummer (text — leading zeros are
          preserved). Natural key for this view.
        data_tests:
          - not_null
          - unique
      - name: slug
        description: kebab-case URL-friendly identifier (e.g. 'redcross', 'kirkens-bymisjon').
        data_tests:
          - not_null
          - unique
      - name: name
        description: Legal name from Brreg.
        data_tests:
          - not_null
      - name: brand_name
        description: |
          Common brand name when distinct from legal name (e.g.
          'Sanitetskvinnene' vs N.K.S.). NULL when the brand equals
          the legal name.
      - name: website_url
        description: NGO's primary website. Used as the outbound link from the index page.
        data_tests:
          - not_null
      - name: tier
        description: |
          Structural-fit tier (A / B / C) from
          docs/research/ngo-landscape.md. v1 includes Tier A only.
        data_tests:
          - not_null
      # ⚠️ CORRECTED 2026-09-13 (urb-agents #815). This description previously
      # read "Values: 'distrikt+local' (Red Cross), 'flat' (single-tier), 'none'
      # (no chapters)". None of those three are accepted values of the column —
      # seeds/schema.yml has constrained it to the four below since the seed was
      # written. PostgREST publishes these descriptions as the OpenAPI field
      # docs, so api_v1.ngo_index documented three values the data can never
      # hold. The proof it was SERVED rather than merely stored was
      # website/static/openapi.json, a snapshot captured from the live API which
      # carried the wrong text. ⚠️ That file was DELETED on 2026-09-23 when
      # Scalar switched to reading the live spec (urb-agents #1414); the evidence
      # is in git history at atlas#430^, not in the working tree.
      #
      # 🔴 The correction lives in this comment and NOT in the description, on
      # purpose. A description is the published contract — PostgREST serves it to
      # every consumer — and a consumer needs the four values, not the history of
      # an error they never saw. The audit trail belongs in the repo, which is
      # what this comment is. An earlier draft of this very fix put the note in
      # the description and would have published it.
      - name: chapter_data_shape
        description: |
          How this NGO's per-chapter activity data is shaped — drives
          which ingest pattern it uses. Values: 'api_canonical',
          'cms_bins', 'programme_only', 'no_structure'.
        data_tests:
          - not_null
      - name: has_chapters
        description: |
          Whether this NGO DECLARES that it has chapters — an editorial fact
          from dim_ngo, recorded when the organisation is curated.

          Not the same question as has_supply, which is chapter_count > 0 and
          therefore an ingest OUTCOME: does Atlas hold chapter rows for this
          organisation yet. They agree today only because all curated NGOs
          declare has_chapters true and all have been ingested. The first NGO
          curated before its chapters land makes them disagree, and a consumer
          filtering on the wrong one loses it without an error.
      - name: primary_focus
        description: One-line description of the NGO's main mission area.
      - name: icnpo_code_1
        description: |
          ICNPO classification code (primary). See ref_icnpo. NULL when
          unclassified.
      - name: icnpo_code_2
        description: ICNPO classification code (secondary). NULL when not used.
      - name: icnpo_code_3
        description: ICNPO classification code (tertiary). NULL when not used.
      - name: chapter_count
        description: |
          Count of active chapters for this NGO (filtered by
          dim_chapter.is_active = true). Zero if the NGO has no chapters
          or all chapters are dormant.

          🔴 AND A THIRD CASE, WHICH IS THE ONE TRUE TODAY: zero also
          means ATLAS HOLDS NO CHAPTER DATA. All eleven organisations
          currently report `has_chapters = true` with `chapter_count = 0`,
          and a consumer reading the pair gets a contradiction
          (urb-agents #1388).

          🔵 The two columns answer different questions and both answers
          are correct. `has_chapters` is a property of the ORGANISATION —
          it is structured in local chapters — and comes from the roster.
          `chapter_count` is a property of ATLAS — how many it holds — and
          comes from `dim_chapter`, which is empty until the Red Cross
          data arrives.

          ⚠️ So `has_chapters = true, chapter_count = 0` reads "this
          organisation has chapters and Atlas has none of them", not "its
          chapters are all dormant". See `activity_catalog`,
          `distrikt_summary` and `kommune_local_chapters`, which are
          empty for the same reason and say so.

          🔵 Same shape as the FHI suppression note: the data is right and
          the reading is the defect.
        data_tests:
          - not_null
      - name: has_supply
        description: |
          Convenience boolean: chapter_count > 0. True when the NGO has
          at least one active chapter — i.e. it appears on the supply
          side of Atlas.
        data_tests:
          - not_null

  - name: mart_ngo_overview
    meta:
      title: "NGO overview"
    description: |
      One row per NGO in dim_ngo with the six count metrics shown on
      the per-NGO landing page (atlas-frontend /ngo/[slug]).
      Equivalent to the getNgoOverview() inline query, but precomputed
      for all NGOs so PostgREST projects it as a single endpoint
      consumers filter via ?orgnr=eq.X.

      Counts include both active and inactive chapters in the
      level-specific buckets (national/regional/local). kommune_count
      counts distinct kommune_nr only across *active* local chapters,
      matching the original query's behaviour.
    columns:
      - name: orgnr
        description: 9-digit Brreg organisasjonsnummer. Natural key for this view.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_ngo')
              field: orgnr
      - name: chapter_count
        description: Total count of chapters for this NGO across all levels (active + inactive).
        data_tests:
          - not_null
      - name: national_count
        description: Count of chapters at chapter_level = 'national'.
        data_tests:
          - not_null
      - name: regional_count
        description: Count of chapters at chapter_level = 'regional' (e.g. Red Cross distrikt).
        data_tests:
          - not_null
      - name: local_count
        description: Count of chapters at chapter_level = 'local' (the kommune-bound branches).
        data_tests:
          - not_null
      - name: activity_count
        description: |
          Count of distinct activities offered by this NGO (rows in
          dim_activity for this orgnr).
        data_tests:
          - not_null
      - name: kommune_count
        description: |
          Count of distinct kommuner with at least one active local
          chapter for this NGO. The "footprint" metric for coverage-gap
          questions.
        data_tests:
          - not_null

  - name: mart_activity_catalog
    meta:
      title: "Activity catalogue (cross-NGO)"
    description: |
      🔵 EXPECTED EMPTY TODAY, AND THAT IS NOT A DEFECT. Its one row per (NGO, activity), so it is empty until Red Cross activity data is loaded.
      Terje's position, 2026-09-21: the Red Cross data is not coming now, it
      will be there later. The relation is published and answers so a consumer
      can build against its shape before the rows arrive.

      ⚠️ A consumer cannot tell "empty by design" from "broken" without being
      told, and two of these three were asked about on the day someone noticed
      (urb-agents #1351). If this relation is still empty and this note is
      gone, something regressed.

      One row per (NGO, activity) joining dim_activity to the
      service-category seed for the human-readable label, plus a count
      of active chapters offering each activity. Backs the per-NGO
      activity catalogue page (atlas-frontend
      /ngo/[slug]/aktiviteter); equivalent to listActivities().

      The full table is small (~35 rows for Red Cross alone in v1) and
      grows as new NGOs land. PostgREST consumers filter via
      ?ngo_orgnr=eq.X.
    columns:
      - name: activity_id
        description: |
          Composite slug (e.g. 'redcross-besokstjeneste'). Stable across
          refreshes. Unique within this view.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_activity')
              field: activity_id
      - name: ngo_orgnr
        description: 9-digit Brreg organisasjonsnummer of the NGO offering the activity.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_ngo')
              field: orgnr
      - name: canonical_name
        description: Atlas's canonical Norwegian name for the activity.
        data_tests:
          - not_null
      - name: service_category_code
        description: |
          ICNPO-derived service category code (e.g. 'health',
          'social-services'). FK to ref_atlas_service_category.
        data_tests:
          - not_null
      - name: service_category_label_no
        description: |
          Human-readable Norwegian label for service_category_code,
          joined from ref_atlas_service_category.
        data_tests:
          - not_null
      - name: is_active
        description: |
          Whether this activity is still offered by the NGO. Inactive
          activities are kept so historical analysis can still resolve
          activity_id values.
        data_tests:
          - not_null
      - name: chapter_count
        description: |
          Count of distinct active chapters offering this activity. Zero
          when the activity exists in dim_activity but no active chapter
          provides it (rare but possible during transitions).
        data_tests:
          - not_null

  - name: mart_distrikt_summary
    meta:
      title: "Distrikt summary"
    description: |
      🔵 EXPECTED EMPTY TODAY, AND THAT IS NOT A DEFECT. Its grain is Red Cross districts, so it is empty until that data is loaded.
      Terje's position, 2026-09-21: the Red Cross data is not coming now, it
      will be there later. The relation is published and answers so a consumer
      can build against its shape before the rows arrive.

      ⚠️ A consumer cannot tell "empty by design" from "broken" without being
      told, and two of these three were asked about on the day someone noticed
      (urb-agents #1351). If this relation is still empty and this note is
      gone, something regressed.

      One row per regional chapter (Red Cross "distrikt" level, and the
      equivalent regional tier for any other NGO with a hierarchy).
      Each row carries denormalised counts of how many child chapters
      the distrikt has and how many distinct kommuner those children
      cover. Backs atlas-frontend /ngo/[slug]/distrikter and the
      individual /distrikt/[id] pages; equivalent to the listDistrikter()
      inline query.

      Counts come from dim_chapter joined back to itself by
      parent_chapter_id, filtered to active children. PostgREST
      consumers filter via ?ngo_orgnr=eq.X (or ?chapter_id=eq.Y for the
      single-distrikt case).
    columns:
      - name: chapter_id
        description: |
          Composite slug for the regional chapter (e.g.
          'redcross-oslo'). Stable across refreshes. Unique within this
          view.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_chapter')
              field: chapter_id
      - name: name
        description: Display name for the regional chapter (e.g. 'Oslo Røde Kors').
        data_tests:
          - not_null
      - name: kommune_nr
        description: |
          4-digit kommune code where the regional chapter is
          headquartered. NULL for distrikter without a single HQ
          kommune. Note: kommune_coverage_count tells you how many
          *child* kommuner the distrikt covers — that's the operational
          footprint, not where the office sits.
      - name: kommune_name
        description: Joined from dim_kommune. NULL when kommune_nr is NULL.
      - name: ngo_orgnr
        description: 9-digit Brreg organisasjonsnummer of the NGO this distrikt belongs to.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_ngo')
              field: orgnr
      - name: child_count
        description: |
          Count of active local chapters whose parent_chapter_id equals
          this distrikt's chapter_id. The "lokalforeninger" total shown
          in the UI.
        data_tests:
          - not_null
      - name: kommune_coverage_count
        description: |
          Count of distinct kommuner served by this distrikt's active
          children (kommune_nr IS NOT NULL). The operational footprint;
          may be smaller than child_count when multiple children share
          a kommune.
        data_tests:
          - not_null

  - name: mart_kommune_local_chapters
    meta:
      title: "Local NGO chapters per kommune"
    description: |
      🔵 EXPECTED EMPTY TODAY, AND THAT IS NOT A DEFECT. Its one row per local chapter, so it is empty until Red Cross chapter data is loaded.
      Terje's position, 2026-09-21: the Red Cross data is not coming now, it
      will be there later. The relation is published and answers so a consumer
      can build against its shape before the rows arrive.

      ⚠️ A consumer cannot tell "empty by design" from "broken" without being
      told, and two of these three were asked about on the day someone noticed
      (urb-agents #1351). If this relation is still empty and this note is
      gone, something regressed.

      Active local chapters in each kommune, decorated with the NGO
      name/brand and the service-category labels offered. Backs the
      kommune detail page (atlas-frontend /kommuner/[kommune_nr]);
      equivalent to listChaptersInKommune().

      **Important:** this view returns *multiple rows per chapter* —
      one per service category the chapter offers. A chapter that
      provides three service categories appears as three rows for the
      same kommune_nr / chapter_id, with different
      service_category_code values. Consumers that want unique chapters
      should distinct on chapter_id (or aggregate service categories
      into an array client-side).

      GRAIN: one row per (kommune_nr, chapter_id,
      service_category_code), asserted by a test rather than only
      described here. It is neither one row per chapter nor one row per
      chapter-kommune coverage relation — a consumer told us those were
      the two shapes it would guess between (urb-agents #1289).

      PostgREST consumers filter via ?kommune_nr=eq.X. Inactive
      chapters, non-local chapters (regional, national), and chapters
      with NULL kommune_nr are excluded. ⚠️ Excluding regional chapters
      means the kommuner a regional chapter serves do NOT appear here;
      see kommune_nr for why that gap is not closed elsewhere either.
      Svalbard (Longyearbyen Røde Kors) is included even though no 21xx
      code is in dim_kommune — the FK relationships test is
      `warn`-severity to keep this row visible.
    columns:
      - name: kommune_nr
        description: |
          🔴 WHERE THE CHAPTER IS REGISTERED, NOT WHERE IT WORKS. This
          description said "where the local chapter operates" until
          2026-09-20 and that was a stronger claim than the data
          supports: the value is a dim_postnummer lookup on the
          chapter's POSTAL ADDRESS (see supply__redcross_branches).

          ⚠️ So a chapter serving three neighbouring kommuner appears in
          one of them, and a chapter with a PO box in the next kommune
          appears in the wrong one. A consumer asking "is Røde Kors
          here?" gets "is Røde Kors registered here?" — which is the
          same limitation as searching the Enhetsregisteret by name, and
          this relation does not remove it (urb-agents #1289).

          Declared service areas are not modelled for Red Cross at all.
          `marts.chapter_kommune_coverage` holds one row per
          (regional chapter, kommune), but its rows are INFERRED from
          where the regional chapter's local children are registered —
          so it inherits this same defect rather than fixing it, and it
          is not published to api_v1.

          FK to dim_kommune, the primary filter dimension for this view.
          Chapters with NULL kommune_nr are excluded (this isn't "local
          chapters in a kommune" if there's no kommune).

          ⚠️ The relationships test is `warn`-severity because
          Longyearbyen Røde Kors is a real chapter whose Svalbard code
          is not in dim_kommune — SSB Klass 131 contains no 21xx code.
          So this relation is built to publish a Svalbard row that no
          dimension can describe. See urb-agents #700.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config: {severity: warn}
      - name: chapter_id
        description: |
          Composite slug for the local chapter (e.g.
          'redcross-oslo-grunerløkka'). Repeats across rows when the
          chapter offers multiple service categories.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_chapter')
              field: chapter_id
      - name: name
        description: Display name for the local chapter.
        data_tests:
          - not_null
      - name: ngo_orgnr
        description: 9-digit Brreg organisasjonsnummer of the NGO that owns the chapter.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_ngo')
              field: orgnr
      - name: ngo_name
        description: Joined from dim_ngo (legal name).
        data_tests:
          - not_null
      - name: ngo_brand_name
        description: |
          Joined from dim_ngo (brand name when distinct from legal
          name). NULL when the NGO doesn't use a brand alias.
      - name: service_category_code
        description: |
          ICNPO-derived service category code for one of the activities
          this chapter offers. Combined with chapter_id forms the
          natural key of this view (rows are unique on
          (chapter_id, service_category_code)).
        data_tests:
          - not_null
      - name: service_category_label_no
        description: |
          Human-readable Norwegian label for service_category_code,
          joined from ref_atlas_service_category.
        data_tests:
          - not_null
      - name: sort_order
        description: |
          Display order from ref_atlas_service_category. Used by the UI
          to render service categories in a consistent sequence; carry
          on the row so consumers can sort without a separate query.
        data_tests:
          - not_null
    data_tests:
      # 🔵 THE GRAIN, AND IT WAS ALREADY ASSERTED HERE. A consumer asked
      # whether the shape is one row per chapter or one row per
      # chapter-kommune coverage, saying it would otherwise "find out by
      # getting it wrong" (urb-agents #1289). It is neither: one row per
      # (chapter, service category), and a chapter's kommune_nr comes along
      # for the ride because a local chapter has exactly one.
      #
      # ⚠️ I nearly added a second copy of this, keyed on
      # (kommune_nr, chapter_id, service_category_code) — redundant, WEAKER
      # than what is here, and a duplicate YAML key. dbt tolerates those and
      # js-yaml does not, which is how I broke the website generator on main
      # for an hour on 2026-09-19. The website build caught it this time.
      #
      # ⚠️ IT PASSES VACUOUSLY TODAY: the relation holds zero rows until the
      # Red Cross ingest is unblocked (#699). It is here so the first run WITH
      # data is what checks the grain, rather than a consumer.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chapter_id, service_category_code]

  - name: mart_bufdir_indicator_alias
    description: |
      Cross-release alias table for `bufdir-barnefattigdom`
      `indicator_api_id` renumbers. One row per (historical_id,
      canonical_id) mapping consumers join on for cross-time-series
      continuity when Bufdir splits, retires, or renumbers a workbook
      upstream — e.g. the observed `Indikator 9` → `9a` / `9b` split,
      and `Indikator 10` retired without successor.

      Thin republish of the editorial seed `bufdir_indicator_alias` so
      the PLAN-004 generator auto-emits `api_v1.bufdir_indicator_alias`
      (the leading `mart_` is stripped per `models/marts/api/README.md`
      § Naming).

      See `website/docs/ai-developer/plans/active/PLAN-bufdir-surrogate-id-migration.md`
      for design rationale + the maintenance ritual that appends rows
      when a new Bufdir bundle release surfaces additional renumbering.
    columns:
      - name: source_id
        description: |
          Source the alias applies to. Always `bufdir-barnefattigdom`
          today; forward-looking column kept so other ZIP sources can
          adopt the same convention without a schema migration.
        data_tests:
          - not_null
          - accepted_values:
              values: [bufdir-barnefattigdom]
      - name: historical_id
        description: |
          Previous `indicator_api_id` from an earlier bufdir release —
          the id consumers may have cached and now need to bridge to
          the current canonical id. Same shape as
          `indicators__bufdir_barnefattigdom.indicator_api_id`
          (`bf_zip_ind_<N>`).
        data_tests:
          - not_null
      - name: canonical_id
        description: |
          Current `indicator_api_id`, or NULL when the historical
          indicator was retired without a successor. NULL is meaningful:
          consumers treat such rows as terminating series rather than
          orphans.
      - name: note
        description: |
          Editorial explanation of the renumbering event — why the
          historical id maps to this canonical id, or why no successor
          exists. One sentence; read by humans, not parsers.
        data_tests:
          - not_null

  - name: mart_atlas_inventory
    description: |
      What Atlas publishes, one row per queryable endpoint: how many records it
      serves, when its data last arrived, and where those rows came from.

      Asked for by Røde Kors — "validate that all datasets that are ingested has
      an endpoint and it can be queried … count the number of records each
      endpoint has and update the last time it ingested data."

      ⚠️ THE GRAIN IS PER ENDPOINT, NOT PER SOURCE. meta_sources answers "what
      did Atlas ingest"; this answers "what can I query, and is there anything
      in it". One source can feed several endpoints and one endpoint can draw on
      several sources, so the two row counts are not comparable and summing
      sources will not reproduce an endpoint's count.

      ⚠️ atlas_inventory does not list ITSELF. It is built from the same seed it
      reports on, so counting itself would be circular and the number would be
      whatever the table held mid-build. 19 endpoints are listed; 20 are
      published.
    columns:
      - name: endpoint
        description: |
          The api_v1 relation name, exactly as it appears in the URL path —
          `GET /indicator_latest_values`. Unique.
        tests: [unique, not_null]
      - name: row_count
        description: |
          Records the endpoint serves, counted at transform time with an
          unfiltered `count(*)`.

          ⚠️ This is the whole relation, not a filtered view of it. A source
          contributing to a multi-source endpoint is not visible here — use
          meta_sources.served_as to see which endpoints carry a given source.
        tests: [not_null]
      - name: is_empty
        description: |
          True when row_count is 0. An endpoint can be published, correct and
          empty — activity_catalog, distrikt_summary and kommune_local_chapters
          all are, because redcross-branches is on hold. Empty is a state, not a
          fault, and is reported rather than hidden.
        tests: [not_null]
      - name: origin
        description: |
          Where the served rows come from.

            ingest              at least one contributing source has a
                                successful ingest run behind it
            seed                no contributing source; the rows are a
                                committed CSV in the repo
            declared_no_ingest  a source is declared in lineage but has never
                                run successfully — the rows, if any, came from
                                somewhere else
            catalogue           meta_* relations, which describe Atlas itself

          ⚠️ 'editorial' is NOT yet distinguished from 'seed'.
          bufdir_indicator_alias carries hand-written judgements about which
          successor indicator is closer, served beside republished NLOD
          statistics with nothing marking the difference. That distinction needs
          a human decision about what Atlas asserts; the column exists so the
          value can be added without a schema change.
      - name: contributing_sources
        description: |
          Source ids feeding this endpoint, from the dbt lineage graph.

          🔴 THIS IS LINEAGE, NOT PROVENANCE. It states which sources the models
          READ, not where the rows currently served came from. ngo_index declares
          redcross-branches and serves 11 rows from a seed, because
          redcross-branches has never run. Read it with `origin`, never alone.
        tests: [not_null]
      - name: last_run_at
        description: |
          The last ingest attempt for any contributing source, success or
          failure.

          🔴 NOT THE SAME AS last_succeeded_at, AND THAT GAP IS THE POINT.
          meta_sources filters every freshness field to successful runs, so a
          source failing for nine days reports its last success and looks
          healthy — fhi-innvandrere did exactly that, 14 to 22 September. Compare
          the two columns; a wide gap means something has been failing quietly.
      - name: last_succeeded_at
        description: |
          The last ingest attempt that completed with exit code 0, for any
          contributing source. Null when nothing has ever succeeded.
      - name: last_status
        description: |
          `ok` or `fail` — whether the most recent run of each contributing
          source succeeded.

          ⚠️ `fail` if ANY contributing source's latest run failed. An endpoint
          is only as fresh as its worst input, and reporting `ok` because four
          of five sources are healthy would hide the one that is not.
      - name: runs_total
        description: |
          Ingest attempts for the contributing sources, successes AND failures.

          ⚠️ Deliberately NOT called total_runs. meta_sources.total_runs already
          means successes-only in a published relation, and one word with two
          meanings across two endpoints is a defect waiting to be quoted.
        tests: [not_null]
      - name: runs_succeeded
        description: |
          Ingest attempts that completed with exit code 0. `runs_total -
          runs_succeeded` is the number of failures.
        tests: [not_null]

  - name: mart_meta_sources
    description: |
      Per-source catalogue row — one per ingest source in
      `_sources_manifest`, joined to `raw.ingest_runs` aggregates so
      consumers see freshness alongside the static metadata. Wraps to
      `api_v1.meta_sources` and backs `/data/sources` in the customer
      frontend (PLAN-007 phase 4).

      🔴 THIS RELATION DESCRIBES A SOURCE, NOT ITS COLUMNS. For what an
      upstream dimension MEANS — what `AAR` is, whether a code is a
      kommune, whether a year is a single year or a window — read
      `meta_dimensions`, one row per source × dimension with the
      upstream's own words and the value format.

      ⚠️ THIS POINTER EXISTS BECAUSE ITS ABSENCE COST A DAY. On
      2026-09-21 a consumer read all 21 descriptions here, concluded
      "exactly two sources use multi-year windows", and shipped a wrong
      year on a front page. `meta_dimensions` said `"3-year rolling
      cohort"` for a third the whole time. Reading every row of this
      relation is thorough and structurally incapable of answering a
      question about a dimension (urb-agents #1335).

      Tags column is a Postgres `text[]` carrying the four declared
      namespaces (`provider:`, `topic:`, `geo:`, `cadence:`) plus the
      `eu_theme:` namespace. The customer frontend renders each as a
      filter pill; PostgREST consumers filter via `?tags=cs.{"provider:ssb"}`
      — the quotes are required, because the value contains a colon.

      `last_ingested_at` and `last_upstream_update_at` come from
      `raw.ingest_runs` aggregated over successful (`exit_code = 0`)
      runs. Sources whose ingest module hasn't yet captured the
      upstream's "updated" field leave `last_upstream_update_at` NULL —
      that's the design (`raw.ingest_runs.upstream_updated_at` is
      nullable per migration 028).

      `downstream_model_count` is the number of distinct dbt models
      that derive from this source via the `lineage` seed (Phase 3.3).
      0 for sources whose data hasn't yet been wired into a mart.
    columns:
      - name: source_id
        description: Atlas catalogue id; primary key. Matches `_sources_manifest.source_id`.
        data_tests:
          - not_null
          - unique
      - name: upstream_id
        description: Upstream's own identifier (SSB table number, FHI dataset slug, etc.).
        data_tests: [not_null]
      - name: upstream_url
        description: Canonical link to the data on the upstream's site (often the API endpoint).
        data_tests: [not_null]
      - name: upstream_landing_page
        description: |
          Human-browsable web page describing the dataset (DCAT-AP `dcat:landingPage`).
          Empty when `upstream_url` is already browsable; clients fall back to that.
      - name: upstream_title
        description: Source's authoritative title at the upstream (usually Norwegian).
        data_tests: [not_null]
      - name: description
        description: One-paragraph framing for the customer-facing catalogue.
        data_tests: [not_null]
      - name: publisher
        description: Institution that publishes the data.
        data_tests: [not_null]
      - name: license
        description: License token (e.g. `NLOD`); see `license_url` for terms.
        data_tests: [not_null]
      - name: license_url
        description: URL of the license terms.
        data_tests: [not_null]
      - name: periodicity
        description: |
          Update cadence as ISO 8601 (`P1Y` / `P3M` / `P1M` / `P1D`)
          or `irregular`. More precise than the `cadence:` tag.
        data_tests: [not_null]
      - name: eu_theme
        description: |
          EU Publications Office Data Theme code (one of 13: `AGRI`, `ECON`,
          `EDUC`, `ENER`, `ENVI`, `GOVE`, `HEAL`, `INTR`, `JUST`, `REGI`,
          `SOCI`, `TECH`, `TRAN`). Aligns with Felles datakatalog / DCAT-AP.
        data_tests:
          - not_null
          - relationships:
              to: ref('eu_data_theme')
              field: code
      - name: attribution
        description: |
          Citation string for academic / legal compliance (e.g.
          "Kilde: Statistisk sentralbyrå, tabell 08764").
        data_tests: [not_null]
      - name: tags
        description: |
          `text[]` of namespaced tags: `provider:<X>`, `topic:<X>`,
          `geo:<X>`, `cadence:<X>`, `eu_theme:<X>`. Filter via PostgREST's
          array-contains operator, QUOTING the value because it contains a
          colon: `?tags=cs.{"topic:ngo-supply"}`. Unquoted it returns 22P02
          malformed array literal. Always 5 entries (one per declared
          namespace).
        data_tests: [not_null]
      - name: last_ingested_at
        description: |
          `MAX(finished_at)` from `raw.ingest_runs` filtered to
          successful runs (`exit_code = 0`). NULL until the source has
          at least one successful run on the current cluster.
          ⚠️ AS OF THE LAST TRANSFORM, NOT LIVE. mart_meta_sources is materialized as a TABLE,
          so this is a snapshot taken when transform_and_publish last ran. An ingest that
          succeeded since then is invisible here until the next one. Do not poll this field to
          decide whether an ingest has completed — it can lag by hours and reads as though it
          were current.
      - name: last_upstream_update_at
        description: |
          `MAX(upstream_updated_at)` from successful ingest runs.
          NULL when the source hasn't run yet OR its ingest module
          doesn't capture the upstream's "updated" field (Red Cross
          web scrape, Brreg per-entity fetch).
          ⚠️ AS OF THE LAST TRANSFORM, NOT LIVE. mart_meta_sources is materialized as a TABLE,
          so this is a snapshot taken when transform_and_publish last ran. An ingest that
          succeeded since then is invisible here until the next one. Do not poll this field to
          decide whether an ingest has completed — it can lag by hours and reads as though it
          were current.
      - name: latest_row_count
        description: |
          `rows_parsed` from the most recent successful run. NULL when
          the source has zero successful runs on the current cluster.
          ⚠️ AS OF THE LAST TRANSFORM, NOT LIVE. mart_meta_sources is materialized as a TABLE,
          so this is a snapshot taken when transform_and_publish last ran. An ingest that
          succeeded since then is invisible here until the next one. Do not poll this field to
          decide whether an ingest has completed — it can lag by hours and reads as though it
          were current.
      - name: total_runs
        description: |
          Count of successful runs ever recorded for this source. 0 when
          no successful run exists.
          ⚠️ AS OF THE LAST TRANSFORM, NOT LIVE. mart_meta_sources is materialized as a TABLE,
          so this is a snapshot taken when transform_and_publish last ran. An ingest that
          succeeded since then is invisible here until the next one. Do not poll this field to
          decide whether an ingest has completed — it can lag by hours and reads as though it
          were current.
        data_tests: [not_null]
      - name: downstream_model_count
        description: |
          Number of distinct downstream dbt models that derive from this
          source via the `lineage` seed. 0 for sources not yet wired
          into a mart.

          🔴 DO NOT READ THIS AS "IS IT SERVED". It counts models, and a
          model is not a consumer surface. A source feeding 357 rows into
          a published relation and a source whose only model reaches
          nothing both report a positive count. Use `served_as`.

          ⚠️ On 2026-09-21 this field produced a statement to a consumer
          that "the eight FHI sources" were served, when it was seven —
          `fhi-innvandrere` has one model, 32,720 rows and no published
          series. Four parties had each built a different partial proxy
          for the question this field looks like it answers, and three
          were wrong the same day (urb-agents #1344).

          🔴 AND THIS NUMBER CAN CHANGE FOR TWO REASONS THAT LOOK
          IDENTICAL. Either a model genuinely shipped, or the lineage it
          is computed from was CORRECTED. A consumer reading it twice
          cannot tell an honest value change from an accuracy fix: on
          2026-09-21 the demo consumer read it morning and evening, got
          9 and 1, and had no way to know which it was seeing
          (urb-agents #1348).

          🔵 `lineage` is generated from the dbt manifest and committed,
          so it can be stale — 103 edges were missing that day, some for
          weeks. `check-lineage-is-current.sh` now fails CI on drift, so
          the accuracy kind of change should stop happening. It cannot
          be detected retroactively in a value you already read.
        data_tests: [not_null]
      - name: served_as
        description: |
          The `api_v1` relations a consumer can actually reach this source
          through, as a Postgres `text[]`. **Empty means nothing published
          depends on it** — that is the gap, and it is the one question
          `downstream_model_count` cannot answer.

          Filter for the gap with `?served_as=eq.{}`, or for a specific
          surface with `?served_as=cs.{indicator_summary}`.

          🔵 NOT A PLAIN LINEAGE JOIN, DELIBERATELY. A relation derived
          from `fact_kommune_indicators` is only claimed when the source
          actually has rows in that fact.

          The case that forced that design: `ssb-06913` fed the fact and
          so reached four published relations on paper while contributing
          ZERO rows to them — its `kommune_nr` regex never matched, so
          783,104 rows were discarded downstream. A structural boolean
          would have called it served and become the fifth wrong proxy.
          It was fixed the same day (urb-agents #1345) and now reports
          those four relations, which is the column working rather than
          the example expiring.

          ⚠️ THE CATALOGUE RELATIONS ARE EXCLUDED. `meta_sources`,
          `meta_endpoints` and `meta_dimensions` hold a row for every
          source by construction, so naming them would be the same value
          on every row. They describe a source; they do not serve it.

          🔴 IT DOES NOT ASSERT THAT ANY NAMED RELATION CONTAINS ROWS.
          For a relation derived from the fact, the source is checked to
          have rows there. For every other relation the claim is
          LINEAGE ONLY — what the source WOULD serve if it had data.

          ⚠️ THE CASE THAT PROVES IT: `redcross-branches` has
          `total_runs` 0 and has never ingested, and it still lists five
          relations, three of which hold zero rows. A source that has
          never run looks served.

          🔵 THE COMPANION CHECK IS ON THIS SAME ROW. Read `served_as`
          with `total_runs` and `latest_row_count`: lineage says what
          could arrive, those say whether anything did.

          ⚠️ AN EARLIER VERSION OF THIS PARAGRAPH SAID THE SAME THING AND
          DID NOT WORK. It read "for non-fact relations this is
          reachability, not volume", naming `brreg_enhet` and
          `dim_kommune` — relations that are never empty, so the warning
          was abstract. ops-dev read it and built a gate on the field
          within the hour (urb-agents #1346). A caveat that names no
          failing case is a caveat nobody applies.

          🔵 Excluding never-ingested sources outright was considered and
          rejected: it would collapse "has never run" into "is not
          modelled", losing the distinction between `redcross-branches`
          (five relations waiting for data) and the sources deferred in
          BACKLOG (no relation at all). Say the word if that trade is
          wrong.

          🔵 Derived from the same artefact the CI gate reads, so the two
          cannot drift: `check-every-source-is-served.sh` and this column
          both resolve the source against the generated `api_v1` relation
          list.

          ⚠️ THE GATE AND THIS COLUMN CAN DISAGREE, AND THAT IS CORRECT.
          The gate is static and cannot see a source that is wired up and
          delivers nothing, so it will report fewer gaps than this column
          does. The gate answers "is it wired"; this answers "does it
          arrive". Neither count is written here on purpose — a number in
          a published description goes stale silently, which is most of
          why this column had to be written at all.
        data_tests: [not_null]
  - name: mart_meta_endpoints
    description: |
      One row per queryable Atlas endpoint, with tags inherited from
      upstream sources via the lineage graph and a `layer:<schema>` tag
      from the schema. Wraps to `api_v1.meta_endpoints` and backs the
      tag-filter catalogue at `/data` in the customer frontend
      (PLAN-007 phase 4).

      🔵 THIS IS THE INDEX, SO IT SAYS WHERE THE OTHER TWO CATALOGUES
      ARE: `meta_sources` for one row per ingest source (licence,
      publisher, freshness), and `meta_dimensions` for one row per
      source × upstream dimension — what each coded column means and
      its value format. A consumer enumerating relations here should
      not have to read 19 descriptions to discover the second one
      (urb-agents #1335).

      Includes endpoints from `api_v1.*`, `marts.*`, and `raw.*`
      (Atlas's three open-by-default schemas; `private_marts.*` stays
      auth-gated and is excluded). Skips internal seeds prefixed `_`
      (`_sources_manifest`, `_sources_dimensions`) and any `dbt_*`
      diagnostic tables.

      Tag inheritance uses the **union** rule: a `mart_*` derived from
      many sources picks up every source's `provider:`, `topic:`,
      `geo:`, `cadence:`, and `eu_theme:` tag, deduped. Filter
      "involves something annual" beats "purely annual" — see PLAN-007
      phase 3.2 for the design rationale.
    columns:
      - name: endpoint
        description: |
          Schema-qualified table/view identifier (`<schema>.<table>`).
          Primary key.
        data_tests:
          - not_null
          - unique
      - name: schema_name
        description: One of `api_v1`, `marts`, `raw`.
        data_tests:
          - not_null
          - accepted_values:
              values: [api_v1, marts, raw]
      - name: table_name
        description: Bare table/view name without schema qualification.
        data_tests: [not_null]
      - name: tags
        description: |
          `text[]` carrying the layer tag (`layer:<schema>`) plus inherited
          source tags via union semantics. Filter via PostgREST's
          `?tags=cs.{...}` array-contains operator.
        data_tests: [not_null]
      - name: is_public_api
        description: |
          `true` when `schema_name = 'api_v1'`. Lets clients distinguish
          stable-contract endpoints from the broader `marts.*` / `raw.*`
          surfaces that are queryable but not version-guaranteed.
        data_tests: [not_null]
      - name: table_type
        description: |
          `BASE TABLE` for tables (most `marts.*`, all `raw.*`) and
          `VIEW` for views (all `api_v1.*` wrappers).

          ⚠️ IN `api_v1` IT IS ALWAYS `VIEW` AND THEREFORE TELLS YOU
          NOTHING ON ITS OWN. All 17 public relations are views over a
          `marts.mart_*` relation; this column distinguishes them from
          `marts.*` and `raw.*`, not from each other.

          🔴 IT DOES NOT PREDICT WHETHER `Prefer: count=estimated` CAN BE
          TRUSTED. Three cases, and the deciding property is whether the
          aggregation happened BEFORE the planner saw it:

          1. the mart is a TABLE — 14 of 17. Its rows were counted by
             ANALYZE when it was built, whatever its query did, so the
             estimate is accurate. `indicator_summary` aggregates heavily
             and estimates fine, because the aggregating happened at
             build time.
          2. the mart is a PLAIN VIEW — `brreg_enhet`. Row count
             propagates from the base table. Accurate.
          3. the mart is an AGGREGATING VIEW — `kommune_ngo_summary` and
             `kommune_ngo_totals`, and only these. The planner must guess
             how many groups a GROUP BY will produce, and measured on the
             live API 2026-09-20 it guessed badly:

                 kommune_ngo_summary   exact 5 435   estimated 69 462   12.8x
                 kommune_ngo_totals    exact   357   estimated  6 946   19.5x

          ⚠️ AND SEPARATELY, `estimated = 1` DOES NOT MEAN ONE ROW. It is
          the planner's floor, so an EMPTY relation reports 1 — measured
          on activity_catalog, distrikt_summary and kommune_local_chapters,
          all of which hold zero rows and all of which are case 1. A
          consumer asking "is there any data here?" cheaply gets yes.

          ✅ Use `Prefer: count=exact`. The largest published relation is
          ~72 000 rows and an exact count is cheap; the estimate saves
          nothing worth being wrong about.

          🔵 An earlier version of this description said the split was
          tables versus views. There are no tables in api_v1, so that
          rule was unusable — a consumer checking dim_kommune, a view
          that estimates exactly, would have concluded the documentation
          was wrong (urb-agents #1288).
        data_tests: [not_null]
  - name: mart_meta_dimensions
    description: |
      Per-source × per-dimension catalogue. Backs the "what does this
      column mean" panel on `/data/sources/[source_id]` (customer
      frontend, PLAN-007 phase 4) and exposes editorial semantics
      shoppers would otherwise have to leave Atlas to find on the
      upstream's docs site.

      v1 scope (this PR): editorial pass-through over the
      `_sources_dimensions` seed (4 columns: `meaning`, `value_format`,
      `notes`). The `cardinality`, `example_values`, and `null_count`
      columns from PLAN-007 phase 3.4's full spec require introspecting
      `raw.<source>` tables with per-source column-name rules — deferred
      to a follow-up PR. See `mart_meta_dimensions.sql` header for the
      open question (Jinja loop vs separate Python extract script vs
      per-source `column_name:` field in manifest.yml).

      Row count = same as `_sources_dimensions` (~216, growing with
      every new source × upstream-dimension).
    columns:
      - name: source_id
        description: |
          Source the dimension belongs to. Joins to
          `mart_meta_sources.source_id` and `_sources_manifest.source_id`.
        data_tests:
          - not_null
          - relationships:
              to: ref('_sources_manifest')
              field: source_id
      - name: code
        description: |
          Upstream's own dimension code (e.g. `Region`, `Tid`,
          `ContentsCode` for SSB; `GEO`, `AAR`, `KJONN`, `MEASURE_TYPE`
          for FHI). Verbatim from the source's API/export — not
          translated to canonical Atlas vocabulary.
        data_tests: [not_null]
      - name: meaning
        description: |
          Short human-readable description of what the dimension
          represents. Hand-authored editorial content from each source's
          `manifest.yml` `dimensions:` block.
        data_tests: [not_null]
      - name: value_format
        description: |
          Encoding of values within the dimension (e.g. "4-digit year as
          text", "1- to 6-character numeric code"). Empty string when no
          specific format applies.
      - name: notes
        description: |
          Editorial notes — code-list size, semantic gotchas, downstream
          filtering decisions. Empty string when no notes apply.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source_id, code]

  - name: mart_brreg_enhet
    description: |
      Every organisation registered in Norway — the whole of Brønnøysundregistrene's
      Enhetsregisteret, around 1.17 million rows, current as of the last change-feed run.
      Companies, foundations, associations, public bodies and sole proprietorships.

      🔵 CHECK WHETHER YOUR RESULT WAS TRUNCATED, AND DO NOT CHECK IT
      AGAINST YOUR OWN `limit`. Send `Prefer: count=exact` and compare the
      total in the `Content-Range` response header against the number of
      rows you actually received:

          Content-Range: 0-4/1175169   with 5 rows  ->  truncated

      Comparing `rows.length` against your own `limit=N` cannot see the cap
      that matters. A server-side `db-max-rows` applies BELOW your limit, so
      a cap of 1 000 against `limit=20000` returns 1 000 rows and the
      comparison passes. It measures your intent, not the server's answer.
      (The recipe is a consumer's, relayed on urb-agents #1410.)

      🔵 Nobody can read `db-max-rows` from outside — PostgREST exposes no
      endpoint for its effective settings, so "unset" and "set above N" are
      indistinguishable. A cap is only ever discoverable by exceeding it.
      Atlas has it UNSET today; this check keeps you correct if that changes.

      🔴 THE COUNT IS WHAT COSTS, AND ONLY WHEN YOUR FILTER CANNOT USE AN
      INDEX. Measured against this relation 2026-09-23:

          kommune_nr=eq.1103  + count=exact      0.10 s   27 765 rows
          navn=ilike.*...*    + count=exact     10.87 s      428 rows
          navn=ilike.*...*    without the count  0.16 s      428 rows
          no filter           + count=exact      0.50 s   1 175 169

      ⚠️ Adding the count to that pattern query cost 70x on a result of 428
      rows. `count=exact` cannot stop at your limit — it counts every
      matching row — so an unindexed predicate scans all 1.17 million.

      ⚠️ AN EARLIER VERSION OF THIS NOTE SAID "DO NOT SEND count=exact WITH
      A FILTER". That is too broad — an equality filter on `kommune_nr` came
      back in 0.10 s above — and the advice would have pushed consumers off a
      cheap, correct call.

      🔵 MEASURE YOUR OWN PREDICATE RATHER THAN TRUSTING A LIST OF COLUMNS.
      `organisasjonsnummer` carries a unique index. `kommune_nr` appears only
      inside a PARTIAL index restricted to voluntary, active rows, so whether
      a bare `kommune_nr` filter can use it depends on the rest of your
      query. The timings above are measurements, not query plans — this
      relation is not introspectable from outside, and the cheap experiment
      is to send your real query twice, once with the count and once
      without.

      ⚠️ INSIDE A BROWSER FETCH A SLOW COUNT IS A TIMEOUT, NOT A SLOW
      ANSWER. A consumer diagnosed one as a CORS failure, because a request
      that never completes is indistinguishable from a blocked one on the
      fetch side. CORS is fine (urb-agents #1361).

      🔴 AND DO NOT SUBSTITUTE `count=planned` AS THE DETECTOR. It is fast
      (0.16 s on the pattern above) and its error is unbounded in BOTH
      directions. Measured 2026-09-23:

          navn ilike *zzzzqqq*   planned    118   exact         0
          navn ilike *frivillig* planned    118
          navn ilike *røde*      planned    118
          navn ilike *as*        planned 570 606
          no filter              planned 1 176 875  exact 1 175 169

      ⚠️ 118 for a pattern that matches NOTHING, and the same 118 for three
      unrelated patterns — for those it is not an estimate of your query at
      all, it is the planner's fallback guess. `*as*` gets a real estimate,
      so it is not a constant either; you cannot tell which you got.

      🔴 And unfiltered it reports 1 706 MORE rows than exist. A detector
      built on it would raise a FALSE TRUNCATION ALARM on a complete answer
      — the opposite failure to the one you were guarding against, and just
      as silent.

      `count=estimated` does not help — measured 10.99 s, because it falls
      back to an exact count when the planner's estimate is small. Use
      `planned` only where an order of magnitude will do, never to decide
      completeness.

      Kilde: Brønnøysundregistrene. Inneholder data under norsk lisens for offentlige data
      (NLOD) tilgjengeliggjort av Brønnøysundregistrene — https://data.norge.no/nlod/no/2.0.
      Re-users must carry this attribution onward; it is a condition of the licence, not a
      courtesy.

      Deleted organisations are excluded. Brreg reports deletions through its change feed and
      Atlas applies them, so an organisation removed upstream disappears from here — but the
      version history is kept, so what it looked like before removal remains answerable.

      Completeness caveat: this reflects deletions Brreg REPORTS. A row Atlas holds that Brreg
      never had would not be removed by any automatic path, because no change event would ever
      mention it.
    columns:
      - name: organisasjonsnummer
        description: >-
          Nine-digit Norwegian organisation number. Text, never a number — leading zeros are
          significant. Stable for the life of the organisation, and the join key for
          organisational data from any Norwegian source.
        data_tests:
          - not_null
          - unique
      - name: navn
        description: >-
          Registered name, verbatim from Brreg. For an enkeltpersonforetak (organisasjonsform
          ENK) this is very often the proprietor's own personal name, because that is how the
          register records them.
        data_tests: [not_null]
      - name: organisasjonsform_kode
        description: >-
          Legal form code — AS (aksjeselskap), ENK (enkeltpersonforetak), FLI
          (forening/lag/innretning), STI (stiftelse) and others. The usual filter for separating
          companies from associations, or for excluding sole proprietorships.
        data_tests: [not_null]
      - name: organisasjonsform_beskrivelse
        description: Human-readable Norwegian label for organisasjonsform_kode, as Brreg publishes it.
      - name: naeringskode1_kode
        description: >-
          Primary NACE industry code (SN2007), e.g. 94.992. Null for roughly 2% of the register.
      - name: kommune_nr
        description: >-
          Kommune code of the registered business address. For an enkeltpersonforetak the
          registered business address is commonly the proprietor's home address. Null where no
          business address is registered (~6%). Some codes are historical or pseudo-regions and
          will not resolve against a current kommune list.
      - name: antall_ansatte
        description: >-
          Registered employee count. NULL MEANS "NOT REPORTED", NOT ZERO — the field is present
          on only ~4% of records. Use har_registrert_antall_ansatte to distinguish the two;
          reading NULL as 0 understates staffed organisations badly.
      - name: har_registrert_antall_ansatte
        description: >-
          Whether Brreg holds a registered employee count at all. Present on 100% of records, and
          the only way to tell "zero employees" from "no figure reported".
        data_tests: [not_null]
      - name: konkurs
        description: Whether the organisation is in bankruptcy proceedings. Straight from Brreg.
        data_tests: [not_null]
      - name: under_avvikling
        description: Whether the organisation is being wound up voluntarily. Straight from Brreg.
        data_tests: [not_null]
      - name: under_tvangsavvikling
        description: Whether the organisation is under compulsory winding-up or dissolution.
        data_tests: [not_null]
      - name: is_active
        description: >-
          Convenience boolean — true when none of konkurs, under_avvikling or
          under_tvangsavvikling is set. Means "trading", not "exists": all three states are still
          registered organisations. Ignore this column if you want everything registered.
        data_tests: [not_null]
      - name: registrert_i_frivillighetsregisteret
        description: >-
          Whether the organisation is in Frivillighetsregisteret, the voluntary-organisation
          register — true for roughly 72,800 records. This is what makes the Norwegian voluntary
          sector discoverable as a population rather than a curated list.
        data_tests: [not_null]
      - name: registrert_dato
        description: Date the organisation was entered in Enhetsregisteret.
      - name: icnpo_nummer
        description: >-
          Primary ICNPO code as the organisation classified itself in Frivillighetsregisteret,
          e.g. "9100". Null for organisations not in that register, and for members declaring
          none. Null does not mean "not voluntary" — use registrert_i_frivillighetsregisteret
          for that.
      - name: icnpo_kategori
        description: Primary ICNPO category label paired with icnpo_nummer.
      - name: grasrotandel_deltar_i
        description: >-
          Whether the organisation participates in Grasrotandelen, Norsk Tipping's grassroots
          funding scheme. Null for organisations not in Frivillighetsregisteret.
      - name: frivillig_innfoert_dato
        description: >-
          Date of entry in Frivillighetsregisteret — distinct from registrert_dato, which is the
          Enhetsregisteret entry. Organisations often exist for years before registering as
          voluntary.
      - name: last_seen_at
        description: >-
          When the INGEST last wrote this row into Atlas's raw layer, from either the bulk snapshot or
          a change-feed run. Tracks Atlas's load, not an upstream event. Read it together with
          reconciled_at — this is the ingest clock, that is the transform clock.
        data_tests: [not_null]
      - name: reconciled_at
        description: >-
          When the TRANSFORM last reconciled this row into the served layer. 🔴 Read both clocks: the
          change feed polls every half hour and this reconciliation follows ten minutes behind it, so
          the data behind this endpoint can be older than what Atlas has already ingested. Without
          both, "current" means different things depending on which table you read — an install once
          sat 13.5 hours behind Brreg with every health check green. ⚠️ Only organisations that
          actually changed are re-stamped, so an old value means "nothing about this organisation has
          changed since then", not "this endpoint is stale".
        data_tests: [not_null]
      - name: epostadresse
        description: >-
          Email address the organisation registered with Brreg. Present on 324,967 of 1,175,334
          rows (27.65%), counted 2026-09-24.
      - name: mobil
        description: >-
          Mobile number registered with Brreg. Present on 308,989 of 1,175,334 rows (26.29%),
          counted 2026-09-24.
      - name: telefon
        description: >-
          Telephone number registered with Brreg. Present on 194,520 of 1,175,334 rows (16.55%),
          counted 2026-09-24.
      - name: hjemmeside
        description: >-
          Website the organisation registered with Brreg. Present on 114,075 of 1,175,334 rows
          (9.71%), counted 2026-09-24.
      - name: registrert_i_mvaregisteret
        description: >-
          Whether the organisation is registered in mvaregisteret. Present on 1,175,334 of
          1,175,334 rows (100.00%), counted 2026-09-24.
      - name: registrert_i_foretaksregisteret
        description: >-
          Whether the organisation is registered in foretaksregisteret. Present on 1,175,334 of
          1,175,334 rows (100.00%), counted 2026-09-24.
      - name: registrert_i_stiftelsesregisteret
        description: >-
          Whether the organisation is registered in stiftelsesregisteret. Present on 1,175,334
          of 1,175,334 rows (100.00%), counted 2026-09-24.
      - name: registrert_i_partiregisteret
        description: >-
          Whether the organisation is registered in partiregisteret. Present on 1,175,334 of
          1,175,334 rows (100.00%), counted 2026-09-24.
      - name: er_i_konsern
