  - name: mart_dim_kommune
    meta:
      title: "Kommune dimension"
    description: |
      The canonical municipality registry — SSB Klass 131, with fylke
      name joined. Published as api_v1.dim_kommune.

      Fourteen references in this file already pointed at dim_kommune —
      five column descriptions saying "FK to dim_kommune" and the rest
      `relationships` tests — while it was not published. A consumer
      building on the API found the gap and called publishing it "the
      single highest-leverage small addition on this list — every
      consumer is currently rebuilding it, and each of us is rebuilding
      it slightly differently" (urb-agents #1250, finding 4).

      Historical codes are included with is_active = false, because a
      consumer joining older data needs them to resolve. Filter
      ?is_active=is.true for today's 357.

      Population and centroids are deliberately absent — see the model
      for why; both would be wrong in a dimension rather than merely
      missing.
    columns:
      - name: kommune_nr
        description: |
          4-digit zero-padded kommune code, SSB canonical form
          ('0301' = Oslo). The join key every other Atlas relation uses.
        data_tests:
          - not_null
          - unique
      - name: kommune_name
        description: Kommune name in bokmål.
        data_tests: [not_null]
      - name: kommune_name_alt
        description: |
          The alternative official name where SSB publishes one —
          in practice the Sámi variant, split out of upstream's
          "Name - Nama" string rather than left embedded in
          kommune_name. NULL for most kommuner.
      - name: fylke_nr
        description: |
          2-digit fylke code, derived from the first two digits of
          kommune_nr per SSB's long-standing convention.
      - name: fylke_name
        description: |
          Joined from dim_fylke. NULL where the fylke code is not in
          dim_fylke — pseudo-regions and Svalbard (21xx) — rather than
          dropping the kommune, so an unresolvable fylke costs a label
          and not a row.
      - name: is_active
        description: |
          True when the CODE is current — which is not the same as "this
          is a municipality". 358 rows satisfy it: 357 kommuner plus the
          9999 sentinel. Combine with is_sentinel.

          ⚠️ Sentinel codes such as 9999 'Uoppgitt' are present in this
          dimension and reach api_v1 views unmarked — whether they
          should be excluded or flagged is an open product question
          (urb-agents #700), raised again by a consumer whose first
          build reported 358 kommuner and carried a null-everything row
          into a chart.
        data_tests: [not_null]
      - name: valid_from
        description: Date the code became valid. NULL where upstream gives none.
      - name: valid_to
        description: Date the code became inactive. NULL = still active.
      - name: notes
        description: |
          Upstream's own note on the code, typically recording a merger
          or reorganisation. NULL for most rows.
      - name: is_sentinel
        description: |
          True for SSB's 9999 'Uoppgitt' bucket — a current code that is
          not a municipality.

          ⚠️ is_active does NOT exclude it. `?is_active=eq.true` returns
          358, not 357, and the extra row is this one (measured on the
          live API, urb-agents #1265). For real municipalities filter
          `?is_sentinel=is.false`.

          🔵 THIS RELATION KEEPS THE ROW ON PURPOSE, AND IT IS NOW THE
          ONLY PUBLISHED ONE THAT DOES. SSB's Klass 131 contains 9999,
          and this dimension mirrors SSB's kommune list — dropping it
          would mean Atlas's list no longer matches the source anyone
          would reconcile against.

          ⚠️ As of 2026-09-21 the ANALYTICAL relations no longer carry
          it: coverage_gap_barnefattigdom, indicator_latest_values,
          indicator_missing_kommuner and kommune_ngo_summary exclude it,
          and indicator_summary stopped counting it in its coverage
          figures. Those are Atlas's own constructs and their grain is
          "one municipality"; this one is a mirror. Terje's decision,
          urb-agents #1301.

          The unattributable value it represented is published in
          `unattributed_totals`, not discarded.

  - name: mart_kommune_ngo_summary
    meta:
      title: "Voluntary organisations per kommune"
    description: |
      Active voluntary organisations per kommune and ICNPO category —
      the number a consumer previously had to download the whole
      register to compute. Published as api_v1.kommune_ngo_summary.

      PostgREST has aggregates disabled, so `?select=count()` returns
      400 and the only alternatives were ~15 minutes of per-kommune
      probes or a 2.8 MB CSV on every page load. One consumer shipped
      the download (urb-agents #1250, finding 1); this replaces it with
      ~12 000 rows.

      ⚠️ Counts here will NOT match a count over brreg_enhet. 7 488 of
      72 792 active voluntary units (10.3 %) carry no kommune_nr — that
      is what Brreg publishes — and cannot be attributed to a
      municipality. A handful more sit on codes outside the 357 active
      kommuner and are dropped by the join.

      A (kommune, category) pair absent from this view has zero
      organisations; rows are not emitted for empty combinations.

      ⚠️ CHANGED 2026-09-21: SSB's 9999 'Uoppgitt' is no longer
      included. It is a current code, so `is_active` never excluded it,
      and this relation had been reporting a place that does not exist.
      Counts drop by that row. `dim_kommune` still carries 9999 — the
      dimension mirrors SSB's list — and the value is published in
      `unattributed_totals` (urb-agents #1301).

      ⚠️ COST, AND ONE LOAD-BEARING DEPENDENCY. Measured end-to-end
      against the live API: 0.12 s filtered by kommune_nr, 0.205-0.326 s
      unfiltered for all rows. Before the covering index on
      dim_brreg_enhet it was 25 s cold for a 24 kB response and one
      request timed out. That index is not an optimisation — drop it and
      this relation is unusable rather than slow.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - kommune_nr
            - icnpo_nummer
    columns:
      - name: kommune_nr
        description: 4-digit kommune code. FK to dim_kommune.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Kommune name in bokmål, joined from dim_kommune.
        data_tests: [not_null]
      - name: icnpo_nummer
        description: |
          ICNPO category number as Brreg assigns it. NULL where the
          organisation carries no ICNPO classification.
      - name: icnpo_kategori
        description: |
          ICNPO category label. NULL where the organisation carries no
          ICNPO classification — those rows are counted, not dropped,
          so a per-kommune total over this view stays correct.
      - name: active_count
        description: |
          Count of organisations in this kommune and category that are
          both is_active and registrert_i_frivillighetsregisteret.
          Always >= 1; absent combinations mean zero.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

  - name: mart_kommune_ngo_totals
    meta:
      title: "Voluntary organisations per kommune, total"
    description: |
      One row per kommune: how many active voluntary organisations are
      registered there. 357 rows instead of the ~5 400 in
      kommune_ngo_summary. Published as api_v1.kommune_ngo_totals.

      Exists because PostgREST cannot sum — `?select=active_count.sum()`
      returns PGRST123, aggregates are disabled — so a consumer wanting
      one number per kommune otherwise fetches every category row and
      adds them client-side. That was most of a cold page load
      (urb-agents #1265).

      ⚠️ Counts exclude the 10.3 % of active voluntary units carrying no
      kommune_nr, exactly as kommune_ngo_summary does. Summing this gives
      the placed total, not the register total.

      ⚠️ CHANGED 2026-09-21: SSB's 9999 'Uoppgitt' is no longer
      included. It is a current code, so `is_active` never excluded it,
      and this relation had been reporting a place that does not exist.
      Counts drop by that row. `dim_kommune` still carries 9999 — the
      dimension mirrors SSB's list — and the value is published in
      `unattributed_totals` (urb-agents #1301).

      ⚠️ COST, AND ONE LOAD-BEARING DEPENDENCY. Measured end-to-end
      against the live API: 0.12 s filtered by kommune_nr, 0.205-0.326 s
      unfiltered for all rows. Before the covering index on
      dim_brreg_enhet it was 25 s cold for a 24 kB response and one
      request timed out. That index is not an optimisation — drop it and
      this relation is unusable rather than slow.

    columns:
      - name: kommune_nr
        description: 4-digit kommune code. FK to dim_kommune.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Kommune name in bokmål, joined from dim_kommune.
        data_tests: [not_null]
      - name: active_count
        description: |
          Total active voluntary organisations in this kommune, summed
          across ICNPO categories. Always >= 1; a kommune with none has
          no row.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

  - name: mart_kommune_befolkning_alder
    description: |
      Population by kommune, year and age band — the denominator layer.
      Published as api_v1.kommune_befolkning_alder.

      Built from SSB table 07459 (age and sex distribution), which Atlas
      has ingested and refreshed nightly for months while serving it to
      nobody: nothing downstream of raw read it, so `GET /ssb-07459`
      returned 404. A consumer built its elderly-care view around care
      USERS rather than elderly RESIDENTS and wrote a README section
      apologising for it, noting the substitution flatters a kommune with
      a high threshold for granting services (urb-agents #1281).

      ⚠️ SIX BANDS SUM TO befolkning_total. TWO DO NOT — they are
      roll-ups of the six, provided because PostgREST has aggregates
      disabled and a consumer would otherwise add them client-side:

          sum to the total:  0_5 · 6_15 · 16_17 · 18_66 · 67_79 · 80_plus
          roll-ups:          0_17     = 0_5 + 6_15 + 16_17
                             67_plus  = 67_79 + 80_plus

      Bands rather than a single "elderly" threshold on purpose. 67 is
      defensible and it is still an editorial claim; publishing the bands
      leaves that claim with whoever makes it, and the same rows serve as
      the denominator for child poverty and working-age dependency.

      ⚠️ Counts are residents, not care recipients, and they are SSB's
      register population at the start of the year — not an average over
      it. Historical kommune codes are excluded: only kommuner active
      today get rows, so a 1990 row exists for today's kommune, not for
      the one that held that code in 1990.
    columns:
      - name: kommune_nr
        description: 4-digit kommune code. FK to dim_kommune.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: Kommune name in bokmål, joined from dim_kommune.
        data_tests: [not_null]
      - name: fylke_nr
        description: 2-digit fylke code, derived from kommune_nr in dim_kommune.
        data_tests: [not_null]
      - name: fylke_name
        description: >-
          Joined from dim_fylke. NULL for kommune codes whose fylke has no row there — Svalbard-style
          21xx codes. A LEFT join on purpose: an inner one would drop those kommuner from the
          denominator entirely, which is worse than a missing label.
      - name: year
        description: Calendar year. SSB 07459 covers 1986 onwards.
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1980, max_value: 2050}
      - name: alder_0_5
        description: Residents aged 0-5 (pre-school). Disjoint band.
        data_tests: [not_null]
      - name: alder_6_15
        description: Residents aged 6-15 (grunnskole age). Disjoint band.
        data_tests: [not_null]
      - name: alder_16_17
        description: Residents aged 16-17. Disjoint band, and the one that completes 0_17.
        data_tests: [not_null]
      - name: alder_18_66
        description: Residents aged 18-66 (working age, to the 67 pension threshold). Disjoint band.
        data_tests: [not_null]
      - name: alder_67_79
        description: Residents aged 67-79. Disjoint band.
        data_tests: [not_null]
      - name: alder_80_plus
        description: >-
          Residents aged 80 and over, including SSB's open-ended '105+' bucket. Disjoint band.
          Built from age_min, not age_int — age_int is NULL for '105+', so banding on it would
          silently drop those residents.
        data_tests: [not_null]
      - name: alder_0_17
        description: |
          Residents aged 0-17. ⚠️ A ROLL-UP of 0_5 + 6_15 + 16_17, NOT a
          seventh band — adding it to the disjoint bands double-counts.
          The child-poverty denominator, so that coverage_gap_barnefattigdom's
          share can be read against a population rather than against itself.
        data_tests: [not_null]
      - name: alder_67_plus
        description: |
          Residents aged 67 and over. ⚠️ A ROLL-UP of 67_79 + 80_plus, NOT a
          band. This is the elderly denominator the consumer in #1281 did not
          have; 67 is Norway's pension age and the choice of threshold is the
          reader's, which is why the two bands are published beside it.
        data_tests: [not_null]
      - name: befolkning_total
        description: |
          All residents of the kommune in that year. Equals the six disjoint
          bands summed.

          🔴 Sexes are FILTERED, not summed: SSB's Kjonn dimension codes '0' as
          ALL, so summing every sex row would double the population of every
          kommune in Norway. The model selects male and female explicitly, and
          the singular test bands_sum_to_the_population_total is what would
          catch it if that ever stopped being true.
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [kommune_nr, year]

  - name: mart_unattributed_totals
    description: |
      The part of a published quantity that belongs to no municipality.
      Published as api_v1.unattributed_totals.

      🔴 Atlas had no convention for this, and the two surfaces that met
      it chose opposite wrong answers: SSB's 9999 'Uoppgitt' sits INSIDE
      a per-kommune relation and corrupts any sum over it, while 7 488
      active voluntary units with no kommune_nr fall OUT of one and
      vanish silently. One smuggles the remainder in as a row, the other
      discards it, and a consumer summing either gets a number that is
      wrong in a direction it cannot see (urb-agents #700, #1250, #1265).

      ✅ The rule this establishes: the VALUE belongs, the ROW does not.
      A per-kommune relation carries only kommuner; the remainder lives
      here, named, so reconciling to a national total is a deliberate
      act rather than an accident of whether a sentinel survived a
      filter.

      ⚠️ It does NOT remove the 9999 rows from dim_kommune or
      coverage_gap_barnefattigdom. That is a breaking contract change —
      `?is_active=eq.true` would return 357 instead of 358 with no
      warning — and it is deliberately not bundled with an additive
      change. `is_sentinel` remains a stopgap and this view does not
      make the trap gone.

      🔵 A zero is a result. Where the remainder is genuinely nothing
      this emits 0 rather than omitting the row: "we checked, none" and
      "nobody checked" are different answers, and a missing row cannot
      tell them apart.

      ✅ THE ARITHMETIC CLOSES, AND A TEST SAYS SO. Summing a per-kommune
      relation and adding every `unattributed_value` for it must equal
      `total_value`:

          kommune_ngo_totals   65 270
          no_kommune_nr         7 489
          kommune_nr_not_current   43
          ---------------------------
          total_value          72 802

      ⚠️ It did not close on the day this shipped. It named 7 489 of
      7 532 and the 43 Svalbard organisations were counted by neither
      relation — silent, self-consistent, and visible only by doing the
      subtraction this view exists to support. The singular test
      `the_remainder_closes_the_total` now asserts the decomposition
      rather than the parts, which is the thing that was missing: every
      part had a test and the relationship between them had none.
    columns:
      - name: relation
        description: >-
          The published relation this remainder belongs to, e.g. `kommune_ngo_totals`. Not a foreign
          key: it names a relation, not a row.
        data_tests: [not_null]
      - name: measure
        description: The column of that relation the value would have contributed to.
        data_tests: [not_null]
      - name: reason
        description: |
          Why the value is unattributable.

          `no_kommune_nr` — upstream publishes the record with no
          municipality at all. For Brreg this is 10.3 % of active
          voluntary units and is what Brreg itself publishes; it is not
          an Atlas defect.

          `kommune_nr_not_current` — the record HAS a kommune_nr and it
          is not one of the current municipalities. 🔴 Today these are
          all Svalbard (2100): a real code, absent from SSB's Klass 131,
          so `kommune_ngo_totals` emits no row for it. Without this
          reason the relation named 7 489 of 7 532 and the obvious
          reconciliation came out 43 short with no error anywhere
          (urb-agents #1318). Historical kommune codes would land here
          too if Brreg ever used one.

          `sentinel_9999` — upstream attributes the value to its own
          'Uoppgitt' bucket. ⚠️ Note this is the same 9999 that
          `classify_region_code` calls `unspecified_national` and that
          `dim_kommune.is_active` still returns as a municipality.
        data_tests:
          - not_null
          - accepted_values:
              values: [no_kommune_nr, kommune_nr_not_current, sentinel_9999]
      - name: source_id
        description: The upstream source the quantity comes from.
        data_tests: [not_null]
      - name: year
        description: >-
          Calendar year, where the quantity is time-varying. NULL for register snapshots like Brreg,
          which have no year dimension — a null here means "not applicable", never "unknown".
      - name: unattributed_value
        description: >-
          The part that belongs to no municipality. Add this to a sum over the per-kommune relation
          to reconcile with the upstream national figure.
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: total_value
        description: >-
          The whole quantity, attributed and unattributed together. The denominator for the share.
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: unattributed_share_pct
        description: >-
          `unattributed_value` as a percentage of `total_value`, to one decimal. NULL when
          total_value is zero, because a share of nothing is undefined rather than zero.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [relation, measure, reason, year]
  - name: mart_source_freshness
    meta:
      title: "Source freshness"
    description: |
      One row per raw source table that declares a `loaded_at_field`, saying
      whether it is inside the window its own declared cadence allows.

      This is the operator-readable half of the ingest-freshness signal. The
      comparison used to live only inside the dbt test
      `raw_sources_were_refreshed_recently`, whose verdict exists only while the
      suite is running — it lands in dbt's run results and Dagster's event log,
      and `atlas-status.py` can read neither. So `uis template check atlas`
      reported a 24-hour window instead, which cannot see a weekly or monthly
      source go stale at all (urb-agents #1039).

      It is a VIEW on purpose: evaluated when queried, so it is current whether
      or not the transform, the check suite or the Dagster daemon has run. A
      table would carry the very staleness it is meant to report.

      The test now selects its failing rows from here rather than recomputing
      them, so the gate and the surface cannot disagree. Cadence bounds are
      `vars.ingest_cadence_max_age_days` in dbt_project.yml, read by both and
      defaulted by neither.
    columns:
      - name: source_name
        description: The dbt source collection the table belongs to. 'raw' for every row today.
        data_tests:
          - not_null
      - name: source_table
        description: Raw table name, e.g. 'ssb_08484'. Unique across the view.
        data_tests:
          - not_null
          - unique
      - name: ingest_cadence
        description: |
          The cadence declared on the source in sources.yml
          (`meta.ingest_cadence`): half_hourly, daily, weekly, monthly, or the
          two silencing values manual and none, each of which requires a written
          `meta.cadence_note`. 'undeclared' appears only when a source declares
          a loaded_at_field and no cadence — a state the dbt test refuses to
          compile on, which this view still reports.
        data_tests:
          - not_null
      - name: max_age_days
        description: |
          Tolerated age for this cadence, from vars.ingest_cadence_max_age_days.
          Null for manual, none, and any cadence with no bound declared.
      - name: last_loaded_at
        description: |
          Newest value of the source's own `loaded_at_field`. Null when the table
          has no rows at all, which is a failure rather than a separate kind of
          healthy: "never loaded" and "loaded long ago" are the same defect to a
          consumer.
      - name: age_days
        description: Age of last_loaded_at in days, to two decimals. Null when the table is empty.
      - name: freshness_status
        description: |
          ok · overdue · never_loaded · not_bounded · undeclared · unknown_cadence.

          `not_bounded` rows are emitted rather than filtered out, so a reader
          can say "29 bounded, 5 silenced" instead of quietly reporting a smaller
          universe than exists — a row that vanishes from a freshness surface is
          indistinguishable from a source nobody ever added. `undeclared` and
          `unknown_cadence` are kept apart: one is a source nobody finished
          adding, the other a cadence somebody invented, and they need different
          fixes.
        data_tests:
          - not_null
          - accepted_values:
              values: [ok, overdue, never_loaded, not_bounded, undeclared, unknown_cadence]

  - name: mart_ingest_health
    meta:
      title: "Ingest health"
    description: |
      Per-source ingest-run health. One row per scraper or API-source,
      showing the most recent COMPLETED run (finished_at IS NOT NULL).
      Minimal v1 surface per Q14 of
      INVESTIGATE-ngo-scraping-infrastructure.md — just the three columns
      needed to answer "which sources are failing?" and "which sources
      haven't refreshed recently?". Empty until the first scraper writes
      to raw.ingest_runs.
    columns:
      - name: source_id
        description: |
          Atlas source identifier, e.g. 'ssb-08764' or 'redcross'.
          Unique within this table — one row per source. Joins back to
          raw.ingest_runs.source_id.
        data_tests:
          - not_null
          - unique
      - name: last_run_at
        description: |
          finished_at of the most recent COMPLETED ingest run for this
          source. NULL rows from raw.ingest_runs (in-flight or
          aborted runs) are filtered out upstream.
        data_tests:
          - not_null
      - name: last_status
        description: |
          Status of the most recent COMPLETED run. 'ok' = the scraper
          finished and wrote rows; 'fail' = it errored or completed
          with the expected output shape missing.
        data_tests:
          - not_null
          - accepted_values:
              values: [ok, fail]
