        data_tests:
          - not_null
          - accepted_values: {values: [male, female, all]}
        data_type: text
      - name: age
        description: SSB Alder — '000'..'104' or '105+'.
        data_tests: [not_null]
        data_type: text
      - name: age_int
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 110}
        data_type: integer
      - name: age_min
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 110}
        data_type: integer
      - name: year
        description: Calendar year (from SSB's Tid dimension).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2050
        data_type: integer
      - name: contents_code
        description: SSB ContentsCode — Personer.
        data_tests:
          - not_null
          - accepted_values:
              values: [Personer]
        data_type: text
      - name: contents_label
        description: Human-readable label for contents_code, verbatim from upstream.
        data_type: text
      - name: value
        description: Numeric resident count. NULL when upstream suppresses the cell.
        data_type: numeric
      - name: status
        description: Upstream suppression / quality marker. NULL when value is present.
        data_type: text
      - name: updated_at
        data_tests: [not_null]
        data_type: timestamp with time zone
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
