  - name: indicators__ssb_07459
    description: |
      Per-source indicator passthrough for SSB 07459 (population by region,
      sex, and single-year age). Preserves sex and age dimensions.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: [ssb-07459]
        data_type: text
      - name: region_code
        data_tests: [not_null]
        data_type: text
      - name: kommune_nr
        data_tests:
          # SSB 07459 covers 1986-2026 in its Region dimension so it retains
          # ~593 historical 4-digit codes (old Østfold 01xx, etc.) with 0
          # values for the current year. Warn instead of error until
          # dim_kommune is extended with historical codes.
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
        data_type: text
      - name: fylke_nr
        data_tests:
          # Pre-2020 fylker (01-20 numbering) appear here with zero values.
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
              config:
                severity: warn
        data_type: text
      - name: sex
        description: SSB Kjonn — '1' (Menn) or '2' (Kvinner).
        data_tests:
          - not_null
          - accepted_values: {values: [male, female, all]}
        data_type: text
      - name: age
        data_tests: [not_null]
        description: SSB Alder — '000'..'104' or '105+'.
        data_type: text
      - name: age_int
