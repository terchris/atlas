version: 2
models:
  - name: indicators__ssb_08764
    description: |
      Per-source indicator passthrough for SSB 08764. One row per (region_code,
      year, contents_code). Materialised as a table in the marts schema; feeds
      the forthcoming indicator_values union.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: [ssb-08764]
        data_type: text
      - name: region_code
        description: SSB region code — kommune, fylke, nasjon, or historical variant.
        data_tests:
          - not_null
        data_type: text
      - name: kommune_nr
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
        data_type: text
      - name: fylke_nr
        data_tests:
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
        data_type: text
      - name: year
        description: Calendar year (from SSB's Tid dimension).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2040
        data_type: integer
      - name: contents_code
        description: SSB ContentsCode — one of Personer / EUskala50 / EUskala60 / OECDskala50 / 
          OECDskala60.
        data_tests:
          - not_null
          - accepted_values:
              values: [Personer, EUskala50, EUskala60, OECDskala50, OECDskala60]
        data_type: text
      - name: contents_label
        data_type: text
      - name: value
        data_type: numeric
      - name: status
        data_type: text
      - name: updated_at
        data_tests:
          - not_null
        data_type: timestamp with time zone
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - year
            - contents_code

  - name: indicators__ssb_06913
    description: |
      Per-source indicator passthrough for SSB 06913 (population change).
      Same Region × ContentsCode × Tid shape as indicators__ssb_08764.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: [ssb-06913]
        data_type: text
      - name: region_code
        data_tests: [not_null]
        data_type: text
      - name: kommune_nr
        data_tests:
          # SSB 06913 retains historical kommune codes in its Region dimension
          # (mergers 1960-2024). dim_kommune currently holds active-today codes
          # only; extending it with history is tracked as a follow-up. Warn so
          # we see the mismatch without failing CI.
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
        data_type: text
      - name: fylke_nr
        data_tests:
          # Historical fylker (pre-2020 01-20 numbering) may appear — warn.
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
              config:
                severity: warn
        data_type: text
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: 2050
        data_type: integer
      - name: contents_code
        data_tests: [not_null]
        data_type: text
      - name: contents_label
        data_type: text
      - name: value
        data_type: numeric
      - name: status
        data_type: text
      - name: updated_at
        data_tests: [not_null]
        data_type: timestamp with time zone
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - year
            - contents_code

  - name: indicators__ssb_06944
    description: |
      Per-source indicator passthrough for SSB 06944 (household income by
      household type). Preserves household_type column; consumers filter to
      `household_type = '0000'` for the all-households headline.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: [ssb-06944]
        data_type: text
      - name: region_code
        data_tests: [not_null]
        data_type: text
      - name: kommune_nr
        data_tests:
          # SSB 06944 includes Svalbard (21xx), Jan Mayen (22xx), continental
          # shelf (23xx) kommune-like codes that aren't in Klass 131 mainland.
          # Warn — same pattern as the fylke test below and 07459's historical.
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
        data_type: text
      - name: fylke_nr
        data_tests:
          # SSB uses special 2-digit codes outside Klass 104 for Svalbard (21),
          # Jan Mayen (22), continental shelf (23), EU (25), abroad (26),
          # unknown (88). Warn instead of error — legitimate SSB codes for
          # aggregates beyond mainland Norway.
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
              config:
                severity: warn
        data_type: text
      - name: household_type
        data_tests:
          - not_null
          - relationships: {to: ref('ref_ssb_household_type'), field: code}
        data_type: text
      - name: household_type_label_no
        data_tests: [not_null]
        data_type: text
      - name: household_type_label_en
        data_tests: [not_null]
        data_type: text
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2050
        data_type: integer
      - name: contents_code
        data_tests:
          - not_null
          - accepted_values:
              values: [SamletInntekt, InntSkatt, AntallHushold]
        data_type: text
      - name: contents_label
        data_type: text
      - name: value
        data_type: numeric
      - name: status
        data_type: text
      - name: updated_at
        data_tests: [not_null]
        data_type: timestamp with time zone
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - household_type
            - year
            - contents_code

