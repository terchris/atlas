            - year
            - contents_code

  - name: indicators__ssb_08484
    description: |
      SSB 08484 bundle slice — nationally reported offences (counts + per capita).
      kommune_nr is intentionally NULL (no regional dimension upstream).
    columns:
      - name: source_id
        description: Canonical catalogue identifier for this Px bundle — always ssb-crime-tables.
        data_tests:
          - not_null
          - accepted_values:
              values: [ssb-crime-tables]
      - name: kommune_nr
        description: Always NULL — national geography only for this Px table.
      - name: fylke_nr
        description: Always NULL — no fylke dimension on 08484.
      - name: year
        description: Calendar observation year from SSB's Tid dimension.
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1990, max_value: 2050}
      - name: contents_code
        description: Composite key — LovbruddKrim offence code concatenated with SSB ContentsCode.
        data_tests: [not_null]
      - name: contents_label
        description: Concatenated Norwegian labels for offence hierarchy and statistic variable.
      - name: value
        description: >
          Count or rate per Px cell. NULL when SSB withheld the statistic (small counts / suppression
          marker in status).
      - name: status
        description: PxWebAPI cell-status character when value is withheld; otherwise NULL.
      - name: updated_at
        description: ingest `loaded_at` from raw.ssb_08484 (landing write time).
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - year
            - contents_code

  - name: indicators__ssb_08487
    description: |
      SSB 08487 bundle slice — reported offences by place of offence; two-year averages.
