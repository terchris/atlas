  - name: indicators__bufdir_barnefattigdom
    description: |-
      Per-source passthrough for Bufdir Barnefattigdom kommunemonitor. One row per
      (indicator, region_code, category pair, year) parsed from ZIP `Indikator_*.xlsx` workbook Data sheets.
    columns:
      - name: source_id
        description: Atlas catalogue id for this ingest — always bufdir-barnefattigdom.
        data_tests:
          - not_null
          - accepted_values:
              values: [bufdir-barnefattigdom]
        data_type: text
      - name: indicator_api_id
        description: Stable surrogate workbook id — bf_zip_<24 hex fingerprint of the XLSX filename stem>.
        data_tests:
          - not_null
        data_type: text
      - name: indicator_slug
        description: Normalised slug from the upstream indicator name; used as part of 
          contents_code.
        data_tests:
          - not_null
        data_type: text
      - name: indicator_group_slug
        description: Fixed literal barnefattigdom_zip for ZIP-ingested rows (replaces legacy Strapi group slugs).
        data_tests:
          - not_null
        data_type: text
      - name: indicator_name
        description: Workbook-derived indicator title concatenated above the Region header rows.
        data_tests:
          - not_null
        data_type: text
      - name: indicator_title
        description: Same human-facing title chain as indicator_name after ZIP parsing.
        data_tests:
          - not_null
        data_type: text
      - name: link_text
        description: NULL for workbook-backed rows (legacy Strapi link label not present upstream).
        data_type: text
      - name: region_code
        description: |-
          Geographic code string from workbook column Region (same levels as the legacy API: land, fylke, kommune, longer bydel codes).
        data_tests:
          - not_null
        data_type: text
      - name: kommune_nr
        description: >-
          Four-digit kommune code when region_code is exactly four digits; NULL for other geography levels.
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
        data_type: text
      - name: fylke_nr
        description: Two-digit fylke code when region_code is exactly two digits; NULL otherwise.
        data_tests:
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
        data_type: text
      - name: category_unit
        description: First category axis from column Enhet — barn (children) or husholdning (households).
        data_tests:
          - not_null
          - accepted_values:
              values: [barn, husholdning]
        data_type: text
      - name: category_format
        description: Second category axis — prosent (share) or antall (count).
        data_tests:
          - not_null
          - accepted_values:
              values: [prosent, antall]
        data_type: text
      - name: year
        description: Calendar year of the observation.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2050
        data_type: integer
      - name: contents_code
        description: |
          Atlas-normalised variable code: prefix `bf_`, the indicator slug, and the two
          category axes joined with `__`, so each measure is filter-stable in the catalogue.
        data_tests:
          - not_null
        data_type: text
      - name: contents_label
        description: |-
          Human-readable label combining workbook title rows with barn/husholdning and prosent/antall verbs.
        data_tests:
          - not_null
        data_type: text
      - name: value
        description: Numeric value for this year; NULL when the upstream series omits this year.
        data_type: numeric
      - name: values_json
        description: Parse of Data sheet rows into year keys (spreadsheet blanks / suppression → JSON null values).
        data_tests:
          - not_null
        data_type: jsonb
      - name: updated_at
        description: Timestamp when the row was last written by ingest (from raw.loaded_at).
        data_tests:
          - not_null
        data_type: timestamp with time zone
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - indicator_api_id
            - region_code
            - category_unit
            - category_format
            - year
