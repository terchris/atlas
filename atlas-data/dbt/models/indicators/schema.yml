        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1990, max_value: 2050}
      - name: contents_code
        description: Composite key — region × offence × statistic × two-year interval (see SQL).
        data_tests: [not_null]
      - name: contents_label
        description: Place label, offence label, metric label, and interval label concatenated for 
