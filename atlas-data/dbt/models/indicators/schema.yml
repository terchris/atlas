      - name: status
        description: PxWebAPI cell-status character when value is withheld.
      - name: updated_at
        description: ingest `loaded_at` from raw.ssb_08487.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - kommune_nr
            - year
            - contents_code

