            data_tests: [not_null]
          - name: kjonn_code
            description: FHI KJONN — '0' both, '1' men, '2' women.
            data_type: text
          - name: alder_code
            description: >-
              FHI ALDER — always "1_6". ⚠️ An Ungdata survey-cohort identifier, NOT ages 1 to 6.
