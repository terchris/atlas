          Populated by atlas-data/ingest/src/sources/ssb-06913.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: weekly
        freshness:
          warn_after: {count: 400, period: day}
          error_after: {count: 800, period: day}
        columns:
          - name: region_code
            data_tests: [not_null]
          - name: year
            data_tests: [not_null]
          - name: contents_code
            data_tests: [not_null]
          - name: contents_label
            data_type: text
          - name: value
            data_type: numeric
          - name: status
            data_type: text
          - name: loaded_at
            data_type: timestamp with time zone
      - name: ssb_06083
