            data_type: text
          - name: antall_ganger_code
            description: The degenerate topic slice this table reports; see the indicator model.
            data_type: text
          - name: soes_code
            description: FHI SOES — socioeconomic status.
            data_type: text
          - name: measure_type
            description: >-
              SMR (standardised ratio, 100 = national) or MEIS (FHI smoothed estimate). ⚠️ No TELLER
              and no RATE — Ungdata is a survey, so there is no count to publish.
            data_tests: [not_null]
          - name: value
            description: The measured value. NULL where FHI suppressed the cell.
          - name: status
            description: FHI suppression marker.
          - name: loaded_at
            description: When the ingest wrote the row.
            data_tests: [not_null]
