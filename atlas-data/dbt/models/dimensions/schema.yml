version: 2
models:
  - name: dim_kommune
    description: |
      Canonical kommune dimension. One row per active 4-digit kommune code.
      Sourced from SSB Klass classification 131. All marts-level indicators
      that reference a kommune join to this table via kommune_nr.
    columns:
      - name: kommune_nr
        description: 4-digit zero-padded kommune code, SSB canonical form (e.g. '0301' = Oslo).
        data_tests:
          - not_null
          - unique
      - name: kommune_name
        description: Kommune name in bokmål; Sámi variant (if any) is stripped into 
          kommune_name_sami.
        data_tests: [not_null]
      # ⚠️ dimensions/schema.yml documented a `kommune_name_sami` column here
      # until 2026-09-19. dim_kommune.sql has never emitted one — the Sámi
      # variant is what kommune_name_alt carries, split out of upstream's
      # "Name - Nama" string. A documented column that does not exist is not
      # inert: I wrote a published api_v1 wrapper against it and Postgres
      # rejected the model (urb-agents #1255). schema.yml documents; the SQL
      # defines. Check the SQL.
      - name: kommune_name_alt
        description: |
          Alternative name variant from Klass when distinct from
          kommune_name (typically a Sámi or Kven form before the Sámi
          variant gets normalised into kommune_name_sami). NULL when
          there is no alternative.
      - name: fylke_nr
        description: 2-digit fylke code, derived from the first two digits of kommune_nr.
        data_tests:
          - not_null
      - name: notes
        description: >-
          Verbatim notes from Klass — historical boundary changes, Sámi name details, etc. Not for user
          display.
      - name: updated_at
        description: When the row was last loaded from upstream.
        data_tests: [not_null]
      - name: valid_from
        description: >-
          Date from which this kommune code is valid. NULL in a codesAt snapshot (means 'active at the
          snapshot date').
      - name: valid_to
        description: Date at which this code becomes inactive. NULL = still active.
      - name: is_active
        description: 'Convenience boolean: true when valid_to is null or in the future.'
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
  - name: dim_fylke
    description: |
      Canonical fylke dimension. 16 rows: 15 real fylker + residual '99 Uoppgitt'.
      Sourced from SSB Klass classification 104.
    columns:
      - name: fylke_nr
        description: 2-digit zero-padded fylke code (e.g. '03' = Oslo).
        data_tests:
          - not_null
          - unique
      - name: fylke_name
        description: Fylke name in bokmål. Multi-variant Sámi/Kven names are split into 
          fylke_name_alt.
        data_tests: [not_null]
      - name: fylke_name_alt
        description: >-
          Everything after the first ' - ' in the upstream name — typically one or more Sámi/Kven variants.
          NULL for fylker without alt names.
      - name: notes
        description: Verbatim notes from Klass.
      - name: updated_at
        description: When the row was last loaded from upstream.
        data_tests: [not_null]
      - name: valid_from
        description: Date from which this fylke code is valid. NULL in a codesAt snapshot.
      - name: valid_to
        description: Date at which this code becomes inactive. NULL = still active.
      - name: is_active
        description: True when valid_to is null or in the future.
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: length(fylke_nr) = 2

  - name: crosswalk_kommune_name
    description: |
      Name → kommune_nr lookup for resolving free-text municipality strings
      (NGO branch addresses, scrapes, upstream sources that publish names
      not codes) to a canonical kommune_nr.

      Derived from dim_kommune; not a seed. Three views unioned:
        canonical    — every active kommune's bokmål name
        alternative  — Sami variants where dim_kommune carries kommune_name_alt
        historical   — pre-2020-reform names from inactive kommune codes;
                       kommune_nr points to the OLD code, not the merged-into
                       successor (v1 limitation).

      Norwegian place names collide ("Os" was both Os/Innlandet and
      Os/Hordaland pre-2020); the lookup is intrinsically not unique by name.
      Consumers handling ambiguous matches must apply additional context
      (postal code, fylke).
    columns:
      - name: name
        description: The free-text municipality name to resolve.
        data_tests: [not_null]
      - name: name_kind
        description: >-
          Where this name comes from: canonical (current), alternative (Sami variant), or historical (pre-merger).
        data_tests:
          - not_null
          - accepted_values: {values: [canonical, alternative, historical]}
      - name: kommune_nr
        description: >-
          Resolved kommune_nr. For historical rows this is the OLD code, not the modern successor. Both
          active and historical codes appear; relationships test passes against dim_kommune which carries
          both.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_kommune'), field: kommune_nr}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [name, name_kind, kommune_nr]

  - name: dim_chapter
    description: |
      Conformed chapter dimension across all ingested NGOs. One row per chapter
      at any organisational level. UNION of supply__<ngo_slug>_branches
      staging models; PLAN-002 lands the first (Red Cross). Coverage-gap and
      "find providers near me" queries filter to chapter_level = 'local' AND
      is_active = true (per Q44 + Q48 of INVESTIGATE-ngo-supply-data-model).
    columns:
      - name: chapter_id
        description: Composite slug, namespaced by NGO. Stable across refreshes.
        data_tests: [not_null, unique]
      - name: ngo_orgnr
        description: FK to dim_ngo.orgnr.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_ngo'), field: orgnr}
      - name: chapter_level
        description: national / regional / local per Q46. Coverage-gap supply queries filter to 
          local.
        data_tests:
          - not_null
          - accepted_values: {values: [national, regional, local]}
      - name: parent_chapter_id
        description: >-
          Self-FK to chapter_id (e.g. local → regional → national). NULL for top-level (national) and
          orphan (Ukjent) rows.
        data_tests:
          - relationships:
              to: ref('dim_chapter')
              field: chapter_id
              config: {where: parent_chapter_id is not null}
      - name: chapter_orgnr
        description: >-
          Brreg orgnr if the chapter is separately registered (e.g. Red Cross local branches each have
          their own). NULL otherwise.
      - name: name
        description: |
          Display name for the chapter, verbatim from upstream (Red
          Cross's localBranchName etc.). Not normalised — preserves
          casing, diacritics, and embedded NGO prefixes if upstream
          publishes them.
        data_tests: [not_null]
      - name: kommune_nr
        description: >-
          Resolved via dim_postnummer. NULL for branches that span multiple kommuner (regional, national).
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config: {severity: warn}
      - name: is_active
        description: |
          Whether the chapter is currently operational. False for
          dormant or merged chapters that upstream still publishes for
          historical continuity. Coverage-gap supply queries filter to
          is_active = true.
        data_tests:
          - not_null
          - accepted_values: {values: [true, false]}
      - name: postal_address_line1
        description: |
          Street address (first line). Used together with postal_code +
          post_office to resolve to a kommune_nr via dim_postnummer.
          NULL for chapters that don't publish a physical address.
      - name: postal_code
        description: |
          4-digit Norwegian postal code (postnummer), leading zeros
          preserved. Drives the kommune_nr resolution; FK to
          dim_postnummer.
      - name: post_office
        description: Post-office name, ALLCAPS as published by Bring.
      - name: phone
        description: |
          Public contact phone number for the chapter, verbatim from
          upstream (no normalisation, may include country code or local
          formatting). NULL when not published.
      - name: email
        description: |
          Public contact email for the chapter. NULL when not published.
          Not validated for RFC compliance.
      - name: web
        description: |
          Public website URL for the chapter. NULL when not published.
          May be a chapter sub-page on the NGO's national site rather
          than a dedicated domain.
      - name: chapter_subtype
        description: |
          Optional subtype for non-geographic or structurally distinct chapters.
          NULL = normal geographic chapter. Vocabulary (free-text in v1):
          'youth-political' (e.g. NF Solidaritetsungdom), 'youth-health' (NF
          Sanitetsungdom when separately registered, RC RØFF), 'student' (NF
          Studentgruppe), 'hospital' (NF Sanitet Haukeland), 'umbrella' (NF
          Sentralt). Promoted to an accepted_values test once 3+ NGOs populate
          it consistently (per INVESTIGATE-multi-ngo-supply-model-extensions Q1).
      - name: updated_at
        description: When the row was last loaded from the upstream supply staging model.
        data_tests: [not_null]
  - name: dim_activity
    description: |
      Activity catalog — one row per (NGO, NGO-canonical activity name).
      Replaces the originally-proposed crosswalk_activity_to_category table
      (per Q22 of INVESTIGATE-ngo-supply-data-model). Carries
      service_category_code directly; cross-NGO Coverage-gap queries pivot
      on this column. Per-NGO reporting pivots on canonical_name.

      Built by SELECT DISTINCT from per-NGO supply__<ngo>_branch_activities
      filtered to is_service = true. PLAN-002 lands the first staging model
      (Red Cross). PLAN-003 will UNION ALL Folkehjelp.
    columns:
      - name: activity_id
        description: |
          Composite slug, namespaced by NGO (e.g.
          'redcross-besokstjeneste'). Stable across refreshes. Unique
          within this table.
        data_tests: [not_null, unique]
      - name: ngo_orgnr
        description: |
          9-digit Brreg organisasjonsnummer of the NGO that owns the
          activity. FK to dim_ngo.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_ngo'), field: orgnr}
      - name: canonical_name
        description: Red Cross's globalActivityName, verbatim.
        data_tests: [not_null]
      - name: service_category_code
        description: >-
          From the 50→22 CASE WHEN. NULL only if a new globalActivityName appeared in raw that the CASE
          doesn't cover (catches drift loudly via the not_null filter applied at dim_activity/fact_chapter_activities
          — those filter is_service = true; a new unmapped service-type activity would still be is_service
          = true with NULL category, surfacing the gap).
        data_tests:
          - not_null
          - relationships: {to: ref('ref_atlas_service_category'), field: code}
      - name: is_active
        description: |
          Whether this NGO still offers the activity. False for retired
          activities kept in the catalog so historical
          fact_chapter_activities rows can still resolve activity_id.
        data_tests:
          - not_null
          - accepted_values: {values: [true, false]}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ngo_orgnr, canonical_name]
  - name: dim_brreg_enhet
    description: |
      Current state of every organisation registered in Norway — the whole of
      Brønnøysundregistrene's Enhetsregisteret, ~1.17M rows, reconciled from the
      bulk snapshot (PLAN-001) plus the change feed (PLAN-002).

      🔴 Deleted organisations are FILTERED OUT here, not deleted anywhere. The
      tombstone rows stay in raw.brreg_enheter_versions, so "what did this
      organisation look like before it was removed" is still answerable.
      Deletions are 8.0% of change traffic and arrive only through the feed — a
      bulk file cannot express one.

      Typing is selective: the columns below are what Atlas queries, and the
      other ~35 upstream fields stay available in `doc` rather than being
      flattened into columns nobody selected.
    columns:
      - name: organisasjonsnummer
        description: >-
          Nine-digit Norwegian organisation number, and the natural key. Text, never a number —
          leading zeros are significant. Stable for the life of the organisation and retained after
          deletion, which is what makes it a safe join key across every Norwegian source.
        data_tests:
          - not_null
          - unique
      - name: navn
        description: Registered name of the organisation, verbatim from Brreg.
        data_tests: [not_null]
      - name: organisasjonsform_kode
        description: >-
          Legal form code, e.g. AS (aksjeselskap), FLI (forening/lag/innretning), STI (stiftelse),
          ENK (enkeltpersonforetak). The usual filter for "is this a company or an association".
        data_tests: [not_null]
      - name: organisasjonsform_beskrivelse
        description: Human-readable Norwegian label for organisasjonsform_kode, as Brreg publishes it.
      - name: naeringskode1_kode
        description: >-
          Primary NACE industry code (SN2007), e.g. 94.992. The route to an ICNPO-style classification
          for organisations that are NOT in Frivillighetsregisteret; those that are carry the
          registrant's own icnpoKategorier instead, which is better evidence. Null for ~2% of records.
      - name: kommune_nr
        description: >-
          Kommune code of the registered business address (forretningsadresse.kommunenummer). ⚠️ Joins
          to dim_kommune with severity warn, not error — some codes will not resolve, which is the same
          family of pseudo-region codes as INVESTIGATE-ssb-pseudo-regions and is an open question with
          Terje. Null where the organisation has no registered business address (~6% of records).
        data_tests:
          # 🔴 warn, not error, and deliberately so. Some codes will not resolve —
          # historical kommune numbers on organisations registered before a merger,
          # and the same family of pseudo-region codes as the 47 in
          # INVESTIGATE-ssb-pseudo-regions. That question is open with Terje
          # (urb-agents #700), so failing the build here would either stop the
          # pipeline on a known-open question or push someone into inventing an
          # answer. A warn counts them and leaves the decision where it belongs.
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
      - name: antall_ansatte
        description: >-
          Registered employee count. ⚠️ NULL MEANS "NOT REPORTED", NOT ZERO — the field is present on
          only ~4% of records. Reading NULL as 0 understates staffed organisations by a wide margin;
          use har_registrert_antall_ansatte to tell the two apart.
      - name: har_registrert_antall_ansatte
        description: >-
          Whether Brreg holds a registered employee count at all. Present on 100% of records, and the
          only way to distinguish "zero employees" from "no figure reported".
        data_tests: [not_null]
      - name: konkurs
        description: Whether the organisation is in bankruptcy proceedings. Straight from Brreg.
        data_tests: [not_null]
      - name: under_avvikling
        description: Whether the organisation is being wound up voluntarily. Straight from Brreg.
        data_tests: [not_null]
      - name: under_tvangsavvikling
        description: >-
          Whether the organisation is under compulsory winding-up or dissolution
          (underTvangsavviklingEllerTvangsopplosning). Straight from Brreg.
        data_tests: [not_null]
      - name: registrert_i_frivillighetsregisteret
        description: >-
          Whether the organisation is in Frivillighetsregisteret, the voluntary-organisation register.
          True for ~72,798 of the register. 🟢 This flag is what makes the NGO population DERIVED
          rather than curated — Atlas stops asking "which of these 11 organisations" and starts asking
          "which organisations". It needs no second API call: it is on 100% of bulk records.
        data_tests: [not_null]
      - name: registrert_dato
        description: Date the organisation was entered in Enhetsregisteret (registreringsdatoEnhetsregisteret).
      - name: icnpo_nummer
        description: >-
          Primary ICNPO code from Frivillighetsregisteret, e.g. "9100" — the registrant's own
          classification of itself, which is better evidence than one derived from a NACE code. Null
          for the ~94% of the register not in Frivillighetsregisteret, and for members who declare
          none. ⚠️ Null here does NOT mean "not voluntary": use
          registrert_i_frivillighetsregisteret for that.
      - name: icnpo_kategori
        description: >-
          Primary ICNPO category label paired with icnpo_nummer, e.g.
          "ICNPOKategori.internasjonaleOrganisasjoner".
      - name: grasrotandel_deltar_i
        description: >-
          Whether the organisation participates in Grasrotandelen, Norsk Tipping's grassroots funding
          scheme. From Frivillighetsregisteret; null for organisations not in it.
      - name: frivillig_innfoert_dato
        description: >-
          Date the organisation was entered in Frivillighetsregisteret. Distinct from registrert_dato,
          which is its Enhetsregisteret entry — an organisation exists for years before registering as
          voluntary, and comparing the two is the point of keeping both.
      - name: is_active
        description: >-
          Convenience boolean — true when the organisation is not in konkurs, avvikling or
          tvangsavvikling. ⚠️ Means "trading", not "exists": all three states are still registered and
          still answer from Brreg. Consumers who want everything registered should ignore this column
          rather than expect it to mean something else.
        data_tests: [not_null]
      - name: last_endringstype
        description: >-
          The type of the most recent change the feed reported for this organisation — Ny, Endring or
          Ukjent. Never Sletting or Fjernet: those rows are filtered out of current state. Null for an
          organisation the feed has not touched since the snapshot.
      - name: last_oppdateringsid
        description: >-
          Brreg's change id for that most recent change, or null if none. ⚠️ Ids are SPARSE — never
          subtract two of them and read the result as a number of changes.
      - name: snapshot_file_date
        description: >-
          Date of the bulk file this organisation was first loaded from, or null for one the feed saw
          before any snapshot did. Provenance of the transfer, not of the organisation.
      - name: snapshot_loaded_at
        description: >-
          When the BULK LOADER last wrote this organisation into raw.brreg_enheter_snapshot; null for
          an organisation the change feed saw before any snapshot did. Deliberately narrower than
          last_seen_at, which mixes both writers: this model's incremental predicate reads the maximum
          of THIS column to decide what the bulk loader has written since the dimension last applied a
          snapshot, and a column the feed could advance would skip real snapshot rows. Internal — not
          carried into mart_brreg_enhet, so it is not part of the api_v1 contract.
      - name: last_seen_at
        description: >-
          When the INGEST last wrote this organisation into raw, from either the snapshot load or a
          feed run. Pair it with reconciled_at — this is the raw clock, that is the marts clock.
        data_tests: [not_null]
      - name: reconciled_at
        description: >-
          When the TRANSFORM last reconciled this organisation into marts — dbt's own timestamp for
          the build that wrote the row. 🔴 The second of two clocks, and the gap between them is real:
          the change feed polls every half hour and this reconciliation follows ten minutes behind it,
          so raw can be minutes fresh while marts is older. Without both, "current" means different
          things depending on which table you read — which is how an install sat 13.5 hours behind
          Brreg with every check green. ⚠️ On an incremental run only the organisations that changed
          get a new value; a row untouched since Tuesday genuinely was last reconciled on Tuesday, and
          stamping it with today's build time would assert a freshness it does not have.
        data_tests: [not_null]
      - name: doc
        description: >-
          The full upstream Enhet document, verbatim. ⚠️ As of 2026-09-24 almost every field Brreg
          publishes is also a typed column here — Terje's instruction was "extract all fields
          properly in the first place" (urb-agents #1457). `doc` remains the verbatim record and the
          only place a NEWLY-introduced upstream field appears before anyone adds a column for it.
          🔵 The key set was enumerated with jsonb_object_keys on 2026-09-24 and returned 64 keys;
          three sampled attempts before it returned 57, 59 and 61, all floors.
        data_tests: [not_null]
      - name: epostadresse
        description: >-
          Email address the organisation registered with Brreg. Present on 324,967 of 1,175,334
          rows (27.65%), counted 2026-09-24.
      - name: mobil
        description: >-
          Mobile number registered with Brreg. Present on 308,989 of 1,175,334 rows (26.29%),
          counted 2026-09-24.
      - name: telefon
        description: >-
          Telephone number registered with Brreg. Present on 194,520 of 1,175,334 rows (16.55%),
          counted 2026-09-24.
      - name: hjemmeside
        description: >-
          Website the organisation registered with Brreg. Present on 114,075 of 1,175,334 rows
          (9.71%), counted 2026-09-24.
      - name: registrert_i_mvaregisteret
        description: >-
          Whether the organisation is registered in mvaregisteret. Present on 1,175,334 of
          1,175,334 rows (100.00%), counted 2026-09-24.
      - name: registrert_i_foretaksregisteret
        description: >-
          Whether the organisation is registered in foretaksregisteret. Present on 1,175,334 of
          1,175,334 rows (100.00%), counted 2026-09-24.
      - name: registrert_i_stiftelsesregisteret
        description: >-
          Whether the organisation is registered in stiftelsesregisteret. Present on 1,175,334
          of 1,175,334 rows (100.00%), counted 2026-09-24.
      - name: registrert_i_partiregisteret
        description: >-
          Whether the organisation is registered in partiregisteret. Present on 1,175,334 of
          1,175,334 rows (100.00%), counted 2026-09-24.
      - name: er_i_konsern
        description: >-
          Whether Brreg records the organisation as part of a group (konsern). Present on
          1,175,334 of 1,175,334 rows (100.00%), counted 2026-09-24.
      - name: stiftelsesdato
        description: >-
          Date Brreg records for this event. Present on 676,822 of 1,175,334 rows (57.59%),
          counted 2026-09-24.
      - name: vedtektsdato
        description: >-
