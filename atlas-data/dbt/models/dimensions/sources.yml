version: 2
sources:
  - name: raw
    schema: raw
    tables:
      - name: kartverket_postnummeromrade
        description: |
          Kartverket's Postnummerområder, verbatim, one row per upstream GeoJSON
          feature. Source for dim_kartverket_postnummeromrade. Populated by
          atlas-data/ingest/src/sources/kartverket-postnummeromrade. urb-agents
          #2098/#2099 (R3).
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 60, period: day}
          error_after: {count: 180, period: day}
        columns:
          - name: lokalid
            description: Kartverket's own feature-local GUID. Primary key.
            data_tests: [not_null, unique]
          - name: postnummer
            description: 4-digit postcode. Not unique — a postnummer with disjoint polygon pieces is more than one row.
            data_tests: [not_null]
          - name: poststed
            description: Post office name, verbatim from Kartverket/Posten.
            data_tests: [not_null]
          - name: kommune_nr
            description: 4-digit kommune code for this specific polygon piece.
            data_tests: [not_null]
          - name: oppdateringsdato
            description: This feature's own last-update date, where published. Null on most rows.
          - name: versjonid
            description: Kartverket's own version id for this feature.
          - name: geometry
            description: The polygon, verbatim, EPSG:4258.
            data_tests: [not_null]
          - name: loaded_at
            description: When Atlas fetched this row.
            data_tests: [not_null]
      - name: bring_postnummer
        description: |
          Posten Bring's postcode register, verbatim, including kategori.
          Source for dim_bring_postnummer. Populated by
          atlas-data/ingest/src/sources/bring-postnummer. urb-agents
          #2098/#2099 (R2).
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: weekly
        freshness:
          warn_after: {count: 120, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: postnummer
            description: 4-digit postcode, leading zeros significant.
            data_tests: [not_null, unique]
          - name: poststed
            description: Post office name, verbatim from Bring.
            data_tests: [not_null]
          - name: kommune_nr
            description: 4-digit kommune code, Bring's own numbering.
            data_tests: [not_null]
          - name: kommune_navn
            description: Kommune name as Bring's file carries it. Not the source of truth — dim_kommune is.
            data_tests: [not_null]
          - name: kategori
            description: "G gateadresse, P postboks, B both, S service, F flere."
            data_tests:
              - not_null
              - accepted_values:
                  values: ["G", "P", "B", "S", "F"]
          - name: loaded_at
            description: When Atlas fetched this row — Bring's file has no Last-Modified header.
            data_tests: [not_null]
      - name: ssb_klass_kommuner
        description: |
          SSB Klass classification 131 (Kommuner) — full history from 1960.
          One row per (code, valid_from_in_range) — a single code has
          multiple rows when it was renamed or had a boundary change.
          Source for dim_kommune. Populated by
          atlas-data/ingest/src/sources/ssb-klass-kommuner.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: code
            description: >-
              4-digit kommune code, e.g. '0301' (Oslo). Not unique: a code can appear multiple times with
              different validity windows.
            data_tests: [not_null]
          - name: name
            description: Kommune name (bokmål), sometimes with Sámi variant.
            data_tests: [not_null]
          - name: parent_code
            data_type: text
          - name: level
            data_type: text
          - name: short_name
            data_type: text
          - name: valid_from
            data_type: date
          - name: valid_to
            data_type: date
          - name: valid_from_in_range
            description: Start of this validity window within the ingest's date range.
            data_tests: [not_null]
          - name: valid_to_in_range
            data_type: date
          - name: notes
            data_type: text
          - name: loaded_at
            data_type: timestamp with time zone
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [code, valid_from_in_range]

      - name: ssb_klass_fylker
        description: |
          SSB Klass classification 104 (Fylker) — full history from 1960.
          One row per (code, valid_from_in_range). Source for dim_fylke.
          Populated by atlas-data/ingest/src/sources/ssb-klass-fylker.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: code
            description: '2-digit fylke code. Not unique: see ssb_klass_kommuner notes.'
            data_tests: [not_null]
          - name: name
            description: Fylke name (bokmål), sometimes with multi-variant Sámi/Kven names separated
              by ' - '.
            data_tests: [not_null]
          - name: parent_code
            data_type: text
          - name: level
            data_type: text
          - name: short_name
            data_type: text
          - name: valid_from
            data_type: date
          - name: valid_to
            data_type: date
          - name: valid_from_in_range
            data_tests: [not_null]
          - name: valid_to_in_range
            data_type: date
          - name: notes
            data_type: text
          - name: loaded_at
            data_type: timestamp with time zone
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [code, valid_from_in_range]
