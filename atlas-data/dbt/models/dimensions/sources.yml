version: 2
sources:
  - name: raw
    schema: raw
    tables:
      - name: kartverket_kommune
        description: |
          Kartverket's current municipality boundaries, verbatim, one row per kommune.
          Source for dim_kartverket_kommune. Populated by
          atlas-data/ingest/src/sources/kartverket-kommune. urb-agents #2098/#2099 (R4).
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 120, period: day}
          error_after: {count: 360, period: day}
        columns:
          - name: kommune_nr
            description: 4-digit kommune code. Primary key.
            data_tests: [not_null, unique]
          - name: kommune_navn
            description: The primary (rekkefolge=1) name, always Norwegian in the measured snapshot.
            data_tests: [not_null]
          - name: names
            description: Every official name as a jsonb array of {navn, rekkefolge, sprak}.
            data_tests: [not_null]
          - name: gyldig_fra
            description: Date this kommune boundary became valid.
          - name: gyldig_til
            description: Date this kommune boundary stopped being valid. Null in every row of a whole-country pull.
          - name: geometry
            description: The boundary, verbatim, EPSG:4258, full resolution.
            data_tests: [not_null]
          - name: loaded_at
            description: When Atlas fetched this row.
            data_tests: [not_null]
      - name: kartverket_fylke
        description: |
          Kartverket's current county boundaries, verbatim, one row per fylke.
          Source for dim_kartverket_fylke. Populated by
          atlas-data/ingest/src/sources/kartverket-fylke. urb-agents #2098/#2099 (R4).
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 120, period: day}
          error_after: {count: 360, period: day}
        columns:
          - name: fylke_nr
            description: 2-digit fylke code. Primary key.
            data_tests: [not_null, unique]
          - name: fylke_navn
            description: The combined display name, as Kartverket's own fylkesnavn field carries it.
            data_tests: [not_null]
          - name: names
            description: Every official name as a jsonb array of {navn, rekkefolge, sprak}.
            data_tests: [not_null]
          - name: gyldig_fra
            description: Date this fylke boundary became valid.
          - name: gyldig_til
            description: Date this fylke boundary stopped being valid. Null in every row of a whole-country pull.
          - name: geometry
            description: The boundary, verbatim, EPSG:4258, full resolution.
            data_tests: [not_null]
          - name: loaded_at
            description: When Atlas fetched this row.
            data_tests: [not_null]
      - name: kartverket_postnummeromrade
        description: |
          Kartverket's Postnummerområder, verbatim, one row per upstream GeoJSON
          feature. Source for dim_kartverket_postnummeromrade. Populated by
          atlas-data/ingest/src/sources/kartverket-postnummeromrade. urb-agents
          #2098/#2099 (R3).
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 60, period: day}
          error_after: {count: 180, period: day}
        columns:
          - name: lokalid
            description: Kartverket's own feature-local GUID. Primary key.
            data_tests: [not_null, unique]
          - name: postnummer
            description: 4-digit postcode. Not unique — a postnummer with disjoint polygon pieces is more than one row.
            data_tests: [not_null]
          - name: poststed
            description: Post office name, verbatim from Kartverket/Posten.
            data_tests: [not_null]
          - name: kommune_nr
            description: 4-digit kommune code for this specific polygon piece.
            data_tests: [not_null]
          - name: oppdateringsdato
            description: This feature's own last-update date, where published. Null on most rows.
          - name: versjonid
            description: Kartverket's own version id for this feature.
          - name: geometry
            description: The polygon, verbatim, EPSG:4258.
            data_tests: [not_null]
          - name: loaded_at
            description: When Atlas fetched this row.
            data_tests: [not_null]
      - name: bring_postnummer
        description: |
          Posten Bring's postcode register, verbatim, including kategori.
          Source for dim_bring_postnummer. Populated by
          atlas-data/ingest/src/sources/bring-postnummer. urb-agents
          #2098/#2099 (R2).
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: weekly
        freshness:
          warn_after: {count: 120, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: postnummer
            description: 4-digit postcode, leading zeros significant.
            data_tests: [not_null, unique]
          - name: poststed
            description: Post office name, verbatim from Bring.
            data_tests: [not_null]
          - name: kommune_nr
            description: 4-digit kommune code, Bring's own numbering.
            data_tests: [not_null]
          - name: kommune_navn
            description: Kommune name as Bring's file carries it. Not the source of truth — dim_kommune is.
            data_tests: [not_null]
          - name: kategori
            description: "G gateadresse, P postboks, B both, S service, F flere."
            data_tests:
              - not_null
              - accepted_values:
                  values: ["G", "P", "B", "S", "F"]
          - name: loaded_at
            description: When Atlas fetched this row — Bring's file has no Last-Modified header.
            data_tests: [not_null]
      - name: kartverket_matrikkel_adresse
        description: >-
          Kartverket's Matrikkelen address file, ~2.6M rows, stored verbatim as jsonb (46 upstream
          columns; this request's field list uses a dozen). Source for
          dim_kartverket_matrikkel_adresse. Loaded by
          atlas-data/ingest/src/sources/kartverket-matrikkel-adresse. urb-agents #2098/#2099 (R5).
          Not indexed on doc, same reasoning as brreg_enheter_snapshot.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: adresse_id
            description: Kartverket's adresseId, confirmed identical to the CSV's own lokalid. Primary key.
            data_tests: [not_null, unique]
          - name: doc
            data_type: jsonb
            description: Every column of the upstream CSV row, verbatim, keyed by the upstream's own header names.
            data_tests: [not_null]
          - name: loaded_at
            description: When Atlas fetched this row.
            data_tests: [not_null]
      - name: ssb_klass_kommuner
        description: |
          SSB Klass classification 131 (Kommuner) — full history from 1960.
          One row per (code, valid_from_in_range) — a single code has
          multiple rows when it was renamed or had a boundary change.
          Source for dim_kommune. Populated by
          atlas-data/ingest/src/sources/ssb-klass-kommuner.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: code
            description: >-
              4-digit kommune code, e.g. '0301' (Oslo). Not unique: a code can appear multiple times with
              different validity windows.
            data_tests: [not_null]
          - name: name
            description: Kommune name (bokmål), sometimes with Sámi variant.
            data_tests: [not_null]
          - name: parent_code
            data_type: text
          - name: level
            data_type: text
          - name: short_name
            data_type: text
          - name: valid_from
            data_type: date
          - name: valid_to
            data_type: date
          - name: valid_from_in_range
            description: Start of this validity window within the ingest's date range.
            data_tests: [not_null]
          - name: valid_to_in_range
            data_type: date
          - name: notes
            data_type: text
          - name: loaded_at
            data_type: timestamp with time zone
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [code, valid_from_in_range]

      - name: ssb_klass_fylker
        description: |
          SSB Klass classification 104 (Fylker) — full history from 1960.
          One row per (code, valid_from_in_range). Source for dim_fylke.
          Populated by atlas-data/ingest/src/sources/ssb-klass-fylker.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 400, period: day}
        columns:
          - name: code
            description: '2-digit fylke code. Not unique: see ssb_klass_kommuner notes.'
            data_tests: [not_null]
          - name: name
            description: Fylke name (bokmål), sometimes with multi-variant Sámi/Kven names separated
              by ' - '.
            data_tests: [not_null]
          - name: parent_code
            data_type: text
          - name: level
            data_type: text
          - name: short_name
            data_type: text
          - name: valid_from
            data_type: date
          - name: valid_to
            data_type: date
          - name: valid_from_in_range
            data_tests: [not_null]
          - name: valid_to_in_range
            data_type: date
          - name: notes
            data_type: text
          - name: loaded_at
            data_type: timestamp with time zone
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [code, valid_from_in_range]
