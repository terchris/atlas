version: 2
sources:
  - name: raw
    description: >-
      raw.* schema — shared infrastructure tables written by the scraping library (atlas-data/ingest/src/lib/scraping/)
      and consumed across all scraper sources.
    schema: raw
    tables:
      - name: ingest_runs
        description: >-
          One row per ingest invocation (scraper or API-source). Populated by ingest_runs.ts. The partial
          unique index raw_ingest_runs_one_inprogress_per_source enforces at most one in-progress run
          per source_slug — concurrent-run lock per INVESTIGATE-ngo-scraping-infrastructure §E.3.1. Feeds
          marts.mart_ingest_health.
        loaded_at_field: finished_at
        meta:
          ingest_cadence: none
          cadence_note: >-
            Run-history bookkeeping written by the scraping library, not an ingested source.
            Its finished_at is green only while other ingests happen to run, which is luck
            rather than a cadence.
        columns:
          - name: run_id
            data_type: bigint
          - name: source_slug
            data_type: text
          - name: started_at
            data_type: timestamp with time zone
          - name: finished_at
            data_type: timestamp with time zone
          - name: exit_code
            data_type: integer
          - name: rows_scraped
            data_type: integer
          - name: rows_parsed
            data_type: integer
          - name: rows_skipped
            data_type: integer
          - name: warnings_count
            data_type: integer
          - name: errors_count
            data_type: integer
          - name: notes
            data_type: text
          - name: upstream_updated_at
            data_type: timestamp with time zone
      - name: sitemap_log
        description: >-
          Per-URL discovery log, one row per (source_slug, url) across all scraping sources. Stores sitemap
          <lastmod> (NULL for HTML-index sources) and first/last seen timestamps. Drives fetch-skip and
          orphan detection per INVESTIGATE-ngo-scraping-infrastructure §C.2.
        loaded_at_field: last_seen_at
        meta:
          ingest_cadence: none
          cadence_note: >-
            Per-URL discovery log written by the scraping library, not an ingested source. Its
            last_seen_at moves as a side effect of other sources' fetches, so asserting an
            ingest cadence on it is a category error.
        columns:
          - name: source_slug
            data_type: text
          - name: url
            data_type: text
          - name: lastmod
            data_type: timestamp with time zone
          - name: first_seen_at
            data_type: timestamp with time zone
          - name: last_seen_at
            data_type: timestamp with time zone
      - name: brreg_frivillige
        description: >-
          Frivillighetsregisteret — the ~72,800 organisations registered as voluntary, with the
          attributes Enhetsregisteret does not carry. Loaded by ingest/src/sources/brreg-frivillige.
          🔴 NOT the source of NGO membership: registrertIFrivillighetsregisteret is on 100% of
          Enhetsregisteret's records already. This table supplies icnpoKategorier — the registrant's
          own classification — plus grasrotandel, innfoertDato and vedtekter.
          ⚠️ This register has NO change feed and no bulk download (verified 2026-09-12), so it is
          re-walked in full each run.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: daily
        columns:
          - name: organisasjonsnummer
            data_type: text
          - name: icnpo_nummer
            data_type: text
          - name: icnpo_kategori
            data_type: text
          - name: doc
            data_type: jsonb
          - name: loaded_at
            data_type: timestamp with time zone
      - name: brreg_enheter_snapshot
        description: >-
          The complete Enhetsregisteret — every organisation registered in Norway, ~1.17M rows, stored
          verbatim as jsonb. Loaded by ingest/src/sources/brreg-enheter-alle from Brreg's daily bulk
          download (PLAN-001). Not indexed on doc: a GIN index was measured at +42% storage for an
          access pattern nothing uses. ⚠️ A bulk file cannot express a deletion, so removals arrive
          through brreg_enheter_versions, never by a row disappearing from here.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: manual
          cadence_note: >-
            Bootstrap only. Run once by hand via the brreg_bootstrap job; it has no automation
            condition on purpose, because re-running a bulk load against a populated database is the
            one genuinely destructive operation in this pipeline. Currency comes from the change feed.
        columns:
          - name: organisasjonsnummer
            data_type: text
          - name: doc
            data_type: jsonb
          - name: snapshot_file_date
            data_type: date
          - name: loaded_at
            data_type: timestamp with time zone
      - name: brreg_oppdateringer
        description: >-
          Append-only log of every change Brreg reported to Enhetsregisteret, one row per
          oppdateringsid. Loaded daily by ingest/src/sources/brreg-oppdateringer (PLAN-002).
          ⚠️ oppdateringsid is SPARSE — the gap between two ids is not the number of changes between
          them, so never compute a backlog by subtracting them.
        loaded_at_field: processed_at
        meta:
          ingest_cadence: daily
        columns:
          - name: oppdateringsid
            data_type: bigint
          - name: dato
            data_type: timestamp with time zone
          - name: organisasjonsnummer
            data_type: text
          - name: endringstype
            data_type: text
          - name: processed_at
            data_type: timestamp with time zone
          - name: process_status
            data_type: text
      - name: brreg_enheter_versions
        description: >-
          Append-only version history: each organisation's document as it stood at each change.
          The only place deletions are expressible — Sletting and Fjernet rows are tombstones, and
          marts.dim_brreg_enhet filters them out of current state rather than deleting anything.
          ⚠️ For a tombstone, doc is Brreg's six-key deletion stub and NOT a full Enhet: a deleted
          organisation still answers HTTP 200. Branch on endringstype.
        loaded_at_field: fetched_at
        meta:
          ingest_cadence: daily
        columns:
          - name: oppdateringsid
            data_type: bigint
          - name: organisasjonsnummer
            data_type: text
          - name: endringstype
            data_type: text
          - name: doc
            data_type: jsonb
          - name: fetched_at
            data_type: timestamp with time zone
      - name: brreg_enheter
        description: >-
          Cross-NGO Brreg Enhetsregister landing. Populated by ingest/src/seed-sources/brreg-enheter/
          which iterates every NGO in landscape.json that has a `brreg_query` block and upserts matching
          enheter into this shared table. Status columns (konkurs, under_avvikling, under_tvangsavvikling)
          come straight from Brreg; downstream 'active NGO' queries filter on those rather than expecting
          a synthetic is_active. See PLAN-001-brreg-enheter.
        loaded_at_field: loaded_at
        meta:
          ingest_cadence: monthly
        columns:
          - name: orgnr
            data_type: text
          - name: navn
            data_type: text
          - name: organisasjonsform
            data_type: text
          - name: registrert_dato
            data_type: date
          - name: i_frivillighetsreg
            data_type: boolean
          - name: antall_ansatte
            data_type: integer
          - name: konkurs
            data_type: boolean
          - name: under_avvikling
            data_type: boolean
          - name: under_tvangsavvikling
            data_type: boolean
          - name: raw_payload
            data_type: jsonb
          - name: loaded_at
            data_type: timestamp with time zone
