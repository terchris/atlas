version: 2
seeds:
  - name: ref_atlas_ngo_match_rule
    description: >-
      One row per federated NGO (dim_ngo.structure = 'federated'), transcribed verbatim from
      docs/research/ngo-research/ingestion-specs/brreg-chapter-matching.md's per-NGO rule table.
      Patterns are PRE-FOLDED (Æ/Ø/Å already written as plain letters, e.g. "RODE KORS" not
      "RØDE KORS") — int_ngo_chapter_registry_match folds the registry name the same way before
      comparing, via the fold_norwegian_for_matching macro. A pattern author writing a real Ø
      here would silently un-fold one side of the comparison.
    columns:
      - name: ngo_orgnr
        description: The NGO's own Brreg organisasjonsnummer — matches dim_ngo.orgnr.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_ngo')
              field: orgnr
      - name: ngo_slug
        data_tests: [not_null, unique]
      - name: include_pattern
        description: POSIX regex (already Æ/Ø/Å-folded) a candidate's folded name must match.
        data_tests: [not_null]
      - name: exclude_pattern
        description: >-
          POSIX regex excluding a different organisation that happens to share a word (e.g. plain
          SPEIDER matching KFUK-KFUM too). Empty in the CSV when the NGO needs none — which dbt's
          seed loader reads as NULL, not ''. A consumer comparing `exclude_pattern != ''` without
          coalescing first gets NULL for those rows, and a WHERE clause treats NULL like false,
          silently dropping every candidate row for that NGO regardless of include_pattern — a
          real bug this exact column caused in int_ngo_chapter_registry_match, fixed there with
          coalesce(exclude_pattern, ''), not by changing what this column contains.
      - name: strong_pattern
        description: >-
          A tighter regex than include_pattern — matching it alone is "medium" confidence (no site
          crawl exists yet to corroborate it to "high"); matching only include_pattern is "low".
        data_tests: [not_null]
      - name: website_host
        description: >-
          The NGO's own site host, used once a crawl exists to corroborate a strong name match to
          "high" confidence. Not yet load-bearing in int_ngo_chapter_registry_match alone.
        data_tests: [not_null]
  - name: ref_ssb_family_type
    description: SSB FamilieType labels for table 06083. 9 codes.
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        data_tests: [not_null]
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 9}

  - name: ref_ssb_household_type
    description: SSB HusholdType labels for table 06944. 5 codes.
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        data_tests: [not_null]
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 5}

  - name: ref_ssb_nivaa
    description: >-
      SSB Nivaa (NUS2000) education-level labels for table 09429. 7 codes; upstream order interleaves
      '11' (Fagskole) between '02a' and '03a'.
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        data_tests: [not_null]
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 7}

  - name: ref_fhi_utdann
    description: FHI UTDANN labels for tables 794 and 360 (parents' education). 5 codes. Norwegian 
      only.
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        description: |
          English label. NULL for every row in this seed — FHI does not
          publish English labels for UTDANN. The column is kept for
          shape parity with the SSB ref_* seeds.
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 5}

  - name: ref_fhi_innvkat
    description: >-
      FHI INNVKAT labels for table 360. Single-row seed today; future-proofed for additional immigration
      categories.
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        description: |
          English label. NULL in this seed — FHI does not publish
          English labels for INNVKAT. The column is kept for shape
          parity with the SSB ref_* seeds.
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 1}

  - name: ref_un_sdg
    description: >-
      The 17 UN Sustainable Development Goals. Hand-curated; pin once. The 169 sub-targets are deferred
      to a future ref_un_sdg_target seed.
    columns:
      - name: code
        description: SDG number as text ('1'–'17') for consistency with other ref_* seeds.
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        data_tests: [not_null]
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 17}

  - name: dim_postnummer
    description: >-
      Norwegian postnummer with primary kommune. ~5 122 rows. Source: Bring's weekly Postnummerregister
      (free TXT). Used to resolve upstream addresses (NGO branches, etc.) to a kommune_nr without name-matching
      ambiguity.
    columns:
      - name: postnummer
        description: 4-digit postal code, leading zeros preserved (e.g. 0150 Oslo).
        data_tests: [not_null, unique]
      - name: post_office
        description: Post-office name, ALLCAPS as published by Bring.
        data_tests: [not_null]
      - name: kommune_nr
        description: >-
          Primary kommune for the postnummer. A few postnummer span multiple kommuner; only the primary
          is recorded. Bring's file includes special extraterritorial codes (2100 Svalbard region, 2211
          Jan Mayen / offshore) that aren't in dim_kommune; the relationships test warns rather than errors.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 5500}

  - name: dim_ngo
    description: >-
      Atlas's NGO catalogue. One row per NGO. Source: hand-curated landscape.json under ingest/src/seed-sources/atlas-ngo-landscape/.
      v1 holds ~11 Tier A federations from docs/research/ngo-landscape.md; expanded as new NGOs ingest.
      orgnr is the Brreg primary key; slug is the URL-friendly identifier.
    columns:
      - name: orgnr
        description: >-
          9-digit Brreg organisasjonsnummer (legacy orgs may have leading zeros — preserved as text).
        data_tests:
          - not_null
          - unique
      - name: slug
        description: kebab-case identifier; URL-friendly (e.g. 'redcross', 'kirkens-bymisjon').
        data_tests:
          - not_null
          - unique
      - name: name
        description: Legal name from Brreg.
        data_tests: [not_null]
      - name: brand_name
        description: >-
          Common brand name when distinct from legal name (e.g. 'Sanitetskvinnene' vs N.K.S.). Empty if
          same as name.
      - name: website_url
        data_tests: [not_null]
      - name: tier
        description: Structural-fit tier from ngo-landscape.md.
        data_tests:
          - not_null
          - accepted_values:
              values: [A, B, B-minus, C-donor, C-petition, C-industry, C-quasigovernmental]
      - name: chapter_data_shape
        description: How this NGO's per-chapter activity data is shaped — drives ingest pattern.
        data_tests:
          - not_null
          - accepted_values:
              values: [api_canonical, cms_bins, programme_only, no_structure]
      - name: has_chapters
        description: True if NGO has chapters/lokallag/korps that ingest into dim_chapter.
        data_tests:
          - not_null
      - name: primary_focus
        description: Sector classification from ngo-landscape.md.
        data_tests:
          - not_null
          - accepted_values:
              values: [humanitarian, health, social, youth, environment, civic, patient_support, 
                    faith_adjacent, service_club]
      - name: icnpo_code_1
        description: >-
          Primary ICNPO code from Brreg Frivillighetsregister, ranked by activity scope. Empty in v1 —
          populated by future refresh:brreg-frivillighet enrichment.
        data_tests:
          - relationships:
              to: ref('ref_brreg_icnpo')
              field: code
              config: {where: icnpo_code_1 != ''}
      - name: icnpo_code_2
        data_tests:
          - relationships:
              to: ref('ref_brreg_icnpo')
              field: code
              config: {where: icnpo_code_2 != ''}
      - name: icnpo_code_3
        data_tests:
          - relationships:
              to: ref('ref_brreg_icnpo')
              field: code
              config: {where: icnpo_code_3 != ''}
      - name: structure
        description: >-
          How this NGO is registered at Brreg — federated (every local chapter its own legal
          entity, found via brreg-chapter-matching.md) or unitary (chapters are Brreg
          underenheter of one national entity, found via brreg-underenheter.md). Drives which of
          the two registry-matching methods applies; PLAN-001-brreg-chapter-matching-and-
          underenheter.md. 9 federated, 2 unitary (Frelsesarmeen, Kirkens Bymisjon) as of
          2026-10-05 — confirmed directly against Brreg's enheter/underenheter counts for each,
          not assumed from org type.
        data_tests:
          - not_null
          - accepted_values:
              values: [federated, unitary]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: length(orgnr) = 9
      - dbt_utils.expression_is_true:
          expression: slug = lower(slug)

  - name: ref_atlas_service_category
    description: >-
      Atlas's curated cross-NGO service-category vocabulary. 38 rows (grew from the original 22 on
      2026-10-06, INVESTIGATE-ngo-activity-taxonomy.md — every original code kept unchanged, 16
      added, built from the terms people actually search for). Each NGO's dim_activity row points at
      one category code; cross-NGO queries (Coverage-gap, 'find X near me') filter on category_code.
      See docs/research/ngo-research/taxonomy/ for the full evidence behind the labels and terms.
    columns:
      - name: code
        description: snake_case identifier; stable across seed updates.
        data_tests: [not_null, unique]
      - name: family_code
        description: Groups categories into one of 10 families (ref_activity_family). Added 2026-10-06.
        data_tests:
          - not_null
          - relationships: {to: ref('ref_activity_family'), field: code}
      - name: label_no
        description: Norwegian (bokmål) label suitable for UI display — now written to match what people search for, not just a category name.
        data_tests: [not_null]
      - name: label_en
        description: English label.
        data_tests: [not_null]
      - name: description
        description: One-line summary of what services in this category typically include, in English.
        data_tests: [not_null]
      - name: description_no
        description: The same summary in Norwegian (bokmål). Added 2026-10-06.
        data_tests: [not_null]
      - name: sort_order
        description: Row order in the source taxonomy (grouped by family). Not a measure of importance.
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 38}
      - name: search_terms_no
        description: >-
          Pipe-separated `term (volume_band)` pairs — real Google Keyword Planner search terms that
          find this category, Norwegian. Added 2026-10-06; loaded as proposed evidence, not reviewed
          row by row. Empty for categories with no measured search demand.
      - name: need_terms_no
        description: Same shape as search_terms_no, for terms describing the NEED rather than the service name (e.g. "ensomhet" for elderly_visiting). Added 2026-10-06.
      - name: volunteer_terms_no
        description: Same shape, for terms a prospective VOLUNTEER (not a service-seeker) would search. Added 2026-10-06.
      - name: terms_en
        description: English-language search terms, same evidence base as search_terms_no. Added 2026-10-06.
      - name: label_no_evidence
        description: The one or two anchor search terms (with volume) that justified this category's Norwegian label. Added 2026-10-06.
      - name: en_measured
        description: "'yes' if the English label/terms have their own independent search-volume measurement, 'no' if translated from the Norwegian evidence only. Added 2026-10-06."
        data_tests:
          - accepted_values: {values: ["yes", "no"]}
      - name: search_entry
        description: "'yes' if this category is a likely entry point for a site search feature, 'no', or 'merged' if it was folded into another category during curation. Added 2026-10-06."
        data_tests:
          - accepted_values: {values: ["yes", "no", "merged"]}
      - name: previous_label_no
        description: The label this category had before the 2026-10-06 taxonomy revision, where it changed. Empty for the 16 categories that are new, not renamed.

  - name: ref_activity_family
    description: >-
      The 10 families ref_atlas_service_category.family_code groups into. Added 2026-10-06,
      INVESTIGATE-ngo-activity-taxonomy.md.
    columns:
      - name: code
        data_tests: [not_null, unique]
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        data_tests: [not_null]
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 10}

  - name: ref_atlas_activity_crosswalk
    description: >-
      Maps each of the 11 NGOs' own named activities (500 distinct activity_id across 589 rows —
      many-to-many via is_primary, since one activity can serve two categories) to
      ref_atlas_service_category. Added 2026-10-06, INVESTIGATE-ngo-activity-taxonomy.md.
      🔴 UNREVIEWED: reviewed_by is empty on all 589 rows — loaded with confidence visible, per
      Terje's instruction ("publish what we have, we will improve on it later"), not blocked on
      review. 92 rows are LOW confidence. Drives supply__redcross_branch_activities.sql's
      service_category_code and is_service for Røde Kors only — the other 10 NGOs have no activity
      staging model in the warehouse yet, so their rows here are real and queryable but don't reach
      dim_activity this round.
    columns:
      - name: activity_id
        description: "'<ngo_slug>:<activity-slug>', the NGO's own activity identifier."
        data_tests: [not_null]
      - name: ngo
        description: NGO slug (matches dim_ngo.slug).
        data_tests:
          - not_null
          - relationships: {to: ref('dim_ngo'), field: slug}
      - name: name
        description: The activity's own display name, verbatim from the NGO (or from raw.redcross_branch_activities.global_activity_name for Røde Kors).
        data_tests: [not_null]
      - name: source_group
        description: Optional grouping label from the research process. Blank for 400 of 589 rows.
      - name: service_category_code
        description: Blank exactly when is_service = 'false' (29 rows) — a non-service activity has no category.
        data_tests:
          - relationships: {to: ref('ref_atlas_service_category'), field: code, config: {where: "service_category_code is not null"}}
      - name: is_primary
        description: "'true' for an activity's main category, 'false' for a secondary one, blank when is_service = 'false'. Text, not boolean — see dbt_project.yml's +column_types comment for why."
        data_tests:
          - accepted_values: {values: ["true", "false", ""]}
      - name: is_service
        description: "'true'/'false' as text, not boolean — see dbt_project.yml's +column_types comment."
        data_tests:
          - not_null
          - accepted_values: {values: ["true", "false"]}
      - name: atlas_case_code
        description: The old 22-code CASE value this activity mapped to before 2026-10-06, where traceable. Blank for 546 of 589 rows (new NGOs the old CASE never covered).
      - name: method
        description: Always 'RESEARCH_PROPOSED' today — every row is proposed, none is reviewed-and-confirmed yet.
        data_tests:
          - accepted_values: {values: ["RESEARCH_PROPOSED"]}
      - name: basis
        description: What the categorisation was derived from.
        data_tests:
          - accepted_values: {values: ["name", "description", "source_group", "atlas_case", "none"]}
      - name: confidence
        data_tests:
          - not_null
          - accepted_values: {values: ["HIGH", "MEDIUM", "LOW"]}
      - name: note
        description: Free-text reasoning. Blank for 165 of 589 rows.
      - name: reviewed_by
        description: Empty on every row today — see the model description's 🔴 note.
      - name: reviewed_at
        description: Empty on every row today — see the model description's 🔴 note.

  - name: ref_activity_search_term
    description: >-
      858 real, validated search terms (Google Keyword Planner volumes) behind the taxonomy's
      labels — what people actually search for. Added 2026-10-06, INVESTIGATE-ngo-activity-taxonomy.md.
      Loaded as evidence for a later search-index PLAN (the investigation's own Next Steps names
      it as separate work) — not wired into any published relation yet.
      ⚠️ `code` is not always a valid ref_atlas_service_category.code: 3 of its distinct values
      (_volunteering_general, women_migrant_network, violence_support) are a synthetic umbrella
      term, a category merged away during curation, and a rejected candidate, respectively —
      kept as evidence, not an FK. Deliberately no relationships test here.
    columns:
      - name: code
        description: Usually a ref_atlas_service_category.code — see the model description's ⚠️ note for the 3 exceptions.
        data_tests: [not_null]
      - name: term
        description: The literal search term, Norwegian.
        data_tests: [not_null]
      - name: intent
        description: What kind of term this is — a category label, a need, a volunteer-side term, an autocomplete suggestion, a raw discovery, or a term for something else entirely.
        data_tests:
          - not_null
          - accepted_values: {values: ["label", "need", "volunteer", "autocomplete", "discovered", "alternative"]}
      - name: band_mid
        description: Search-volume band midpoint (e.g. 500 means "100-1000/month").
      - name: other_meaning
        description: Set when the term has a common OTHER meaning search volume can't distinguish from this one (e.g. "sanitet" also means a medical kit). Blank for 840 of 858 rows.
      - name: round
        description: Which research pass measured this term (1-4). Later rounds filled gaps the earlier ones missed.
        data_tests:
          - not_null

  - name: ref_brreg_icnpo
    description: >-
      ICNPO categories from Brreg's Frivillighetsregister. 14 main groups + 32 subgroups = 46 rows (live
      as of 2026-04-23). Used both as a controlled vocabulary for ICNPO codes carried on dim_ngo and as
      a rollup axis for sector reporting (matches SSB's satellittregnskap categorisation).
    columns:
      - name: code
        description: ICNPO code. 1- or 2-digit codes are main groups; 4- or 5-digit codes are 
          subgroups.
        data_tests: [not_null, unique]
      - name: parent_code
        description: Parent main-group code for subgroups; empty string for main groups themselves.
        data_tests:
          - relationships:
              to: ref('ref_brreg_icnpo')
              field: code
              config:
                where: parent_code != ''
      - name: label_no
        data_tests: [not_null]
      - name: label_en
        description: Empty — Brreg publishes Norwegian only. Populate later if/when Brreg ships 
          English.
      - name: sort_order
        data_tests:
          - not_null
          - unique
          - dbt_utils.accepted_range: {min_value: 1, max_value: 46}

  - name: ref_region_kind
    description: |
      What an SSB region code IS, by pattern. Reference data for
      macros/classify_region_code.sql, which is the single place the
      patterns are applied.

      🔴 Atlas's scope is Norwegian kommuner, and SSB's Region dimension
      is not only kommuner. Until 2026-09-21 every four-digit region
      code was labelled a kommune_nr, which made Svalbard, Jan Mayen,
      the continental shelf and the 19 "uoppgitt kommune i fylket"
      codes into municipalities — 47 codes and 9 964 rows of permanent
      referential warnings against dim_kommune.

      ✅ Terje's decision on urb-agents #700: REPRESENT these regions,
      do not COVER them. They exist in the model, they are named, and
      they are not kommuner. Nothing about which kommuner Atlas
      publishes changes.

      ⚠️ Patterns, not a list of the 47 codes observed on 2026-09-06. A
      list is a snapshot that goes stale when SSB adds a shelf sector,
      and it would have to be typed out of a markdown table — which is
      how a code that does not exist gets asserted into a dimension.
    columns:
      - name: region_kind
        description: |
          The kind a code resolves to. `unspecified_national` is SSB's
          9999 'Uoppgitt' bucket and is deliberately separate from
          `unspecified_within_fylke`: 9999 matches the XX99 pattern but
          there is no fylke 99, and conflating them was a real bug
          caught by testing the classifier rather than reading it.

          🔴 `unknown` is a MEMBER, not an absence. classify_region_code
          emits it for any code matching none of the patterns, on
          purpose — a new upstream shape should be visible rather than
          quietly becoming a municipality.

          ⚠️ I wrote that branch and then left `unknown` out of this
          seed, so the relationships test on every model using the
          classifier failed for 24 178 rows the first time the check
          suite ran (urb-agents #1313). The vocabulary must contain
          every value the classifier can produce; a residual category
          is still a category.

          ✅ It was a bag and it has been emptied. Measured (urb-agents
          #1315): the contents were exactly 36 six-digit bydel codes
          and the single `"0"` for the whole country. Both now have
          their own member, so `unknown` should match nothing today —
          and it stays, because a residual category that currently
          catches nothing is the point of having one.

          🔴 `bydel` rows exist for Oslo (15), Stavanger (9) and Bergen
          (8) and have no published home. Every published relation is
          keyed on kommune_nr and a bydel is not a kommune, so
          region_code_to_kommune_nr correctly returns null. A bydel
          surface needs its own mart and its own grain decision — the
          same one ssb-10826 is waiting on.
        data_tests: [not_null, unique]
      - name: code_pattern
        description: >-
          The POSIX regex the code matches, in the order
          classify_region_code applies them. ⚠️ Order is load-bearing: 2199
          matches both the Svalbard range and XX99, and SSB lists it under
          Svalbard.
        data_tests: [not_null, unique]
      - name: is_kommune
        description: >-
          Whether a code of this kind is a municipality. True for exactly one
          kind. This is what decides kommune_nr, and 9999 is false — which
          dim_kommune's own is_sentinel column also says.
        data_tests: [not_null]
      - name: label_no
        data_tests: [not_null]
        description: Norwegian label.
      - name: label_en
        data_tests: [not_null]
        description: English label.
      - name: sort_order
        description: Display order.
        data_tests: [not_null, unique]
