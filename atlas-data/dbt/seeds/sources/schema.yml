version: 2
seeds:
  - name: eu_data_theme
    description: >-
      EU Publications Office "Data theme" controlled vocabulary, used by
      DCAT-AP `dcat:theme` and surfaced as the "EU-tema" facet on
      data.norge.no. 13 codes; URIs are stable EU IRIs. Source:
      http://publications.europa.eu/resource/authority/data-theme.
      Joined into `mart_meta_sources` so the customer frontend can
      surface a federated-discovery-friendly classification alongside
      Atlas's domain-precise `topic` tag. See PLAN-007 phase 2.10 +
      INVESTIGATE-felles-datakatalog-classification.md.
    columns:
      - name: code
        description: Three-to-four-letter EU theme code (AGRI / ECON / EDUC / etc.).
        data_tests: [not_null, unique]
      - name: uri
        description: Canonical EU IRI for the theme.
        data_tests: [not_null, unique]
      - name: label_en
        description: English label for the theme.
        data_tests: [not_null]
      - name: label_no
        description: Norwegian label for the theme.
        data_tests: [not_null]
  - name: _sources_manifest
    description: >-
      Per-source manifest registry — one row per ingest source, generated by
      atlas-data/dbt/scripts/build_sources_seed.py from the YAML manifests at
      atlas-data/ingest/src/sources/<id>/manifest.yml. Underscore-prefixed
      because it is internal substrate for marts.mart_meta_sources, not a
      user-facing endpoint. See PLAN-007 phase 2.
    columns:
      - name: source_id
        description: Folder name under atlas-data/ingest/src/sources; primary key.
        data_tests: [not_null, unique]
      - name: upstream_id
        description: The upstream's own identifier (e.g. SSB table number, FHI dataset slug).
        data_tests: [not_null]
      - name: upstream_url
        description: >-
          Canonical link to the source on the upstream's site (often the API endpoint or machine-readable
          URL).
        data_tests: [not_null]
      - name: upstream_title
        description: The source's authoritative title at the upstream (usually Norwegian).
        data_tests: [not_null]
      - name: description
        description: One-paragraph framing for the customer-facing catalogue.
        data_tests: [not_null]
      - name: publisher
        description: Institution that publishes the data (often the same as provider).
        data_tests: [not_null]
      - name: license
        description: >-
          License token (e.g. NLOD, permissive, internal). Default NLOD for Norwegian public-sector sources.
          Always declared explicitly so consumers do not guess.
        data_tests: [not_null]
      - name: license_url
        description: URL of the license terms.
        data_tests: [not_null]
      - name: periodicity
        description: >-
          Update cadence as ISO 8601 (P1Y / P3M / P1M / P1D) or "irregular". More precise than the cadence:
          tag.
        data_tests: [not_null]
      - name: eu_theme
        description: >-
          EU Data Theme code (AGRI / EDUC / HEAL / SOCI / GOVE / etc.). Coarser than tags.topic; aligns
          Atlas with Felles datakatalog + DCAT-AP. Joined to `eu_data_theme.code` in mart_meta_sources
          to render labels and URIs alongside the source. See PLAN-007 phase 2.10.
        data_tests:
          - not_null
          - relationships:
              to: ref('eu_data_theme')
              field: code
      - name: attribution
        description: >-
          Citation string for academic / legal compliance (e.g. "Kilde: Statistisk sentralbyrå, tabell
          08764"). Surfaced via mart_meta_sources so external developers can attribute Atlas data correctly
          without parsing per-source READMEs.
        data_tests: [not_null]
      - name: upstream_landing_page
        description: >-
          Human-browsable web page describing the dataset (DCAT-AP dcat:landingPage equivalent). Empty
          when the same URL serves both purposes (e.g. SSB statbank tables); fall back to upstream_url
          in clients.
      - name: tags
        description: >-
          Comma-separated namespace:value pairs in fixed order (provider, topic, geo, cadence). The downstream
          mart_meta_sources model splits this back into a Postgres text[] for PostgREST ?tags=cs.{...}
          filtering.
        data_tests: [not_null]
  - name: _sources_dimensions
    description: >-
      Per-source × per-dimension reference, generated by build_sources_seed.py
      from each manifest.yml's `dimensions:` block. Hand-authored editorial
      content (semantic interpretation of each upstream dimension code) that
      the computed `mart_meta_dimensions` (Phase 3) joins with cardinality +
      example values from raw.* tables. Lets the catalogue answer "what does
      ContentsCode/AAR/MEASURE_TYPE mean for this source?" without making
      shoppers leave Atlas to read upstream docs. See PLAN-007 phase 2.11.
    columns:
      - name: source_id
        description: References _sources_manifest.source_id.
        data_tests:
          - not_null
          - relationships:
              to: ref('_sources_manifest')
              field: source_id
      - name: code
        description: Upstream's own dimension code (e.g. Region, Tid, GEO, AAR).
        data_tests: [not_null]
      - name: meaning
        description: Short human-readable description of what the dimension represents.
        data_tests: [not_null]
      - name: value_format
        description: >-
          Encoding of values within the dimension (e.g. "4-digit year as text", "1- to 6-character numeric
          code"). Empty string is fine when no specific format applies.
      - name: notes
        description: >-
          Editorial notes — code-list size, semantic gotchas, downstream filtering decisions. Empty string
          is fine.
  - name: bufdir_indicator_alias
    description: >-
      Per-source alias seed for indicator_api_id renumbers. One row per
      (historical_id, canonical_id) mapping consumers can join on for
      cross-time-series continuity when bufdir-barnefattigdom (or any
      other source adopting the same convention later) splits, retires,
      or renumbers a workbook upstream.
      Pre-populated from observed Bufdir history (Indikator 9 → 9a/9b
      split; Indikator 10 retired). Refreshed by hand when a new bundle
      release surfaces additional renumbering events — see
      atlas-data/ingest/src/sources/bufdir-barnefattigdom/README.md
      "Refresh checklist" for the maintenance ritual.
      The downstream mart_bufdir_indicator_alias model under
      models/marts/api/ thinly republishes this seed so the PLAN-004
      generator auto-emits api_v1.bufdir_indicator_alias for external
      consumers. See PLAN-bufdir-surrogate-id-migration.md.
    columns:
      - name: source_id
        description: >-
          Source the alias applies to (e.g. bufdir-barnefattigdom). Forward-looking — keeps the seed shape
          stable when other ZIP sources adopt the same convention later. References _sources_manifest.source_id.
        data_tests:
          - not_null
          - relationships:
              to: ref('_sources_manifest')
              field: source_id
      - name: historical_id
        description: >-
          Previous indicator_api_id from earlier bufdir releases — the id consumers may have cached and
          now need to bridge to the current canonical_id.
        data_tests: [not_null]
      - name: canonical_id
        description: >-
          Current indicator_api_id, or NULL when the historical indicator was retired without a successor
          (consumers should treat such rows as terminating series).
      - name: note
        description: >-
          Editorial explanation of the renumbering event — why the historical id maps to this canonical
          id, or why no successor exists. One sentence is fine.
