version: 2
seeds:
  - name: eu_data_theme
    description: >-
      EU Publications Office "Data theme" controlled vocabulary, used by
      DCAT-AP `dcat:theme` and surfaced as the "EU-tema" facet on
      data.norge.no. 13 codes; URIs are stable EU IRIs. Source:
      http://publications.europa.eu/resource/authority/data-theme.
      Joined into `mart_meta_sources` so the customer frontend can
      surface a federated-discovery-friendly classification alongside
      Atlas's domain-precise `topic` tag. See PLAN-007 phase 2.10 +
      INVESTIGATE-felles-datakatalog-classification.md.
    columns:
      - name: code
        description: Three-to-four-letter EU theme code (AGRI / ECON / EDUC / etc.).
        data_tests: [not_null, unique]
      - name: uri
        description: Canonical EU IRI for the theme.
        data_tests: [not_null, unique]
      - name: label_en
        description: English label for the theme.
        data_tests: [not_null]
      - name: label_no
        description: Norwegian label for the theme.
        data_tests: [not_null]

  - name: _sources_manifest
    description: >-
      Per-source manifest registry — one row per ingest source, generated by
      atlas-data/dbt/scripts/build_sources_seed.py from the YAML manifests at
      atlas-data/ingest/src/sources/<id>/manifest.yml. Underscore-prefixed
      because it is internal substrate for marts.mart_meta_sources, not a
      user-facing endpoint. See PLAN-007 phase 2.
    columns:
      - name: source_id
        description: Folder name under atlas-data/ingest/src/sources; primary key.
        data_tests: [not_null, unique]
      - name: upstream_id
        description: The upstream's own identifier (e.g. SSB table number, FHI dataset slug).
        data_tests: [not_null]
      - name: upstream_url
        description: Canonical link to the source on the upstream's site.
        data_tests: [not_null]
      - name: upstream_title
        description: The source's authoritative title at the upstream (usually Norwegian).
        data_tests: [not_null]
      - name: description
        description: One-paragraph framing for the customer-facing catalogue.
        data_tests: [not_null]
      - name: publisher
        description: Institution that publishes the data (often the same as provider).
        data_tests: [not_null]
      - name: license
        description: >-
          License token (e.g. NLOD, permissive, internal). Default NLOD for Norwegian
          public-sector sources. Always declared explicitly so consumers do not guess.
        data_tests: [not_null]
      - name: license_url
        description: URL of the license terms.
        data_tests: [not_null]
      - name: periodicity
        description: >-
          Update cadence as ISO 8601 (P1Y / P3M / P1M / P1D) or "irregular".
          More precise than the cadence: tag.
        data_tests: [not_null]
      - name: tags
        description: >-
          Comma-separated namespace:value pairs in fixed order
          (provider, topic, geo, cadence). The downstream mart_meta_sources
          model splits this back into a Postgres text[] for PostgREST
          ?tags=cs.{...} filtering.
        data_tests: [not_null]
      - name: eu_theme
        description: >-
          EU Data Theme code (AGRI / EDUC / HEAL / SOCI / GOVE / etc.).
          Coarser than tags.topic; aligns Atlas with Felles datakatalog +
          DCAT-AP. Joined to `eu_data_theme.code` in mart_meta_sources to
          render labels and URIs alongside the source. See PLAN-007 phase
          2.10.
        data_tests:
          - not_null
          - relationships:
              to: ref('eu_data_theme')
              field: code
