[project]
name = "atlas-data-dagster"
version = "0.0.0"
description = "Dagster code location for Atlas — orchestrates ingest TS + dbt assets."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pinned to the 1.13 line (Apr 2026). dbt 1.8.x compatibility:
    # dagster-dbt requires dbt-core; we keep dbt on 1.8.x for the --static
    # docs flag (see PLAN-dbt-docs-at-lineage outcome notes), and
    # dagster-dbt 0.27.x supports dbt-core 1.8+. Bump deliberately.
    "dagster~=1.13",
    "dagster-pipes~=1.13",
]

[project.optional-dependencies]
# Installed inside the polyglot Docker image (Phase 3) but optional here so
# `uv pip install -e .` for local dev stays light. dagster-dbt + dagster-k8s
# come into play in follow-up PLANs.
deploy = [
    # dagster-dbt / dagster-k8s track the dagster version: dagster 1.13.x pairs
    # with the 0.29.x line. Keep all three moving together.
    "dagster-dbt~=0.29",
    "dagster-k8s~=0.29",
    # dbt-core MUST be pinned to the same range as dbt/requirements.txt.
    # dagster-dbt itself only asks for dbt-core<1.12,>=1.7, so without this an
    # install of just this package resolves dbt 1.11 while the dbt project is
    # pinned to 1.8 — the image is saved only by requirements.txt happening to
    # install first. Local dev then runs a different dbt than production.
    "dbt-core>=1.8,<1.9",
    "dbt-postgres>=1.8,<1.9",
]
dev = [
    "dagster-webserver~=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_data"]

[tool.dagster]
module_name = "atlas_data.definitions"
code_location_name = "atlas-data"
