# atlas — UIS install definition.
#
# Published as an OCI artifact beside the atlas-data image, at the SAME immutable
# tag, by .github/workflows/atlas-data-image.yml:
#
#     oras push ghcr.io/terchris/atlas-data/uis:v<date>-<sha> template-info.yaml uis/init/
#
# ⚠️ The `tag:` field below carries a placeholder in the repository and is
# substituted at publish time with the same v<date>-<sha> the image gets. The
# workflow FAILS if the placeholder survives or if the result is not immutable —
# a build-time assertion rather than a rule someone has to remember.
#
# The placeholder token is deliberately NOT written out anywhere in this file
# except on the `tag:` line itself: substitution is a plain `sed`, so any prose
# mentioning the token would be rewritten too and end up describing itself
# wrongly in the published artifact. That happened once (v20260909-c1076cc);
# render-template-info.sh now refuses a source that contains it more than once.
#
# Provenance for every value that is a decision rather than a fact:
#   schemas: api_v1        — Terje, urb-agents #350
#   init: single file      — atlas, #362 (Dagster owns migrations/, not UIS)
#   code_location          — TPL-F5, UIS 1.6.19 (#367, #480); no manual
#                            .uis.extend edit any more

kind: application

# The application this artifact installs. An absent id is tolerated by UIS
# (1.6.26) and only a *conflicting* one is refused — which means the check has
# nothing to bite on unless this is present. It is what catches a catalogue
# entry pointing at the wrong artifact. (tor-agent, urb-agents #483.)
id: atlas

params:
  app_name: atlas

# BEGIN holdings (generated)
data:
  sources: 43
  publishers: 5
  public_relations: 20
  holds: >-
    Norwegian public data at kommune level, joined into one semantic layer:
    Folkehelseinstituttet (21); Statistisk sentralbyrå (17); Brønnøysundregistrene (3); Barne-, ungdoms- og familiedirektoratet (1); Norges Røde Kors (1).
    Published as read-only PostgREST relations under api_v1. NLOD for
    42 of 43 — Norwegian public data, free to reuse with
    attribution. The exceptions are `redcross-branches` (permissive) — Red Cross's own data rather than the state's.
  discover: >-
    GET /meta_endpoints for what is queryable, /meta_sources for every upstream
    with its freshness and a served_as array naming the relations it actually
    reaches (empty means nothing published depends on it), /meta_dimensions for
    what each coded column MEANS — read it before interpreting a code —, and
    /indicator_summary for every published series. Those are the live answer;
    the counts here are regenerated per release.
# END holdings (generated)

provides:
  services:
    # ---------------------------------------------------------------------
    # PostgreSQL — the database, the app role, and the Secret Dagster reads.
    # ---------------------------------------------------------------------
    - service: postgresql
      config:
        database: "{{ params.app_name }}"

        # The ONLY SQL UIS applies. One statement: CREATE SCHEMA IF NOT EXISTS
        # api_v1, so `configure postgrest` finds the schema it checks for.
        # Everything else is Dagster's `raw/_migrations` asset (#362).
        init: uis/init/001_bootstrap.sql

        namespace: dagster
        secret_name_prefix: "{{ params.app_name }}-database"

    # ---------------------------------------------------------------------
    # PostgREST — the public API.
    # ---------------------------------------------------------------------
    - service: postgrest
      config:
        # Terje, #350: "The public API serves api_v1 only — the curated,
        # documented views. marts and raw stay behind it; if a consumer needs a
        # mart, it gets an api_v1 view of it."
        #
        # This is a posture, not a value. The per-schema ALTER DEFAULT PRIVILEGES
        # grant makes an exposed schema readable in full INCLUDING TABLES ADDED
        # LATER. Widening this list is not choosing today's tables, it is
        # choosing whatever the pipeline writes there from now on. Do not widen
        # it without Terje.
        schemas: api_v1

        url_prefix: "api-{{ params.app_name }}"

    # ---------------------------------------------------------------------
    # Dagster — the code location that runs the ETL.
    # ---------------------------------------------------------------------
    - service: dagster
      config:
        code_location:
          # ⚠️ {{ params.* }} is substituted into this name at INSTALL time and
          # the substituted value is what gets recorded (UIS 1.6.21 fixed install
          # recording the raw string, which made `template remove` word-split it
          # into three tokens and report three successes while the entry
          # survived). Sanity-check this field first on a first install.
          name: "{{ params.app_name }}-data"

          image: ghcr.io/terchris/atlas-data

          # Substituted at publish time. Must be immutable — latest/main/master/
          # head are refused. Helm also needs a unique value to roll the pod.
          tag: __IMAGE_TAG__

          # 🔴 The image this definition was BUILT against, by content.
          #
          # Until UIS 1.6.62 there was no way to say this, and the consequence was
          # narrow but real: the install was digest-pinned while the code that
          # runs was not. A re-push of the same tag changes what executes, and
          # every digest UIS prints stays identical — so imac verifies a digest,
          # dev-templates pins a digest, and the container underneath moved.
          #
          # Declaring it makes UIS REFUSE the deploy when the declared digest and
          # the resolved digest disagree. That is the case nobody would otherwise
          # notice.
          #
          # ⚠️ The honest limit, in tor-agent's words: 1.6.62 makes the code
          # location "pinnable and observable, not pinned" — the pin is enforced
          # at deploy and the pull still goes by tag. It deliberately does not
          # render `repository@sha256:…`, because whether the Dagster chart can
          # express that is unestablished, and a field that renders a valid but
          # wrong reference would be a worse bug than the one it fixes.
          #
          # Substituted at publish time from the digest docker/build-push-action
          # reports for the image it just pushed — so it is the digest of THIS
          # build, not one looked up afterwards from a tag that could already
          # have moved.
          #
          # 🔴 THIS IS THE DATA IMAGE'S DIGEST. IT IS NOT THE ONE
          # `uis template install --version <tag>@<digest>` WANTS.
          #
          #   ghcr.io/terchris/atlas-data       the image  <- THIS field
          #   ghcr.io/terchris/atlas-data/uis   the artifact <- what --version wants
          #
          # Two repositories, two digests, never equal. ⚠️ On 2026-09-21 imac
          # passed this one to --version and got "not found ... may need a
          # package credential", which points at auth and sent it looking the
          # wrong way for a round trip (urb-agents #1356).
          #
          # 🔵 The value --version wants is published as `artifact_digest` in
          # the release asset uis-artifact.json, beside `image_digest` which is
          # this field. Those two names exist precisely so they cannot be
          # confused (#831) — and this comment is the pointer that was missing
          # from the place someone actually reads.
          digest: __IMAGE_DIGEST__

          module: atlas_data.definitions
          why: "the ETL that fills api_v1; without it marts.* and api_v1 stop refreshing"

          # ⚠️ The `-db` suffix is NOT optional and is the thing everyone gets
          # wrong first. `configure postgresql --namespace dagster
          # --secret-name-prefix atlas-database` writes a Secret named
          # `atlas-database-db` with the key DATABASE_URL. A mismatch starts the
          # pod silently without the variable.
          env_secrets: "{{ params.app_name }}-database-db"

          # 🔴 THE CHECK COULD NOT REACH THE API IT CHECKS, AND THE FIRST FIX
          # DELIVERED THE WRONG ADDRESS.
          #
          # `commands.check` runs atlas-status.py in this pod, and its strongest
          # single assertion is an HTTP request to PostgREST. ⚠️ On a stock
          # install `ATLAS_POSTGREST_URL` was unset, so the tool correctly said
          # "I could not look", UIS mapped that to UNHEALTHY, and a healthy
          # register read as broken.
          #
          # ⚠️ The first fix used `env_from_exports: api-url`. That export is
          # `http://api-<app>.localhost` — the address a developer types into a
          # browser ON THE HOST. Delivered into a pod it is loopback (RFC 6761),
          # so the check dialled itself. imac measured it from inside the pod:
          # curl exit 7, RESOLVED and refused, not exit 6. 🔴 A cluster WITH the
          # ingress behaves identically, so it was never a missing ingress.
          #
          # 🔵 ONE NAME, TWO CORRECT ANSWERS. An export cannot say which network
          # namespace its value is valid in, and the consumer cannot tell which
          # it received — the same structure as artifact-versus-image and
          # run-versus-image, both of which cost a round this week.
          #
          # 🔴 SO THIS NAMES THE SERVICE, NOT AN ADDRESS. UIS composes
          # <scheme>://<name>.<namespace>.svc.cluster.local:<port> from its own
          # services.json. A service address is in-cluster by construction, so
          # there is no second correct answer to confuse it with.
          #
          # ⚠️ Deliberately NOT the alternative of declaring the in-cluster URL
          # here. `namespace` is not a declared property of the UIS service
          # schema, it moved once this year (gravitee, 2d0570d), and PLAN-012 is
          # a recorded outage of exactly that class. Encoding the platform's
          # topology in a tenant artifact is the mirror of putting a tenant's
          # name in the platform's CLI, which tor-agent refused for the same
          # reason. The day UIS moves a namespace it moves it in services.json
          # and this file keeps working unchanged.
          #
          # 🔴 REPLACES `env_from_exports`, it does not sit beside it. UIS 1.6.85
          # refuses a variable set by both and says so in the refusal. The export
          # `api-url` stays exactly what it is — host-facing — and stops being
          # asked to be two things.
          env_from_services:
            ATLAS_POSTGREST_URL: postgrest

            # 🔵 SO THE CHECK CAN ASK WHAT IS RUNNING WITHOUT A DATABASE ROLE.
            #
            # The Automation block used to read `instigators` in the `dagster`
            # database, which needs the `dagster` role. tor-agent refused to
            # inject that credential and was right (urb-agents #1150): the code
            # location's environment is copied into EVERY run pod it launches
            # (`includeConfigInLaunchedRuns` defaults true), so it would have put
            # the owner of runs, event_logs and schedules FOR EVERY CODE LOCATION
            # ON THE INSTALLATION into arbitrary tenant asset code. Dagster's
            # GraphQL API answers the same question with no role at all.
            #
            # ⚠️ The value is a SERVICE ID, not an address — UIS composes the
            # in-cluster URL from its own services.json, and the script appends
            # /graphql. Same reasoning as ATLAS_POSTGREST_URL above: a service
            # address is in-cluster by construction, so there is no second
            # correct answer to confuse it with.
            #
            # ✅ Reachability from THIS pod is measured, not assumed. imac ran it
            # with `kubectl exec` into the code location on e439668 — HTTP 200,
            # no auth, and 200 in 32 ms from Python rather than only curl
            # (urb-agents #1151). UIS's own proof came from a probe pod in the
            # `dagster` namespace, which is a neighbour of this pod and not this
            # pod; that distinction is why it was worth measuring.
            #
            # ⚠️ Proven on a cluster with NO NetworkPolicy in `dagster`. If one
            # ever appears the check reports "could not reach, reason
            # indeterminate" and says what to look at, because a dropped packet
            # and a wrong port are the same observation from in here.
            DAGSTER_GRAPHQL_URL: dagster

# ─────────────────────────────────────────────────────────────────────────────
# What this application DOES once installed, as opposed to what it creates.
#
# Here because it is a property of the IMAGE: the cadence lives in cadence.py and
# schedules.py inside the container, so pinned here it is version-locked to the
# code it describes and changes only when the tag changes. In the catalogue entry
# alone it would be a second place that must agree, drifting silently — the same
# argument imac made about env_secrets, pointed the other way (urb-agents #499).
#
# ⚠️ Every cron and name below is ASSERTED against cadence.py and schedules.py by
# uis/render-template-info.sh on every PR and every publish. If you change a
# schedule in the code and not here, the build fails. Do not hand-edit these to
# match prose — change the code, and let the gate tell you.
#
# Nothing in UIS reads this today; it is inert by design and cannot affect an
# install.
# 🔴 A DECLARED COMMAND. UIS runs this inside the code location and reports what
# it said — `uis template check atlas` (tor-agent, urb-agents #921/#929).
#
# ⚠️ The verb is `check`, not `status`: `platform status` and `network status`
# already mean "is this service healthy", and this asks a different question —
# has the data that went in come out the other side. A third meaning of `status`
# would have been discovered rather than decided.
#
# 🔴 DECLARING NOTHING IS THE DEFECT. tor-agent's design names an application
# that declares no check: "this application cannot tell you whether its output
# reflects its input." Atlas declares one because it is the application that
# proved the point — it served a deleted company over its public API for 7.5
# hours on 2026-09-13 while five separate signals read green.
#
# ⚠️ `run:` is `/app/atlas-status.py` because `WORKDIR /app` and the Dockerfile
# copies it there — verified against the Dockerfile rather than copied from the
# proposal's example path, which said `/opt/atlas/`.
#
# 🔵 The application owns its dependencies inside its own image. This is Python
# rather than shell precisely so that is true: `psycopg2` already ships for the
# api_v1 asset checks, where `psql` does not ship at all.
#
# 🔴 THE CHECK READS AUTOMATION STATE ITSELF, AND THAT BOUNDARY WAS A DECISION
# (ops-dev, urb-agents #1035). It used to report "N deletion(s) awaiting the next
# transform" over exit 0 on a host where every schedule was stopped — the state
# every fresh install is in, and one the documented happy path walks through.
#
# ⚠️ UIS could have folded automation state in around this command's answer.
# It should not: a wrapper can add a line but it cannot unsay one, and the false
# sentence is this application's. It also already holds the credential — the same
# Dagster access the Jobs block uses — so folding it in outside would make two
# outputs that must agree about one fact. (That access is now the GraphQL API
# rather than a database role; the argument about one fact with two outputs is
# unchanged by which door it comes through.)
#
# 🔵 EXIT 1 NOW ALSO MEANS "changes are waiting and nothing is scheduled to apply
# them". It does NOT mean stopped automation on its own: a deliberately stopped
# install is reported loudly and still exits 0, because the install guide leaves
# an operator exactly there between loading first data and going live, and a
# check that exits 1 on the documented path teaches its reader that 1 is normal.
#
# 🔴 AND IT COVERS EVERY SOURCE, NOT ONLY BRREG (ops-dev, urb-agents #1039).
# The command used to answer the register properly and give the other 41 sources
# a 24-HOUR WINDOW — which cannot see a weekly or monthly source go stale at all,
# because a day after they run they drop out of it. 23 of the 29 bounded sources
# are weekly. The cadence comparison already existed as a dbt test; its verdict
# was unreadable here, living in dbt run results and Dagster's event log, whose
# tables Atlas has no SELECT on. It is now the view `marts.mart_source_freshness`
# — evaluated when queried, so it is current whether or not the transform, the
# suite or the daemon has run — and the dbt test gates on the same rows.
#
# ⚠️ A host whose transform has never run has no view, and the command reports
# CANNOT (exit 2) rather than "fresh". Absence rendering as green is the defect
# this command exists to catch.
commands:
  check:
    description: "Does the output reflect the input? Compares what the feed pulled against what the register serves, whether every source is inside its declared cadence, and whether anything is scheduled to keep it current."
    run: /app/atlas-status.py
    in: code-location

operational:
  # The single most important line for an operator: installing commits you to
  # nothing that runs.
  # ⚠️ This sentence is rendered at the END OF AN INSTALL as of UIS 1.6.65, not
  # only by `uis template info`. Until then it reached people browsing the
  # catalogue and never the operator who had just installed (tor-agent,
  # urb-agents #758) — so it was written blind, for the wrong reader.
  #
  # Write it for someone who has just watched an install finish and is deciding
  # what to do next. Seven of the other operational.* fields are still info-only
  # by design, so this one cannot assume they were read.
  automation: >-
    Ships stopped. No data is fetched and no external service is contacted until
    an operator enables both the schedules and the sensors; that is a go-live
    decision, not a side effect of installing. Enabling them does not backfill:
    no history is replayed, ever. But the TIMING differs between the two halves
    and only one of them waits. The two SCHEDULES (transform_daily at 05:00,
    brreg_transform at :10 and :40) do nothing until their next scheduled time.
    The AUTOMATION SENSOR, which drives all ~40 ingest sources, evaluates on its
    own tick rather than on those crons: an asset becomes eligible when its cron
    tick has passed AND its dependencies updated since that tick, so on a fresh
    install - where every cron tick is already in the past and nothing has run -
    it can begin fetching within about a minute of being enabled. Enabling at
    16:55 on a Friday starts work at 16:55, not at the next cron. Concurrency is
    bounded by ATLAS_MAX_CONCURRENT_INGESTS, so it is a bounded start and not 40
    simultaneous writers. And enabling BEFORE the first-data sequence means the
    sensor, not the operator, decides the order: the change feed will start, find
    no watermark and fail loudly until brreg_bootstrap has run - by design, not a
    fault, but noise nobody needs. Launch the first-data jobs first.

  timezone: Europe/Oslo

  # ⚠️ The gap imac found on urb-agents #507: enabling the schedules does NOT
  # backfill. Every condition above is `on_cron`, which means *next fire* — a
  # Thursday install waits until Sunday 02:00 for raw data and 1 October for the
  # monthly sources. A user who correctly makes the go-live decision still sees
  # an empty API for days, with nothing telling them why.
  first_data:
    why: >-
      Enabling the schedules does not backfill. The crons above are the next
      fire, not a catch-up, so a fresh install stays empty until one comes round.
    # 🔴 RETRACTED 2026-09-16: "UIS TRUNCATES THIS FIELD" WAS FALSE, AND SO WAS
    # THE GENERAL RULE I WROTE FROM IT (ops-dev, urb-agents #1157).
    #
    # This comment previously said the field parses to 2300 characters, that UIS
    # renders 1114, and therefore that "a long field has a silent cliff in it".
    # **There is no cliff. There never was.** That was a false claim about
    # another team's software, shipped in this artifact.
    #
    # What actually happened: `uis template info` renders the CATALOGUE's pinned
    # definition, not the one installed on the host. During the measurement the
    # catalogue still pinned the PREVIOUS build while the host ran this one, so
    # two different versions of this field were compared. **1114 is simply where
    # the older version ended** — the paragraph below was appended to it, and the
    # newline at that offset is an artefact of appending, not a boundary anything
    # cut at. The older field rendered completely and correctly.
    #
    # ⚠️ tor-agent found this by REFUSING TO FIX WHAT WAS REPORTED: it built a
    # fixture with our numbers, found no budget and no line cap on that path, and
    # named the one check that would settle it instead of shipping a truncation
    # notice for a truncation that does not exist.
    #
    # 🔴 THE REAL REASON #314 REACHED NOBODY, which is simpler and worse: the
    # installer does not render `how` AT ANY LENGTH. tor-agent's read of
    # `_install_summary_operational` — it whitelists `note`, `jobs`, `takes`,
    # `automation`, `manual_only`, `unscheduled`, `troubleshooting`. `how` is not
    # in it. So `how` reaches an installing operator at ZERO characters, in any
    # position, however short. Putting the sentence first here did not deliver
    # it, and neither would trimming the field.
    #
    # ✅ THE STATEMENT THEREFORE LIVES IN `install.note`, which is whitelisted.
    # It is kept here too, because this field IS rendered by `uis template info`
    # — a real reader, just not the one #314 was written for.
    #
    # ⚠️ The lesson that survives is not about length. It is that **this file has
    # no idea which of its fields anyone reads**, and every guess so far has been
    # wrong in a different way: `first_data.measured` (#793) rendered nowhere, a
    # top-level `first_load` (#791) rendered nowhere, and `how` renders on one
    # surface that is not the installer's. Do not reason about it — ask which
    # surface consumes the key, and have someone confirm the words appeared.
    how: >-
      WHEN THESE SIX HAVE FINISHED THE INSTALL IS LOADED BUT NOT VALIDATED, and
      nothing else says so. Launch them from the Dagster UI, serially, in exactly
      this order. Atlas defines 685 asset checks - 681 dbt + 4 api_v1, measured by
      imac on build e439668 - and on a fresh install NONE of them has run. They
      are reached only through three instigators that all ship stopped:
      transform_daily, then the sensor to api_v1_checks, then the sensor to
      transform_checks. So the suite does not first run at 05:00 the next morning;
      it first runs after the next transform_daily FOLLOWING go-live, and if
      automation is never enabled it never runs at all. Enable automation with
      `uis dagster automation --start`.

      All 685 can be run on demand. `uis dagster run api_v1_checks` takes ~27 s
      and covers the PUBLIC API - row counts against the marts they wrap, column
      COMMENTs, and the anonymous role's grants. `uis dagster run
      transform_checks` also works, but BUDGET 6-15 MINUTES: imac measured two
      launches at 364 s and 885 s to start, both exit 0, the first landing 681
      SUCCEEDED (urb-agents #1160). The run sits NOT_STARTED for that whole time
      and then runs - that is slow, not stuck, and re-launching because it looks
      hung is how you get duplicate runs.

      ⚠️ This paragraph said until 2026-09-16 that the other 681 "cannot be
      launched on demand" and that the call "leaves an unsubmitted run behind, so
      do not retry it". That was true when written and is not true on this build.
      Telling an operator not to attempt something that works is a worse failure
      than the slowness it was warning about.

      A green transform_checks is still not proof they all passed - see
      troubleshooting.

      The order is not arbitrary: seed_sources_refresh contains raw/_migrations
      and runs third, so the migrations apply after two source jobs have already
      written. That is safe because they are idempotent, but reordering these has
      not been tested (ops, urb-agents #627).

      brreg_change_feed runs immediately after brreg_bootstrap for a reason: the
      bootstrap seeds the feed's watermark from the snapshot's own date, so the
      feed has nothing to start from until it has run. Running the feed first
      fails loudly rather than silently walking history — it refuses to start
      without a watermark.

      brreg_bootstrap is the odd one out and the one most likely to be skipped.
      It has NO schedule and its asset has NO automation condition, on purpose —
      re-running a 1.17M-record bulk load against a populated database is the one
      genuinely destructive operation in this pipeline, so nothing self-triggers
      it. Run it once, here. Skipping it leaves the organisation register empty
      with nothing saying why; running it twice is safe (upsert, never truncate)
      but pointless.

    jobs: [annual_sources_refresh, klass_refresh, seed_sources_refresh, brreg_bootstrap, brreg_change_feed, transform_and_publish]
    # ⚠️ The caveat is INSIDE `takes` because `first_data.measured` renders on no
    # UIS surface (imac, urb-agents #793). A figure whose "this is out of date"
    # note is invisible is worse than no figure — the stale number reaches the
    # reader and the correction does not.
    takes: "~30 minutes on a COLD install: six first-data jobs, 1772 s wall, measured end to end by imac on a factory-reset cluster (urb-agents #1027). The Brreg bulk load is 501 s of that and is no longer the unmeasured part. ~4.1M rows across 52 raw BASE TABLEs and 82 marts BASE TABLEs (plus 10 marts views). An earlier figure of ~11 minutes is still in circulation and understates a cold install by nearly 3x: it was imac's measurement of the first FOUR jobs (#507: 11.1 min, 2,906,194 rows) and it predates brreg_bootstrap entirely. The individual jobs vary far more than the total suggests - annual_sources_refresh alone is 474 s and transform_and_publish 484 s - so a run that looks stalled at 8 minutes may be normal. If you need to tell slow from stuck, run the check command rather than waiting: it reports what has been pulled against what has been applied."

  # 🔴 first_data ABOVE IS FOR AN EMPTY INSTALL. This is the other case, and it
  # did not exist until 2026-09-22 — `operational:` described a first install
  # and had no concept of an upgrade at all (dev-templates, urb-agents #1371).
  #
  # ⚠️ WHAT THAT COST: `3e72760` widened the SSB Klass ingest window from 1960
  # to 1950 to recover twelve dissolved kommuner. The release shipped,
  # `transform_and_publish` ran, and 7,296 rows kept failing a foreign-key
  # check — because the transform can only reshape rows that are already in
  # `raw`, and nobody had re-run the ingest that fetches them. `data:` and
  # `operational:` were BYTE-IDENTICAL across that release, so a change to
  # what the ingest fetches altered nothing an operator could read.
  upgrade:
    why: >-
      An upgrade already has data, so the default is the transform alone. The
      exception is a release that changes WHAT AN INGEST FETCHES — its date
      window, its filters, its dimensions. The transform cannot recover rows
      that were never requested, so that source's ingest job must run FIRST.
    jobs: [transform_and_publish]
    when_more_is_needed: >-
      If the release notes name a change under an ingest source, run the job
      that owns it before the transform. `operational.cadence` below maps every
      job to what it covers - klass_refresh for the SSB Klass classifications,
      annual_sources_refresh for the ~37 annual public-sector sources,
      brreg_change_feed for the register. Then transform_and_publish, then
      transform_checks.
    # 🔴 THE CRON WOULD HAVE HIDDEN IT. klass_refresh runs "0 1 1 * *" — 01:00
    # on the 1st. The FK failure above appeared on 22 September and would have
    # cleared by itself on 1 October, with nobody having changed anything and
    # no record of why.
    #
    # ⚠️ A defect that repairs itself before anyone investigates is worse than
    # one that stays broken: the signal and the cause end up far enough apart
    # that they stop looking related. ops-dev's line, and it is the reason this
    # field says the trigger rather than only the remedy.
    self_healing_warning: >-
      An ingest-window change left unrun is repaired by that source's next
      scheduled cron - up to a month for klass_refresh. The symptom disappears
      on its own and the cause is never recorded. Re-run it deliberately.

  # For the "what is this about to do to my cluster" question (#507 item 1).
  # provides.services below is the authoritative list; this is the human summary.
  install:
    deploys: [postgresql, postgrest, dagster]
    takes: a few minutes; the data load afterwards is the long part
    # ⚠️ MOVED HERE FROM A TOP-LEVEL `first_load:` ON 2026-09-13, because that key
    # was rendered on no UIS surface at all — tor-agent found it while answering a
    # question I asked about a different key (urb-agents #791).
    #
    # It belongs here on its own merits rather than as a workaround. `takes` says
    # the data load is the long part; this says how long is long. Both answer the
    # same question — "what is this about to do to my cluster" — asked by someone
    # deciding whether to install and how much disk to give it. Splitting them
    # across two keys was the reason one of them could go missing unnoticed.
    first_load: >-
      ~4.1M rows across 52 raw BASE TABLEs and 82 marts BASE TABLEs (plus 10
      marts views), from ~41 sources. That is imac's measured 2,906,194 on a clean install
      (urb-agents #496, #507) plus the 1,173,878-record Enhetsregisteret bulk
      load added in PLAN-001. The row count is arithmetic on two measured
      figures. The combined WALL TIME IS now measured — a cold install is ~30
      minutes — and is stated once, in first_data.takes, rather than repeated
      here where it would become a second place that must agree.
      COUNTING RULE, because two strings in this file used to disagree with each
      other AND with the database while no method was written down (urb-agents
      #824): a "table" here is a BASE TABLE, views excluded and counted
      separately. raw = distinct `create table raw.*` across atlas-data/migrations
      (52). marts = dbt models materialised table or incremental into schema marts,
      models=64 plus seeds, which are always tables, seeds=18; a further
      views=10 are materialised as views instead and are the "10 marts views"
      above.
      ⚠️ THIS SENTENCE HAS CONTRADICTED ITSELF THREE TIMES (#824, #1263, and
      #1353 on 2026-09-21, when it read 81 in the headline, "= 62" in the rule,
      "eight" views one clause later and "(61 / 5 / 66 / 52)" at the end, all in
      one folded scalar). The cause each time was the same: a field half
      generated and half typed. EVERY NUMBER IN IT IS NOW WRITTEN BY
      uis/generate-holdings.py — not render-template-info.sh, which this text
      credited wrongly — and none is maintained by hand. If you are about to
      type a figure here, add a substitution to that script instead.
      private_marts is excluded — it is the gated schema, not
      part of a public install summary. Recompute marts from a dbt manifest:
      `python3 -c "import json,sys;m=json.load(open('dbt/target/manifest.json'))['nodes'];
      print(sum(1 for n in m.values() if n['schema']=='marts' and (n['resource_type']=='seed' or
      n['config']['materialized'] in ('table','incremental'))))"`.
      All figures here are derived from this repo with no database.
      ⚠️ A previous line claimed they matched a live measurement "exactly
      (61 / 5 / 66 / 52)". That reconciliation was real when written and the
      figures have moved since; a stale claim of exact agreement is worse than
      no claim, because it invites the reader to stop checking.
    note: >-
      🔴 UPGRADING AN EXISTING INSTALL? Run `uis dagster run publish_api_v1` afterwards.
      The column descriptions PostgREST publishes as OpenAPI docs live in the
      DATABASE, not in the image, and only a publish applies them — so the
      documented contract tracks the last build that ran a publish, not the build
      that is running. Upgrade to a build that corrects a description and the old
      text keeps being served, with every signal green, until the next daily
      publish at 05:00 — up to 24 hours. Measured 2026-09-13; reachable in both
      directions, so a rollback can leave NEW documentation on an OLD build too.
      That job re-applies every COMMENT and reloads PostgREST's schema cache; it needs no dbt build, so it is far cheaper than a full
      transform and is the whole of what an upgrade needs. The
      `descriptions_match_the_running_build` check answers "is my served
      documentation the one my build ships" without changing anything.
      Immediately after install the API is live and serves zero endpoints. The
      advertised meta_sources / meta_endpoints / meta_dimensions return 404 until
      the first pipeline run. That is correct, not a failed install.

      🔴 AND WHEN THE SIX FIRST-DATA JOBS HAVE FINISHED, THE INSTALL IS LOADED
      BUT NOT VALIDATED — nothing else says so. Atlas defines 685 asset checks
      (681 dbt + 4 api_v1, measured on build e439668) and on a fresh install NONE
      of them has run: they are reached only through three instigators that all
      ship stopped — transform_daily, then the sensor to api_v1_checks, then the
      sensor to transform_checks. So the suite does not first run at 05:00 the
      next morning; it first runs after the next transform_daily FOLLOWING
      go-live, and if automation is never enabled it never runs at all. Enable it
      with `uis dagster automation --start`. Four of the 685 can be run on demand
      now: `uis dagster run api_v1_checks` takes ~27 s and covers the public API.

  # ⚠️ Rendered at install by UIS 1.6.65 alongside `automation`, so this reaches
  # the operator rather than only the catalogue. Written for someone who has just
  # watched a run fail at 02:00 and has no other instruction.
  #
  # It exists because imac found the remedy lived only in a SQL comment inside
  # the image (urb-agents #786): "whoever hits this at 02:00 gets a dbt schema
  # error and no instruction, on a surface that is currently serving nothing."
  troubleshooting:
    - symptom: >-
        transform_checks reports SUCCESS, so the data is validated.
      cause: >-
        It is not. A transform_checks run reports SUCCESS if the JOB completed,
        not if the checks passed. imac measured a run on 2026-09-16 that reported
        SUCCESS while carrying 663 SUCCEEDED and 18 FAILED checks (urb-agents
        #1149). Those particular 18 are pre-existing kommune_nr / fylke_nr
        referential-integrity failures, present identically on the previous build
        - 0 new, 0 fixed - so they are not a regression. The point is the
        instrument, not the 18: a green transform_checks cannot be told apart
        from "everything passed", and it is the signal most likely to be trusted
        precisely because it is green.
      fix: >-
        Do not read the job status as a verdict. Read the per-check results in the
        Dagster UI under the job run, or query the asset-check evaluations
        directly. If you want one number, compare the failed count against the
        previous run rather than against zero - the useful question on an upgrade
        is "did this build break anything", and 18-that-were-already-18 answers it
        where a red/green light does not.
    - symptom: >-
        Older notes and older builds tell you to set DAGSTER_DATABASE_URL so the
        Automation and Jobs blocks work. Setting it does nothing.
      cause: >-
        Two separate things, and the advice was wrong even before it became
        obsolete. `uis template check atlas` runs atlas-status.py INSIDE the code
        location, so a variable exported in your own shell never reaches that pod
        - the remedy could not be followed and said nothing about why (imac, via
        ops-dev, urb-agents #1149). And injecting it was then REFUSED outright
        (tor-agent, urb-agents #1150): a code location's environment is copied
        into every run pod it launches, so it would hand the `dagster` role -
        owner of runs, event_logs and schedules for EVERY code location on the
        installation - to arbitrary tenant asset code.
      fix: >-
        Nothing to do on this build or newer. Both blocks now read Dagster's
        GraphQL API, which needs no database role at all, and UIS supplies the
        address automatically via `env_from_services: DAGSTER_GRAPHQL_URL`. The
        variable is not read anywhere and can be deleted wherever you have set
        it. If either block still says it cannot tell, it now prints WHY -
        unset, query rejected, or unreachable-reason-indeterminate - and that
        reason is the thing to act on rather than a credential.
    - symptom: >-
        brreg_bootstrap was re-run to repair the register. It reported success, the
        transform reported success, and the API still serves the old data.
      cause: >-
        Fixed in this build, and recorded because an operator on an older one will
        meet it. dim_brreg_enhet is incremental and its predicate used to select
        only organisations the CHANGE FEED had touched. A bootstrap writes the
        snapshot and produces no feed rows, so it was invisible to the transform by
        construction — measured on 2026-09-13 as a successful 329-second run that
        recorded an asset materialisation and wrote zero rows. Every signal an
        operator has agrees it worked: exit status, materialisation, freshness, row
        counts, and a 200 from the API.
      fix: >-
        On this build or newer, nothing — a bootstrap now reaches the dimension on
        the next transform, and an asset check fails if it ever does not. On an
        older build the repair is a bootstrap PLUS a full refresh of the Brreg
        lineage, run as the atlas database user and not as a superuser. To tell
        which you are on before trusting a repair, compare max(reconciled_at) in
        marts.dim_brreg_enhet against the time the transform ran: if it predates
        the run, the model wrote nothing.
    - symptom: >-
        brreg_bootstrap terminates part-way through the download, and retrying
        gets less far each time rather than more.
      cause: >-
        Not established, and stated that way on purpose. Observed on 2026-09-13:
        four 210 MB downloads of the same bulk file within ninety minutes, the
        first succeeding and each subsequent one dying sooner — 590,000 records
        reached, then 150,000, from byte-identical database state. Database state
        cannot explain a 4x difference in reach, so the cause is external and
        cumulative. The error text is only "terminated" and Brreg's side is not
        visible from here, so rate-limiting is a hypothesis and not a finding.
      fix: >-
        Stop retrying. The remedy is time, not another attempt — if the hypothesis
        holds, a further download today makes tomorrow worse rather than better.
        A partial load is safe to leave in place: the loader upserts on
        organisasjonsnummer and deletes nothing, which has been exercised across
        866,000 conflicting keys, and the change feed keeps the register current
        meanwhile. Run one clean bootstrap the next day instead.
      note: >-
        A partial bootstrap leaves raw carrying two snapshot_file_date values at
        once. That is provenance, not corruption, and it does NOT block a full
        refresh: on a full refresh dim_brreg_enhet rebuilds from the entire
        versions history plus every snapshot row, and the feed document wins for
        any organisation the feed has touched. An organisation the feed has not
        touched has not changed, so its two file dates carry the same document.
        Finish the load for provenance and completeness, not as a precondition.
    - symptom: >-
        A transform run fails naming dim_brreg_enhet with EITHER of two errors:
        Database Error, 'column "snapshot_loaded_at" does not exist' pointing at
        "select coalesce(max(snapshot_loaded_at), '-infinity'"; OR dbt's own
        "The source and target schemas on this incremental model are out of
        sync!" followed by "Source columns not in target". Both mean the same
        thing and take the same fix — see cause for which you get and why.
      cause: >-
        An Atlas upgrade added a column to a model that is materialised
        incrementally. The existing table cannot gain it in place.
        ADDING A COLUMN TO THIS MODEL PRODUCES ONE OF TWO COMPLETELY DIFFERENT
        ERRORS, and which one depends on whether the incremental predicate reads
        the new column:

          the new column IS read by the predicate - e.g. snapshot_loaded_at.
            The compiled SELECT does `max(snapshot_loaded_at) from {{ this }}`,
            so POSTGRES raises 'column "snapshot_loaded_at" does not exist'
            before dbt's schema-change handling compares anything. That is the
            symptom quoted above.

          the new column is NOT read by the predicate - e.g. the 76 columns
            extracted from `doc` on 2026-09-24. dbt's comparison runs normally
            and emits its own standard message:
              "The source and target schemas on this incremental model are out
               of sync!"  Source columns not in target: [...]

        Same cause, same fix, two search terms. An operator will search for
        whichever text is on their screen, so both are written out here.

        This entry previously said dbt "never emits" the out-of-sync message for
        this model. It emitted it word for word on 2026-09-24 when the model
        gained 76 columns none of the predicates read (urb-agents #1464).
        The original observation was correct about the case it was written from
        and wrong to generalise from one column to the model - which is the same
        outcome the entry existed to prevent, reached from the other direction.
        Verified in the code: the predicates read max(last_oppdateringsid) and
        max(snapshot_loaded_at) from {{ this }}, and ZERO of the 76 new columns
        appear inside any is_incremental() block. Distinction found by imac.
        Expected on the upgrade that added dim_brreg_enhet.snapshot_loaded_at:
        that column is what lets the dimension notice a bulk reload without
        joining two multi-gigabyte tables on every half-hourly run, and it was
        chosen over the join once the refresh cost was measured. A planned cost,
        not a fault.
      fix: >-
        Two steps, and the second is the one people miss. FIRST rebuild that
        model once, AS THE atlas DATABASE USER and not as a superuser — a full
        refresh drops and recreates, so the tables take the running user's
        ownership and a superuser leaves the next run with "permission denied".
        From the dbt project - "dbt build --full-refresh --select
        dim_brreg_enhet+". The trailing + is DESCENDANTS and is deliberate: it
        rebuilds what depends on the changed table. A leading +dim_brreg_enhet
        selects ancestors and is the wrong direction - both spellings have been
        circulated and this is the correct one. Measured at 528-536 s wall for
        that selector, which is 1.17M rows plus 29 data tests and a view model;
        an earlier 256 s figure was the model ALONE and reads as a regression
        beside a + selector when someone times it. THEN run
        "uis dagster run publish_api_v1", or transform_and_publish if you also
        need a rebuild. Rebuilding the view is
        NOT enough on its own - PostgREST answers from a cached schema, and if
        that cache was last loaded while the view was missing it keeps returning
        404 over a view that exists and has correct grants. The api_v1 asset is
        what issues the reload.
    - symptom: >-
        The public API returns 404 - including straight after you repaired the
        database and confirmed the view exists with rows and grants.
      cause: >-
        PostgREST serves from a cached schema rather than reading the catalogue
        per request. Recreating a view is invisible to it until something issues
        NOTIFY pgrst 'reload schema'. Only the api_v1 asset does that, at the end
        of a transform. So a manual repair fixes the database and leaves the
        endpoint exactly as it was.
      fix: >-
        Run `uis dagster run publish_api_v1`, or transform_and_publish if you also need a rebuild. It takes
        seconds and the endpoints return immediately. Nothing needs reinstalling,
        and this is NOT a PostgREST fault - it is serving the last schema it was
        told about.

  # ⚠️ EVERY ROW NAMES THE JOB THAT OWNS IT, and that is not decoration.
  #
  # This block used to list four Brreg crons with no owner, and two agents
  # independently read them as one job (urb-agents #780, #786). One of them
  # costed a public-API outage at 48x its real rate and nearly weighed a cadence
  # rollback against it — because "the Brreg cron" looked like a single thing
  # that ran every half hour and also rebuilt marts.
  #
  # It does not. `brreg_change_feed` polls; `brreg_transform` reconciles one
  # incremental model and cannot drop a view; `transform_and_publish` rebuilds
  # every mart and is the only one that touches api_v1. That distinction was true
  # in the code and invisible here, which is the same defect as a retraction that
  # does not travel with its claim.
  cadence:
    - cron: "0 6 * * *"
      job: daily_validation
      what: >-
        Post-ingest validation, one hour after transform_daily: every published
        relation answers a real HTTP request and returns its row count, and
        every URL meta_sources serves is dereferenced. Asked for by Røde Kors —
        "validate that all datasets that are ingested has an endpoint and it can
        be queried". WARN severity on both checks: a dead upstream link is a real
        defect and not a reason to fail a pipeline at 06:00. It is deliberately
        NOT chained to the transform by sensor, because that would fire it on
        brreg_transform every 30 minutes and dereference other people's hosts 48
        times a day.
    - cron: "0 2 * * 0"
      job: annual_sources_refresh
      what: ~37 annual public-sector sources — SSB, FHI, Bufdir
    - cron: "0 1 1 * *"
      job: klass_refresh
      what: SSB Klass classifications (kommune/fylke)
    - cron: "0,30 * * * *"
      job: brreg_change_feed
      what: >-
        Brønnøysundregistrene change feed — only what moved, ~114 records per
        cycle at the measured 3.8 changes a minute. Half-hourly because the
        register is a live subscription, not a daily table. Appends to raw only;
        rebuilds nothing and cannot affect the public API.
    - cron: "10,40 * * * *"
      job: brreg_transform
      what: >-
        Brreg reconciliation into marts — ONE incremental model, ten minutes
        behind each poll. The offset is deliberate: firing alongside the feed
        would reconcile data the feed had not written yet. Incremental means rows
        are inserted and deleted, never the table replaced, so no api_v1 view is
        disturbed by this job.
    - cron: "0 4 * * *"
      job: brreg_change_feed
      what: >-
        Frivillighetsregisteret — a full re-walk of ~72,800 organisations
        (~727 requests). Daily, NOT on the feed's cadence: this register has no
        change feed, so every refresh is the whole register. Same job as the
        half-hourly row above, different source and different automation
        condition — one job, two cadences.
    - cron: "0 5 * * *"
      job: transform_and_publish
      what: >-
        dbt transform and publish — no external calls. ⚠️ The ONLY scheduled job
        that rebuilds marts tables, and therefore the only one during which
        api_v1 views are briefly recreated. Each wrapper is restored immediately
        after its own mart, so the gap is milliseconds per view rather than the
        length of the run.

  # 🔴 KEPT, after being deleted and restored on 2026-09-13 — the reversal is the
  # useful part of this comment.
  #
  # imac was right that this duplicates `first_data.how`, and I deleted it on that
  # basis. Then I checked WHICH SURFACE each one reaches, from imac's own run of
  # `_install_summary_operational`:
  #
  #   end of install   install.note · first_data.jobs · automation · unscheduled
  #   uis template info  everything, including first_data.how
  #
  # ⚠️ `first_data.how` does NOT print at the end of an install. So deleting this
  # left the operator who is ABOUT TO RUN THE CHAIN seeing `brreg_bootstrap` in
  # the job list, absent from `unscheduled`, and nothing anywhere on that surface
  # saying it is a one-time load. It reads as a job they forgot to schedule.
  #
  # The duplicate was real; the conclusion was wrong. Two surfaces, two readers —
  # the fact belongs where the person about to act on it is looking, and the
  # reason belongs where someone investigating is looking.
  #
  # `unscheduled` means CANNOT run. This means MUST run, once, and then never
  # again. Collapsing them loses the only instruction an operator cannot skip.
  #
  # 🔴 DO NOT DELETE THIS KEY TO SILENCE `_warn_unrendered_operational`. Read the
  # paragraph below before concluding it is dead weight — in six weeks this
  # header is what someone tidying up will read, and the bus thread that settled
  # it is archaeology. (urb-agents #824)
  #
  # Stage 4 passed on UIS 1.6.70 with `_warn_unrendered_operational` SILENT, and
  # the warning went silent because tor-agent's renderer GREW to 15 keys and met
  # this artifact's 15 — NOT because any key here was removed. `manual_only` was
  # under a standing instruction to delete it as a duplicate of `unscheduled`; it
  # survived because someone checked which surface each key actually reaches and
  # put it back. ⚠️ Following that instruction would have destroyed the thing that
  # made the install pass, and the pass would have been read as confirmation that
  # deleting it was right.
  #
  # 🔵 The general shape, which is why it is worth this many lines: a key that
  # reaches no renderer looks identical to a key that is not needed. The cheap
  # fix is to delete it and watch the warning stop. The correct fix is to find
  # out which surface it was supposed to reach and why it did not — because the
  # warning is about the RENDERER, not about the content.
  # 🔴 THE JOBS NOTHING DECLARED. Until 2026-09-22 `publish_api_v1`,
  # `api_v1_checks` and `transform_checks` appeared in this artifact only as
  # prose — eight mentions, no map — while `operational.upgrade` instructed an
  # operator to end the sequence with `transform_checks`. The artifact told
  # someone to run a job it never declared (dev-templates, urb-agents #1378).
  #
  # ⚠️ They are on no cron and are not manual-only: they are chained off run
  # status. That was a missing CATEGORY, not a missing row, which is why
  # nobody noticed a gap in a list that looked complete.
  sensor_triggered:
    - job: publish_api_v1
      after: transform_and_publish succeeds
      why: >-
        dbt drops the api_v1 views by CASCADE when it swaps the marts tables,
        so they exist again only after this runs.
    - job: api_v1_checks
      after: publish_api_v1 succeeds
      why: >-
        the publish gate - does the public surface match the marts it wraps.
        Cheap and high-signal, so it reports before the long suite.
    - job: transform_checks
      after: api_v1_checks succeeds
      why: >-
        the dbt data-quality suite. transform_and_publish deliberately
        EXCLUDES tests, so a green transform contains none - these are them.

  manual_only: [brreg_bootstrap]

  # No scraper row: SCRAPER_CRON (Sunday 03:30) still exists in cadence.py, but
  # its only consumer was redcross-branches, which is parked in
  # UNSCHEDULED_SOURCES. Nothing carries that condition, so nothing polls at that
  # time and the block must not say Atlas scrapes anyone's website weekly. It
  # comes back when redcross unparks — the gate will require it then.
  #
  # Deliberately conservative: an annual statistical table is polled weekly, not
  # nightly. Nightly would be ~15,000 pointless requests a year against
  # public-sector APIs Atlas depends on staying welcome at.
  external_services: [SSB, FHI, Bufdir, Brønnøysundregistrene]

  # No automation condition, no freshness policy — these never self-trigger.
  # Parked pending a Red Cross API credential.
  unscheduled: [redcross-branches]

exports:
  api-url: "http://api-{{ params.app_name }}.localhost"
