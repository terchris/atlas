<!-- Atlas favicon — simplified variant of /img/logo.svg, optimised for the
     16px / 32px renderings browsers use in tabs / bookmarks. Drops the smaller
     decorative dots and tightens contrast so the mark still reads at tiny sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Atlas">
  <defs>
    <radialGradient id="atlasFaviconGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9ad6c2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0c6e50" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#atlasFaviconGrad)"/>
  <g stroke="#0c6e50" stroke-width="2" opacity="0.75" fill="none">
    <line x1="32" y1="32" x2="14" y2="22"/>
    <line x1="32" y1="32" x2="48" y2="20"/>
    <line x1="32" y1="32" x2="14" y2="44"/>
    <line x1="32" y1="32" x2="50" y2="46"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#0c6e50"/>
  <circle cx="14" cy="22" r="4" fill="#0c6e50"/>
  <circle cx="48" cy="20" r="3.5" fill="#0c6e50"/>
  <circle cx="14" cy="44" r="3.5" fill="#0c6e50"/>
  <circle cx="50" cy="46" r="4" fill="#0c6e50"/>
</svg>
