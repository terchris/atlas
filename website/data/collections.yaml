# collections.yaml — editorial dataset bundles for named use cases.
#
# Resolved at build time by website/scripts/generate-sources-registry.mjs:
# each entry becomes a /datasets/collections/<id> page in the catalog, plus
# a card on the homepage. Dataset references must match an existing
# source_id (raw upstream datasets) or view_id (api_v1 Atlas views) — the
# generator fails loudly when a referenced dataset is missing.
#
# Editorial discipline: keep each collection focused on one persona's
# named task. The "why" annotation on each dataset is the part Lisa /
# Jonas / Arne can scan in 30 seconds; the join_recipe is what they copy
# into their first SQL.

collections:
  - id: grant-application-essentials
    title: Grant-application essentials — child poverty
    persona: Lisa, tilskuddsansvarlig
    persona_task: |
      Writing a child-poverty grant application that names a kommune,
      backs the claim with real numbers, and survives a fact-check by
      a directorate's reviewer.
    intro: |
      A focused starter set for grant applications about child poverty
      at kommune resolution. Ordered from headline → ground truth →
      temporal depth → lived-experience proxy → Atlas synthesis. Together
      these five datasets answer the four questions every directorate
      reviewer asks: how many, how persistent, how that compares to the
      neighbours, and what the policy gap looks like.

      Every dataset here is at kommune resolution. They share a join key
      — `kommune_nr`, the 4-digit zero-padded kommune number — so a single
      query stitches the whole evidence base together.

    datasets:
      - id: bufdir-barnefattigdom
        why: |
          The headline indicator most directorates already cite. Bufdir's
          Barnefattigdom kommunemonitor is the standard reference for
          "how many children live in low-income households in this kommune".
      - id: ssb-08764
        why: |
          The SSB ground truth. Bufdir's monitor is derived from this table.
          Cite SSB when a reviewer wants the canonical source; cite Bufdir
          when you want the editorial framing.
      - id: ssb-12944
        why: |
          Persistent low-income (3-year average, EU-60 scale). The difference
          between *transient* and *persistent* poverty is the difference
          between a household between jobs and a household stuck. Reviewers
          read persistence as a stronger evidence base.
      - id: fhi-trangbodd
        why: |
          A lived-experience proxy: children in overcrowded housing. Closely
          correlates with low income but adds the "what does poverty feel
          like" dimension that grant narratives need. Pairs well with the
          income tables above.
      - id: coverage_gap_barnefattigdom
        why: |
          The Atlas synthesis view. Combines Bufdir's monitor with SSB's
          coverage to surface the kommuner where Bufdir didn't publish
          and where, if your application is about underserved data,
          you have a story to tell.

    join_recipe: |
      All five datasets join on `kommune_nr` — the 4-digit, zero-padded
      kommune number. A minimal query that pulls one kommune's evidence
      base (PostgREST):

      ```bash
      curl -sS '{{API_BASE}}/indicator_latest_values?kommune_nr=eq.0301&select=kommune_name,source_id,contents_code,value,year'
      ```

      Per-kommune values live in `indicator_latest_values`.
      `indicator_summary` is one row per (source, measure) across the whole
      country — coverage and value range, no kommune column — so it answers
      "what does this indicator look like nationally", not "what is the
      number for my kommune".

      To compare a kommune against its neighbours in the same fylke, swap
      `eq.0301` for `like.03*` — the leading two digits are the fylke.

      **Watch out**: the number is zero-padded, so Oslo is `0301`, not
      `301`. And kommune numbers are reissued by reform: Bærum was `3024`
      under Viken (2020-2023) and is `3201` today. A retired number returns
      200 with an empty array rather than an error — `dim_kommune` carries
      both, distinguished by `is_active`, so filter `is_active=eq.true`
      when you join against it.

      Only the curated `api_v1` relations are public. The upstream source
      tables are not exposed through this API; use `meta_sources` to see
      which relations publish a given source.
