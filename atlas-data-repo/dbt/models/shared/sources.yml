version: 2

sources:
  - name: raw
    description: "raw.* schema — shared infrastructure tables written by the scraping library (atlas-data-repo/ingest/src/lib/scraping/) and consumed across all scraper sources."
    schema: raw
    tables:
      - name: ingest_runs
        description: "One row per ingest invocation (scraper or API-source). Populated by ingest_runs.ts. The partial unique index raw_ingest_runs_one_inprogress_per_source enforces at most one in-progress run per source_slug — concurrent-run lock per INVESTIGATE-ngo-scraping-infrastructure §E.3.1. Feeds marts.mart_ingest_health."
        loaded_at_field: finished_at
      - name: sitemap_log
        description: "Per-URL discovery log, one row per (source_slug, url) across all scraping sources. Stores sitemap <lastmod> (NULL for HTML-index sources) and first/last seen timestamps. Drives fetch-skip and orphan detection per INVESTIGATE-ngo-scraping-infrastructure §C.2."
        loaded_at_field: last_seen_at
