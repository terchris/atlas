version: 2

sources:
  - name: raw
    description: "Atlas landing layer. Tables here are written by the atlas-data ingest modules (TypeScript) and read by dbt."
    schema: raw
    tables:
      - name: ssb_08764
        description: |
          SSB statistikkbanktabell 08764 — Personer under 18 år i husholdninger
          med lavinntekt (EU- og OECD-skala). Annual, region-resolved.
          Populated by atlas-data/ingest/src/sources/ssb-08764.
        loaded_at_field: loaded_at
        # Freshness thresholds: SSB publishes annually around February/March.
        # We warn if the landing table hasn't been touched in 400 days, error
        # at 800 days. These are intentionally generous; tightened once we
        # have a scheduler deciding when to ingest.
        freshness:
          warn_after: {count: 400, period: day}
          error_after: {count: 800, period: day}
        columns:
          - name: region_code
            description: "SSB region code — kommune, fylke, nasjon, or historical variant."
            data_tests:
              - not_null
          - name: year
            description: "Calendar year (from SSB's Tid dimension)."
            data_tests:
              - not_null
          - name: contents_code
            description: "SSB ContentsCode — one of Personer / EUskala50 / EUskala60 / OECDskala50 / OECDskala60."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['Personer', 'EUskala50', 'EUskala60', 'OECDskala50', 'OECDskala60']

      - name: ssb_12944
        description: |
          SSB statistikkbanktabell 12944 — Personer i husholdninger med vedvarende
          lavinntekt (EU-60), 3-årsperiode. Adds an age (Alder) dimension and
          uses rolling three-year periods as the time axis.
          Populated by atlas-data/ingest/src/sources/ssb-12944.
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 400, period: day}
          error_after: {count: 800, period: day}
        columns:
          - name: region_code
            description: "SSB region code."
            data_tests:
              - not_null
          - name: age_group
            description: "SSB Alder dimension — 999A (all ages), 00-17, 18-34, 35-49, 50-66, 067+."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['999A', '00-17', '18-34', '35-49', '50-66', '067+']
          - name: period
            description: "Three-year rolling period, e.g. 2022-2024. Stored verbatim from upstream Tid."
            data_tests:
              - not_null
          - name: contents_code
            description: "SSB ContentsCode — PersonerSeksti (count) or EUskalaSeksti (percent EU-60)."
            data_tests:
              - not_null
              - accepted_values:
                  values: ['PersonerSeksti', 'EUskalaSeksti']
