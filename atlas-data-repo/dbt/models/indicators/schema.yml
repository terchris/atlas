              values: ['ssb-12944']
      - name: region_code
        description: "SSB region code. Includes kommune, bydel, fylke, nasjon levels. Use kommune_nr for kommune joins."
        data_tests:
          - not_null
      - name: kommune_nr
        description: "4-digit kommune code; NULL for bydel/fylke/nasjon rows."
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: fylke_nr
        description: "2-digit fylke code; NULL for kommune/bydel/nasjon rows."
        data_tests:
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
      - name: age_group
        description: "SSB Alder code."
        data_tests:
          - not_null
          - accepted_values:
              values: ['999A', '00-17', '18-34', '35-49', '50-66', '067+']
      - name: period
        description: "Three-year rolling period as upstream code text."
        data_tests:
          - not_null
      - name: contents_code
        description: "SSB ContentsCode."
        data_tests:
          - not_null
          - accepted_values:
              values: ['PersonerSeksti', 'EUskalaSeksti']
      - name: value
        description: "Numeric value — count for PersonerSeksti, percent for EUskalaSeksti. NULL when suppressed."
      - name: status
        description: "SSB suppression marker. NULL when the cell has a plain numeric value."
      - name: updated_at
        description: "When the raw row was last loaded."
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - age_group
            - period
            - contents_code
