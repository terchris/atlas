version: 2

models:
  - name: indicators__ssb_08764
    description: |
      Per-source indicator passthrough for SSB 08764. One row per (region_code,
      year, contents_code). Materialised as a table in the marts schema; feeds
      the forthcoming indicator_values union.
    columns:
      - name: source_id
        description: "Always 'ssb-08764'. Distinguishes this source once unioned with others."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ssb-08764']
      - name: region_code
        description: "SSB region code, verbatim. Includes kommune, fylke, nasjon and historical variants — mixed levels. Use kommune_nr for kommune-only joins."
        data_tests:
          - not_null
      - name: kommune_nr
        description: "4-digit kommune code — populated only for kommune-level rows (NULL for fylke/nasjon/historical). Canonical join key to dim_kommune."
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: fylke_nr
        description: "2-digit fylke code — populated only for fylke-level rows. NULL otherwise."
        data_tests:
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
      - name: year
        description: "Calendar year."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2040
      - name: contents_code
        description: "Metric within the SSB table."
        data_tests:
          - not_null
          - accepted_values:
              values: ['Personer', 'EUskala50', 'EUskala60', 'OECDskala50', 'OECDskala60']
      - name: value
        description: "Numeric value — count for Personer, percent for the others. NULL when suppressed (see status)."
      - name: status
        description: "SSB suppression marker. NULL when the cell has a plain numeric value."
      - name: updated_at
        description: "When the raw row was last loaded into raw.ssb_08764 by the ingest module."
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - year
            - contents_code

  - name: indicators__ssb_06913
    description: |
      Per-source indicator passthrough for SSB 06913 (population change).
      Same Region × ContentsCode × Tid shape as indicators__ssb_08764.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: ['ssb-06913']
      - name: region_code
        description: "SSB region code with K_/F_/... prefix. Use kommune_nr for kommune joins."
        data_tests: [not_null]
      - name: kommune_nr
        description: "Kommune code extracted from K_xxxx prefixed rows. NULL for non-kommune rows."
        data_tests:
          # SSB 06913 retains historical kommune codes in its Region dimension
          # (mergers 1960-2024). dim_kommune currently holds active-today codes
          # only; extending it with history is tracked as a follow-up. Warn so
          # we see the mismatch without failing CI.
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
      - name: fylke_nr
        description: "Fylke code extracted from F_xx prefixed rows. NULL for non-fylke rows."
        data_tests:
          # Historical fylker (pre-2020 01-20 numbering) may appear — warn.
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
              config:
                severity: warn
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: 2050
      - name: contents_code
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - year
            - contents_code

  - name: indicators__ssb_06944
    description: |
      Per-source indicator passthrough for SSB 06944 (household income by
      household type). Preserves household_type column; consumers filter to
      `household_type = '0000'` for the all-households headline.
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: ['ssb-06944']
      - name: region_code
        data_tests: [not_null]
      - name: kommune_nr
        description: "4-digit kommune code; NULL for bydel/fylke/nasjon/rest-of-fylke (XX99) rows."
        data_tests:
          # SSB 06944 includes Svalbard (21xx), Jan Mayen (22xx), continental
          # shelf (23xx) kommune-like codes that aren't in Klass 131 mainland.
          # Warn — same pattern as the fylke test below and 07459's historical.
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config:
                severity: warn
      - name: fylke_nr
        description: "2-digit fylke code; NULL otherwise."
        data_tests:
          # SSB uses special 2-digit codes outside Klass 104 for Svalbard (21),
          # Jan Mayen (22), continental shelf (23), EU (25), abroad (26),
          # unknown (88). Warn instead of error — legitimate SSB codes for
          # aggregates beyond mainland Norway.
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
              config:
                severity: warn
      - name: household_type
        description: "SSB HusholdType code, '0000' = all households."
        data_tests: [not_null]
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2050
      - name: contents_code
        data_tests:
          - not_null
          - accepted_values:
              values: ['SamletInntekt', 'InntSkatt', 'AntallHushold']
      - name: updated_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - household_type
            - year
            - contents_code

