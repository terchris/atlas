      - name: region_code
        description: "SSB region code. Includes kommune, fylke, nasjon levels. Use kommune_nr for kommune joins."
        data_tests: [not_null]
      - name: kommune_nr
        description: "4-digit kommune code; NULL for fylke/nasjon rows."
        data_tests:
          # SSB 07459 covers 1986-2026 in its Region dimension so it retains
          # ~593 historical 4-digit codes (old Østfold 01xx, etc.) with 0
