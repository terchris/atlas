  - name: indicators__fhi_bor_alene
    description: |
      Per-source indicator passthrough for FHI table 187 (adults living alone).
      Renames FHI dimensions to Atlas canonical names (GEO → region_code/
      kommune_nr/fylke_nr, AAR → year + period, ALDER → age_group,
      MEASURE_TYPE → contents_code).
    columns:
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              values: ['fhi-bor-alene']
      - name: region_code
        data_tests: [not_null]
      - name: kommune_nr
        description: "4-digit kommune code; NULL for non-kommune rows. Joins to dim_kommune."
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: fylke_nr
        description: "2-digit fylke code; NULL otherwise."
        data_tests:
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
      - name: year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2050
      - name: age_group
        description: "FHI ALDER code in min_max form (e.g. '16_120')."
        data_tests: [not_null]
      - name: contents_code
        description: "RATE | SMR | TELLER, from FHI MEASURE_TYPE."
        data_tests:
          - not_null
          - accepted_values:
              values: ['RATE', 'SMR', 'TELLER']
      - name: updated_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - region_code
            - period
            - age_group
            - contents_code

