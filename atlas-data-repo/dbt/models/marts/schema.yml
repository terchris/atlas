version: 2

models:
  - name: fact_kommune_indicators
    description: |
      First cross-source mart. Long-format union of kommune-level indicators
      joined to dim_kommune and dim_fylke. One row per
      (source_id, kommune_nr, year, contents_code). Frontend and analyst
      consumers should read from this table when they need kommune-level
      indicator values regardless of which source produced them.

      Currently includes ssb-08764 (child poverty EU/OECD) and ssb-06913
      (population change). Sources with shape-mismatches (ssb-07459 by sex/age,
      ssb-12944 by age_group/period) are not here yet — they need either
      source-specific marts or an extended schema once use cases clarify.
    columns:
      - name: source_id
        description: "Atlas source identifier, e.g. 'ssb-08764'."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ssb-08764', 'ssb-06913', 'ssb-06944', 'fhi-bor-alene', 'ssb-13995', 'ssb-06947', 'ssb-06083', 'ssb-12292', 'ssb-12063', 'ssb-12131', 'ssb-12132', 'ssb-09429', 'fhi-trangbodd', 'fhi-mobbing', 'fhi-vgs-gjennomforing']
      - name: kommune_nr
        description: "4-digit kommune code. FK to dim_kommune."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
      - name: kommune_name
        description: "Joined from dim_kommune."
        data_tests: [not_null]
      - name: fylke_nr
        description: "2-digit fylke code (derived from kommune_nr in dim_kommune). FK to dim_fylke."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_fylke')
              field: fylke_nr
      - name: fylke_name
        description: "Joined from dim_fylke. NULL if kommune's fylke_nr isn't in dim_fylke (rare — happens for codes like Svalbard 21xx without a matching fylke)."
      - name: year
        description: "Calendar year."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: 2050
      - name: contents_code
        description: "Source-specific ContentsCode verbatim from upstream (e.g. 'EUskala60', 'Folkemengde')."
        data_tests: [not_null]
      - name: contents_label
        description: "Human-readable label for contents_code, verbatim from upstream."
      - name: value
        description: "Numeric value. Unit depends on (source_id, contents_code) — see the source's README. NULL when upstream suppressed the cell."
      - name: status
        description: "SSB suppression marker. NULL when value is present."
      - name: kommune_is_active
        description: "Whether the kommune is active today. False for historical kommune codes that only appear because the upstream retained them."
        data_tests:
          - not_null
      - name: updated_at
        description: "When the underlying raw row was last loaded."
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - kommune_nr
            - year
            - contents_code

  - name: fact_chapter_activities
    description: |
      The supply-side fact: one row per (chapter, activity) for every NGO in
      dim_ngo. Cross-NGO Coverage-gap queries join this to dim_activity (for
      service_category_code) and to dim_chapter (for is_active, chapter_level,
      kommune_nr filters).

      v1 contains Red Cross only; PLAN-003 adds Folkehjelp via a UNION ALL in
      the source CTE. Per-activity dormancy is not modelled in v1 — is_active
      inherits from the chapter; if Atlas later needs per-activity dormancy
      (Red Cross local active but its Norsktrening on hold), add a separate
      flag in supply__* and propagate.
    columns:
      - name: chapter_id
        data_tests:
          - not_null
          - relationships: { to: ref('dim_chapter'), field: chapter_id }
      - name: activity_id
        data_tests:
          - not_null
          - relationships: { to: ref('dim_activity'), field: activity_id }
      - name: ngo_orgnr
        description: "Denormalised from dim_chapter for query convenience."
        data_tests:
          - not_null
          - relationships: { to: ref('dim_ngo'), field: orgnr }
      - name: kommune_nr
        description: "Denormalised from dim_chapter. NULL for non-local chapters (regional, national)."
        data_tests:
          - relationships:
              to: ref('dim_kommune')
              field: kommune_nr
              config: { severity: warn }
      - name: local_activity_name
        description: "NGO's local display string for the activity at this chapter (e.g. 'Modum Røde Kors Hjelpekorps')."
      - name: canonical_name
        description: "Denormalised from dim_activity for query convenience."
        data_tests: [not_null]
      - name: is_active
        data_tests:
          - not_null
          - accepted_values: { values: [true, false] }
      - name: source_id
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chapter_id, activity_id]

  - name: mart_ingest_health
    description: |
      Per-source ingest-run health. One row per scraper or API-source,
      showing the most recent COMPLETED run (finished_at IS NOT NULL).
      Minimal v1 surface per Q14 of
      INVESTIGATE-ngo-scraping-infrastructure.md — just the three columns
      needed to answer "which sources are failing?" and "which sources
      haven't refreshed recently?". Empty until the first scraper writes
      to raw.ingest_runs.
    columns:
      - name: source_slug
        description: "Source identifier matching raw.ingest_runs.source_slug and the npm ingest:<slug> script."
        data_tests:
          - not_null
          - unique
      - name: last_run_at
        description: "finished_at of the most recent completed run for this source."
        data_tests:
          - not_null
      - name: last_status
        description: "'ok' when exit_code = 0, otherwise 'fail'."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ok', 'fail']
