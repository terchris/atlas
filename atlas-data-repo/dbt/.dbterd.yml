# dbterd config for the Atlas marts ERD.
# Run `uv run dbterd run` from this directory; flags below take effect.
# See docs/stack/erd.md (output) and atlas-data-repo/dbt/README.md
# (regeneration steps + when to refresh).

target: mermaid
artifacts-dir: target
output: ../../docs/stack
output-file-name: erd.md

# Limit the diagram to the marts schema — the public contract Atlas
# exposes. raw.* is intentionally out of scope.
select:
  - schema:marts

# Default algorithm reads `relationships:` data tests from schema.yml,
# which PLAN-003 populated comprehensively. Don't change unless we move
# to dbt model contracts or the semantic layer.
algo: test_relationship

# Include seeds so the 5 marts.ref_* tables and their inbound edges
# render. dbterd's CLI docs only formally list `model` and `source`,
# but the underlying filter accepts `seed` too — verified working in
# PLAN-dbterd-install-and-document Phase 2.2.
resource-type:
  - model
  - source
  - seed
